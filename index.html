    const dismissAttr = dismissAction ? ` data-action="${dismissAction}"` : '';
    return `
      <div class="target-grid-wrap">
        ${contentHtml}
        <div class="board-popup"${dismissAttr}><div class="board-popup-box">${popupHtml}</div></div>
      </div>
    `;
  }

  function renderNight(state) {
    const role = Game.currentNightRole();
    const canGoBackNight = state.nightCursor > 0;
    // A different role than what was last drawn - either normal forward progress
    // (confirmed/skipped), or the narrator navigated (night-back/jump-night-step).
    // Either way, re-derive the local selection vars fresh from state.nightActions
    // for this role (see syncNightSelectionFromState()) rather than leaving
    // whatever the PREVIOUS role's board left behind. If it's the same role as
    // last render (e.g. just toggling a multi-select pick), skip this - it would
    // wipe out the in-progress, not-yet-confirmed tap.
    if (role && role.id !== lastNightRoleShown) {
      syncNightSelectionFromState(state, role);
      lastNightRoleShown = role.id;
    } else if (!role) {
      lastNightRoleShown = null;
    }
    // Ran past the last role in tonight's order (see advanceNightCursor() in
    // game.js) - the night doesn't resolve automatically any more, so this is
    // reachable and stays showing until the narrator confirms (see
    // renderNightSummary()/finish-night).
    if (!role) {
      renderNightSummary(state);
      return;
    }
    // Anyone abducted by the UFO can still be picked as a target by other roles too -
    // the action just won't have any effect on them (see game.js resolveNight/investigateResult).
    // The UFO itself can't pick itself either, but stays visible on the board (disabled)
    // instead of vanishing from the list - same for anyone else a role can't target.
    const targetable = Game.alivePlayers();

    // Rendőr's result and the Csonkoló's body-part pick are both popups that sit on
    // top of their OWN role's target board, not the next one - Game.recordNightAction()/
    // recordMaimAction() only runs once the board's own "Következő" footer button is
    // pressed a second time (see the generic and maim branches below), so the board
    // underneath doesn't advance to the next role until then. Neither popup has a
    // button of its own - the shared footer button confirms both. The Csonkoló's
    // popup can also be cancelled by tapping away (back to target-picking); Rendőr's
    // result can't - it only advances via the footer button.
    let popupHtml = '';
    let investigatePopupActive = false;
    let maimPopupActive = false;
    let popupDismissAction;
    if (investigatePendingTargetId) {
      // No dismissAction - unlike the Csonkoló's popup, tapping away doesn't cancel
      // this one, only the board's own "Következő" button does (see the generic
      // branch below, where nextAction/nextEnabled switch to confirm-investigate).
      investigatePopupActive = true;
      const result = Game.investigateResult(investigatePendingTargetId);
      const label = result && result.abducted ? 'Elrabolva' : teamLabelSingular(result ? result.team : '');
      // Elrabolva isn't a team, just the UFO having put them out of reach - its own
      // emoji. "Gyilkos" only means the gyilkosok TEAM (investigateResult() never
      // reveals the exact role), and Csonkoló is on that team too, so both of the
      // team's role emoji lead the label - the narrator can't tell which from this
      // alone, same as in the game itself.
      const icon = result && result.abducted ? roleActionEmoji('ufo')
        : result && result.team === 'gyilkosok' ? `${roleActionEmoji('gyilkos')}${roleActionEmoji('csonkolo')}`
        : result && result.team === 'polgarok' ? roleActionEmoji('polgar')
        : '';
      // Same .reason-line markup as the mock round's "meghalt/elrabolta" popup - not
      // .prompt - so the two boxes end up pixel-identical instead of drifting apart.
      popupHtml = `<div class="reason-line">${icon ? `${icon} ` : ''}${label}</div>`;
    } else if (maimPendingTargetId) {
      maimPopupActive = true;
      popupDismissAction = 'cancel-maim-target';
      popupHtml = `
        <p class="prompt">Melyik testrészét csonkítod meg?</p>
        <div class="popup-choice-row">
          <button class="${maimSelectedPart === 'kez' ? 'selected' : ''}" data-action="select-maim-part" data-part="kez">✋ Kéz<br>(Nem szavazhat)</button>
          <button class="${maimSelectedPart === 'nyelv' ? 'selected' : ''}" data-action="select-maim-part" data-part="nyelv">👅 Nyelv<br>(Nem beszélhet)</button>
        </div>
      `;
    }

    // No !role branch here - game.js auto-resolves the night the moment the queue
    // actually empties (see finishNightStep()), so renderNight() is never called
    // with an empty queue; the phase has already moved on to DAY/ENDED by then.

    if (!roleHasActor(state, role)) {
      // Every holder of this role is dead or was abducted tonight - the turn still
      // gets called (see beginNight()'s comment in game.js), but nothing can be picked.
      // Keep showing the normal-looking full board underneath; the popup covers it,
      // explaining why - either investigate's result if that's still pending, or this
      // role's own reason as a fallback. Dead holders aren't part of Game.alivePlayers()
      // any more, so they're spliced back in just for this board.
      const holders = state.players.filter((p) => p.roleId === role.id);
      const deadHolders = holders.filter((p) => !p.alive);
      // Same two-part tile markup (name line + reserved emoji line) as every other
      // night screen's target-grid, even though nothing goes in the emoji line here -
      // otherwise these tiles come out shorter than the ones on other roles' turns,
      // and the whole board visibly jumps in height when moving to/from this screen.
      const board = [...Game.alivePlayers(), ...deadHolders]
        .map((p) => `<button disabled><span class="tile-name-line">${playerLabel(p)}</span><span class="tile-emoji-line"></span></button>`)
        .join('');
      const reasonLines = holders.map((p) => {
        const reason = !p.alive ? '💀 Meghalt' : `${roleActionEmoji('ufo')} Elrabolta az UFO`;
        return `<div class="reason-line">${reason}</div>`;
      }).join('');
      app.innerHTML = `
        <div class="card">
          ${nightProgressHtml(state)}
          <div class="roles-info-row night-role-header">
            <span class="badge ${role.team}">${roleEmoji(role)}</span>
            <strong>${role.name}</strong>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          ${wrapWithPopup(`<div class="target-grid">${board}</div>`, popupHtml || reasonLines, popupHtml ? popupDismissAction : undefined)}
          <footer class="actions">
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button class="primary" data-action="skip-night">Tovább</button>
          </footer>
        </div>
      `;
      return;
    }

    if (role.nightAction === 'link') {
      const capacity = 2;
      // Once both picks are made, this pair REPLACES na.cupido's confirmed pair
      // for every tile - not just the two selected ones - via
      // resolveTentativeNight(), so if the narrator is re-editing an
      // already-confirmed bond: a third player who was only
      // abducted/bond-shielded/bond-healed via the OLD pairing's chain-drag stops
      // showing that the moment the new pair no longer includes their old
      // partner, and the two newly picked players immediately preview whatever a
      // confirmed bond between THEM would cause - all before "Következő" is even
      // pressed, not just after.
      const override = linkSelectedIds.length === 2 ? { role: 'cupido', pairIds: [...linkSelectedIds] } : undefined;
      const board = targetable.map((p) => {
        const isSelected = linkSelectedIds.includes(p.id);
        const preview = isSelected ? roleActionEmoji('cupido') : '';
        return `<button class="assignee-card${isSelected ? ' selected' : ''}" data-action="toggle-link-target" data-id="${p.id}">${nightTileLabel(state, p, preview, 'cupido', override)}</button>`;
      }).join('');

      app.innerHTML = `
        <div class="card">
          ${nightProgressHtml(state)}
          <div class="roles-info-row night-role-header">
            <span class="badge ${role.team}">${roleEmoji(role)}</span>
            <strong>${role.name}</strong>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          <p class="muted">Válassz ki két embert, akiket ma éjjelre összekötsz. (${linkSelectedIds.length}/2 kiválasztva)</p>
          ${wrapWithPopup(`<div class="target-grid">${board}</div>`, popupHtml, popupDismissAction)}
          <footer class="actions">
            <button class="pin-left" data-action="skip-night">Kihagyás</button>
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button class="primary" data-action="confirm-link" ${linkSelectedIds.length === capacity ? '' : 'disabled'}>Következő</button>
          </footer>
        </div>
      `;
      return;
    }

    if (role.nightAction === 'kill') {
      // Gyilkos picks state.killsPerNight targets at once (1 by default, see the
      // setup screen) - same multi-select pattern as Cupido, just with a
      // configurable capacity instead of a fixed 2, and its own recorder
      // (recordKillAction) since the generic single-target one only ever handles
      // exactly one pick. Game.killCapacity() clamps that setting down to however
      // many players are actually still alive, so a high killsPerNight can never
      // leave this permanently unreachable late-game.
      const capacity = Game.killCapacity();
      const killPartnerIds = killSelectedIds.map((id) => linkedPartnerId(state, id)).filter(Boolean);
      // No override needed here - Gyilkos never edits UFO/Cupido/Orvos/Csonkoló's
      // own picks, so resolveTentativeNight() just reads whatever's already
      // confirmed for those (immunity is a static role trait, so it applies
      // regardless of order or confirmation).
      const tonightPreview = resolveTentativeNight(state);
      // Whether the kill on a given SELECTED candidate would even land - checked
      // live so an immune Katona (or an already-abducted/protected candidate, if
      // the narrator's revisited Gyilkos after UFO/Orvos already acted) previews
      // as voided the moment they're tapped, not just once the whole night
      // resolves. A voided candidate's bonded partner (if any) previews the same
      // way, since resolveNight() shares the outcome between them.
      const voidedSelectedIds = killSelectedIds.filter((id) => tonightPreview.killVoidedFor(id));
      const board = targetable.map((p) => {
        const isSelected = killSelectedIds.includes(p.id);
        const isPartner = killPartnerIds.includes(p.id);
        if (!isSelected && !isPartner) {
          return `<button class="assignee-card" data-action="toggle-kill-target" data-id="${p.id}">${nightTileLabel(state, p, '', 'gyilkos')}</button>`;
        }
        const representedId = isSelected ? p.id : killSelectedIds.find((id) => linkedPartnerId(state, id) === p.id);
        const voided = representedId && voidedSelectedIds.includes(representedId);
        const preview = voided ? voidedMarker('💀') : '💀';
        return `<button class="assignee-card${isSelected ? ' selected' : ''}" data-action="toggle-kill-target" data-id="${p.id}">${nightTileLabel(state, p, preview, 'gyilkos')}</button>`;
      }).join('');

      app.innerHTML = `
        <div class="card">
          ${nightProgressHtml(state)}
          <div class="roles-info-row night-role-header">
            <span class="badge ${role.team}">${roleEmoji(role)}</span>
            <strong>${role.name}</strong>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          <p class="muted">Válassz ki ${capacity} embert, akiket ma éjjel megöltök. (${killSelectedIds.length}/${capacity} kiválasztva)</p>
          ${wrapWithPopup(`<div class="target-grid">${board}</div>`, popupHtml, popupDismissAction)}
          <footer class="actions">
            <button class="pin-left" data-action="skip-night">Kihagyás</button>
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button class="primary" data-action="confirm-kill" ${killSelectedIds.length === capacity ? '' : 'disabled'}>Következő</button>
          </footer>
        </div>
      `;
      return;
    }

    if (role.nightAction === 'maim') {
      // The body-part choice is a popup on top of this same board (built above into
      // popupHtml when maimPendingTargetId is set) instead of a separate screen - the
      // target-picking step just stays visible underneath while it's open. The same
      // "Következő" footer button drives both steps: picks the target first, then
      // (once the popup is open) confirms the selected body part.
      // The UFO always acts before Csonkoló, and Orvos can too if the narrator's
      // revisited it since - either way, tapping a candidate already voided by
      // one of those shows a dimmed 🪚 here, before "Következő" even picks a
      // body part.
      const override = nightSelectedId ? { role: 'csonkolo', targetId: nightSelectedId } : undefined;
      const tonightPreview = resolveTentativeNight(state, override);
      const selectedPartnerId = nightSelectedId ? tonightPreview.partnerOf(nightSelectedId) : null;
      const candidateVoided = tonightPreview.csonkoloVoided;
      const targets = targetable.map((p) => {
        const isSelected = p.id === nightSelectedId;
        const csonkoloEmoji = candidateVoided ? voidedMarker(roleActionEmoji('csonkolo')) : roleActionEmoji('csonkolo');
        const preview = (isSelected || p.id === selectedPartnerId) ? csonkoloEmoji : '';
        return `<button class="${isSelected ? 'selected' : ''}" data-action="select-night-target" data-id="${p.id}">${nightTileLabel(state, p, preview, 'csonkolo', override)}</button>`;
      }).join('');
      const nextAction = maimPopupActive ? 'confirm-maim-part' : 'confirm-maim-target';
      const nextEnabled = maimPopupActive ? !!maimSelectedPart : !!nightSelectedId;
      app.innerHTML = `
        <div class="card">
          ${nightProgressHtml(state)}
          <div class="roles-info-row night-role-header">
            <span class="badge ${role.team}">${roleEmoji(role)}</span>
            <strong>${role.name}</strong>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          ${wrapWithPopup(`<div class="target-grid">${targets}</div>`, popupHtml, popupDismissAction)}
          <footer class="actions">
            <button class="pin-left" data-action="skip-night">Kihagyás</button>
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button class="primary" data-action="${nextAction}" ${nextEnabled ? '' : 'disabled'}>Következő</button>
          </footer>
        </div>
      `;
      return;
    }

    // Gyilkos has its own branch above (multi-select) - only Orvos/Pék/UFO
    // (bond-transfer) and Rendőr (no bond-transfer) reach here.
    // Same idea as Cupido's override, for the two roles whose own pick can void
    // an already-shown Gyilkos/Katona/Orvos marker: the UFO (abduct) and Orvos
    // (protect) both act after Gyilkos, so tapping (not yet confirming) a
    // candidate who's already a kill target should immediately preview the void,
    // not just after "Következő".
    const override = !nightSelectedId ? undefined
      : role.id === 'ufo' ? { role: 'ufo', targetId: nightSelectedId }
      : role.id === 'orvos' ? { role: 'orvos', targetId: nightSelectedId }
      : undefined;
    const tonightPreview = resolveTentativeNight(state, override);
    // Passed to every tile, not just the selected one, so a bond-transfer
    // partner (see bondTransfers below) sees it too.
    const selectedPartnerId = nightSelectedId ? tonightPreview.partnerOf(nightSelectedId) : null;
    // Protecting someone the UFO already took is moot - they're untouchable
    // tonight regardless of the bond, same as a voided kill/maim - so the Orvos's
    // own 🩹 preview (and the bond-transfer partner's, if any) shows dimmed as
    // soon as an already-abducted candidate is tapped, not just after confirming.
    const orvosTargetAbducted = role.id === 'orvos' && !!nightSelectedId && tonightPreview.forPlayer(nightSelectedId).abducted;
    const targets = targetable.map((p) => {
      const isSelected = p.id === nightSelectedId;
      // The UFO can't abduct itself, and there's no point in the Rendőr investigating
      // themselves - both still shown on the board, just disabled.
      const selectable = !((role.id === 'ufo' && p.roleId === 'ufo') || (role.id === 'nyomozo' && p.roleId === 'nyomozo'));
      const bondTransfers = role.id === 'orvos' || role.id === 'pek' || role.id === 'ufo';
      const roleEmojiHere = orvosTargetAbducted ? voidedMarker(roleActionEmoji(role.id)) : roleActionEmoji(role.id);
      const partnerPreview = bondTransfers && p.id === selectedPartnerId ? roleEmojiHere : '';
      const preview = isSelected ? roleEmojiHere : partnerPreview;
      const cls = isSelected ? 'selected' : '';
      const attrs = selectable ? `data-action="select-night-target" data-id="${p.id}"` : 'disabled';
      return `<button class="${cls}" ${attrs}>${nightTileLabel(state, p, preview, role.id, override)}</button>`;
    }).join('');

    // The same "Következő" footer button drives both steps of Rendőr's investigate,
    // same as the Csonkoló's maim: picks the target first, then (once the result
    // popup is open) acknowledges it and actually advances.
    const nextAction = investigatePopupActive ? 'confirm-investigate' : 'confirm-night-target';
    const nextEnabled = investigatePopupActive ? true : !!nightSelectedId;

    app.innerHTML = `
      <div class="card">
        ${nightProgressHtml(state)}
        <div class="roles-info-row night-role-header">
          <span class="badge ${role.team}">${roleEmoji(role)}</span>
          <strong>${role.name}</strong>
        </div>
        <p class="prompt">${role.actionPrompt || ''}</p>
        ${wrapWithPopup(`<div class="target-grid">${targets}</div>`, popupHtml, popupDismissAction)}
        <footer class="actions">
          <button class="pin-left" data-action="skip-night">Kihagyás</button>
          <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
          <button class="primary" data-action="${nextAction}" ${nextEnabled ? '' : 'disabled'}>Következő</button>
        </footer>
      </div>
    `;
  }

  // Player-by-player "who did what to them tonight" rows - same base row shape
  // as the "Szerepek kiosztva" roster (role badge + name on the left, sorted by
  // role), with the confirmed night-action emoji (nightOutcomeEmoji()) on the
  // right instead of a second name. Shared, identical markup for the
  // end-of-night summary (renderNightSummary() below), the Day screen's own
  // collapsed "Éjszakai összefoglaló", and (via a reconstructed historical
  // state - see historicalRoundState() in the ended screen) a past round's
  // page in the post-game history.
  //
  // dayDeaths (optional): [{playerId, cause: 'vote'|'hunter'}] - appended to
  // the right of whoever's row it names, same white/black coffin the live
  // day-vote reveal uses, plus which mechanism caused it. Only ever passed by
  // the ended screen - during an ACTUAL day these haven't happened yet at the
  // point this row list is shown (it's rendered before that day's voting).
  function nightSummaryRowsHtml(state, dayDeaths = []) {
    return [...state.players]
      .sort((a, b) => roleSortIndex(a.roleId) - roleSortIndex(b.roleId))
      .map((p) => {
        const pRole = Game.getRole(p.roleId);
        const actions = nightOutcomeEmoji(state, p.id).trim();
        const dayDeath = dayDeaths.find((d) => d.playerId === p.id);
        let dayMarker = '';
        if (dayDeath) {
          // Just the cause + a plain coffin here, no team color - this only
          // ever renders in the post-game history's compact row list (see
          // dayDeaths' own comment above), where the role badge on the LEFT of
          // this same row already reveals the team, so repeating it here would
          // be redundant.
          const causeEmoji = dayDeath.cause === 'hunter' ? roleActionEmoji('vadasz') : '🗳️';
          dayMarker = `${causeEmoji}⚰️`;
        }
        // Joined with a single space only where both sides actually exist -
        // otherwise a player with no night actions but a day death would show
        // a stray leading space before the coffin marker.
        const rightContent = [actions, dayMarker].filter(Boolean).join(' ');
        return `<li${p.alive ? '' : ' class="dead"'}><span class="row-left"><span class="badge ${pRole.team}">${roleEmoji(pRole)}${pRole.name}</span> ${escapeHtml(p.name)}</span><span class="row-right muted">${rightContent}</span></li>`;
      }).join('');
  }

  // Shown once state.nightCursor has run past every role in tonight's order
  // (currentNightRole() === null - see renderNight() above) instead of the
  // night resolving straight away - a last look at what got picked before
  // actually confirming, same list as the Day screen shows afterward (see
  // nightSummaryRowsHtml()). Going back to fix a role is still one tap away via
  // the progress bar's own steps at the top (nightProgressHtml()/jump-night-step).
  function renderNightSummary(state) {
    app.innerHTML = `
      <div class="card">
        ${nightProgressHtml(state)}
        <h2>Éjszaka vége</h2>
        <p class="muted">Ha még módosítanál valamit, kattints egy szerep ikonjára fent. Ha minden rendben, jöhet a reggel.</p>
        <ul class="player-list">${nightSummaryRowsHtml(state)}</ul>
        <footer class="actions">
          <button data-action="night-back">Vissza</button>
          <button class="primary" data-action="finish-night">Felkel a város!</button>
        </footer>
      </div>
    `;
  }

  // ---- Day screen ----

  let daySelectedId = null; // single-target day pick (elimination or a Vadász's shot), until confirmed
  let dayEliminationPopupOpen = false; // the most recent coffin reveal (see renderDay()) -
                                        // dimmed-board-plus-popup, same as every other
                                        // night/day reveal (wrapWithPopup()), not a banner.
                                        // Tapping away dismisses it and reopens the board
                                        // for another pick, same as the Csonkoló's popup.

  function renderDay(state) {
    const alive = Game.alivePlayers();
    const deaths = state.pendingDeaths
      .map((id) => state.players.find((p) => p.id === id))
      .filter(Boolean);

    // Never the affected PLAYER's own role emoji (that would leak who they are) -
    // but every banner below leads with the ACTING role's own emoji, labelling
    // which mechanic the line is about, same as abductBanner/cupidoBanner/
    // healBanner further down. state.pendingDeaths only ever comes from the
    // Gyilkos's kill (or a Cupido bond dragging its partner along), so that's
    // always the right emoji to lead with here too.
    const deathBanner = deaths.length === 0
      ? `<div class="banner info">Mindenki túlélte az éjszakát.</div>`
      : `<div class="banner warn">${roleActionEmoji('gyilkos')} Éjjel meghalt: <strong>${deaths.map((p) => escapeHtml(p.name)).join(', ')}</strong></div>`;

    // Most roles die anonymously (only the name is announced above) - a few (see
    // roles.js's revealRoleOnDeath) get their own separate line naming the role -
    // that role's own emoji, since the point here is exactly to reveal it.
    const revealBanner = deaths
      .map((p) => Game.getRole(p.roleId))
      .filter((role) => role && role.revealRoleOnDeath)
      // Plain role.emoji, not roleEmoji()'s span - that adds its own
      // margin-right for when it sits inside a badge, which would double up
      // with the literal space here and push the text further right than
      // every other banner around it.
      .map((role) => `<div class="banner warn">${role.emoji} Meghalt a ${escapeHtml(role.name)}!</div>`)
      .join('');

    // The Pék's own action doesn't count if the UFO abducted the Pék himself
    // that night - "és az ő éjszakai szerepe sem érvényesül" (roles.js's UFO
    // description), same rule resolveNight() (game.js) already applies to
    // Orvos/Cupido/Csonkoló - nobody got any bread that round.
    const pekPlayer = state.players.find((p) => p.roleId === 'pek');
    const pekAbducted = !!pekPlayer && state.abductedIds.includes(pekPlayer.id);
    const breadAction = pekAbducted ? null : state.nightActions['pek'];
    // Cupido's bond drags the partner in here too, same as the other night actions.
    const breadPartnerId = breadAction ? linkedPartnerId(state, breadAction.targetId) : null;
    const breadRecipients = breadAction
      ? [breadAction.targetId, breadPartnerId].filter(Boolean).map((id) => state.players.find((p) => p.id === id)).filter(Boolean)
      : [];
    const breadBanner = breadRecipients.length
      ? `<div class="banner info">${roleActionEmoji('pek')} Ma reggel kenyeret kapott: <strong>${breadRecipients.map((p) => escapeHtml(p.name)).join(', ')}</strong></div>`
      : '';

    // Unifies both starvation triggers (see resolveNight() in game.js) into one
    // user-facing "days without bread" count - abducted, dead, or just skipped,
    // it's all one streak (state.pekHungerStreak - see resolveNight()) that only
    // resets to 0 the moment bread IS actually given, even on the same round
    // the Pék then dies from something else that night - so this and
    // breadBanner above never contradict each other on the same day. Reaching
    // 3 already ends the game during resolveNight(), before this screen can
    // ever render, so this only ever shows 0-2 here.
    const starvationBanner = state.pekHungerStreak > 0
      ? `<div class="banner warn"><div class="banner-row"><span>${roleActionEmoji('pek')} Ma senki nem kapott kenyeret.</span><strong>${state.pekHungerStreak}/3</strong></div></div>`
      : '';

    const maimBanner = state.pendingMaim
      .map((m) => ({ ...m, player: state.players.find((p) => p.id === m.targetId) }))
      .filter((m) => m.player && m.player.alive)
      .map((m) => `<div class="banner warn">${roleActionEmoji('csonkolo')} <strong>${escapeHtml(m.player.name)}</strong> ma ${m.bodyPart === 'kez' ? 'nem szavazhat' : 'nem beszélhet'}.</div>`)
      .join('');

    // Only the one morning it happens (see katonaShieldLostRound's own comment
    // in freshState()) - the shield itself is gone from that point on (no more
    // 🛡️ marker anywhere), this is just the one-time announcement of it.
    const shieldLostBanner = state.katonaShieldLostRound === state.round
      ? `<div class="banner warn">${roleActionEmoji('katona')} A katona elvesztette a pajzsát.</div>`
      : '';

    // Every abducted id, direct UFO pick or a Cupido-bonded partner chain-dragged
    // along (see recordLinkAction() in game.js) - both were "taken" as far as the
    // group's concerned. Each of these three banners leads with the acting role's
    // own emoji (not the affected player's - that's still never shown here, see
    // the plain-names note above) just to label which mechanic the line is about.
    const abductedPlayers = state.abductedIds.map((id) => state.players.find((p) => p.id === id)).filter(Boolean);
    const abductBanner = abductedPlayers.length
      ? `<div class="banner info">${roleActionEmoji('ufo')} Az UFO elrabolta: <strong>${abductedPlayers.map((p) => escapeHtml(p.name)).join(', ')}</strong></div>`
      : '';

    const linkAction = state.nightActions['cupido'];
    const linkedPlayers = linkAction && linkAction.pairIds
      ? linkAction.pairIds.map((id) => state.players.find((p) => p.id === id)).filter(Boolean)
      : [];
    const cupidoBanner = linkedPlayers.length === 2
      ? `<div class="banner info">${roleActionEmoji('cupido')} A Cupido összekötötte: <strong>${linkedPlayers.map((p) => escapeHtml(p.name)).join(' és ')}</strong></div>`
      : '';

    // "Sikeres" csak akkor, ha (a) az UFO nem vitte el ugyanazt a célpontot (vagy
    // annak Cupido-párját) - ugyanaz a feltétel, mint ami az éjszakai
    // összefoglalóban elhalványítja az Orvos jelzését (lásd nightOutcomeByRole())
    // - ÉS (b) tényleg történt ellene kísérlet: a gyilkosok vagy a Csonkoló őt
    // (vagy a párját) célozták meg aznap éjjel. Enélkül a védés nem "mentett meg"
    // senkit, nincs mit bejelenteni.
    const healAction = state.nightActions['orvos'];
    const healPartnerId = healAction ? linkedPartnerId(state, healAction.targetId) : null;
    const healWasAbducted = !!healAction
      && (state.abductedIds.includes(healAction.targetId) || (!!healPartnerId && state.abductedIds.includes(healPartnerId)));
    const killAction = state.nightActions['gyilkos'];
    const maimAction = state.nightActions['csonkolo'];
    const healWasAttacked = !!healAction && (
      (!!killAction && !!killAction.targetIds
        && (killAction.targetIds.includes(healAction.targetId) || (!!healPartnerId && killAction.targetIds.includes(healPartnerId))))
      || (!!maimAction && (maimAction.targetId === healAction.targetId || (!!healPartnerId && maimAction.targetId === healPartnerId)))
    );
    const healTarget = healAction ? state.players.find((p) => p.id === healAction.targetId) : null;
    const healBanner = healAction && healTarget && !healWasAbducted && healWasAttacked
      ? `<div class="banner info">${roleActionEmoji('orvos')} Sikeres gyógyítás történt.</div>`
      : '';

    // Closed by default - the announcements above already cover the outcomes that
    // matter; this is just for whoever wants the full picture of who did what.
    // Same rows the end-of-night summary screen shows, right before the
    // narrator confirmed and moved on (see nightSummaryRowsHtml()).
    const nightSummary = `
      <details class="night-summary">
        <summary>Éjszakai összefoglaló</summary>
        <ul class="player-list">${nightSummaryRowsHtml(state)}</ul>
      </details>
    `;

    // Held off while the Vadász's OWN coffin popup is still up (see
    // dayEliminationPopupOpen below) - eliminatePlayer() sets pendingHunterShot
    // the instant they're voted out, before the narrator's even seen that reveal,
    // so this only takes over once that popup's been dismissed.
    if (state.pendingHunterShot && !dayEliminationPopupOpen) {
      const shooter = state.players.find((p) => p.id === state.pendingHunterShot);
      const shotTargets = alive.map((p) => {
        const isSelected = p.id === daySelectedId;
        return `<button class="${isSelected ? 'selected' : ''}" data-action="select-day-target" data-id="${p.id}"><span class="tile-name-line">${playerLabel(p)}</span></button>`;
      }).join('');
      app.innerHTML = `
        <div class="card">
          <div class="banner warn"><strong>${escapeHtml(shooter ? shooter.name : 'A vadász')}</strong> (Vadász) utolsó tettként lelő valakit - válaszd ki, kit!</div>
          <div class="target-grid">${shotTargets}</div>
          <footer class="actions">
            <button class="primary" data-action="confirm-hunter-shot" ${daySelectedId ? '' : 'disabled'}>Következő</button>
          </footer>
        </div>
      `;
      return;
    }

    // No cap any more on how many can be voted out in one day (see
    // eliminatePlayer() in game.js) - the target grid stays active between
    // eliminations, so this only ever shows a popup for the MOST RECENT one
    // (state.dayEliminatedIds' last entry), same dimmed-board-plus-popup
    // pattern as every other reveal (wrapWithPopup()) - not a permanent banner.
    // White for a polgárok-aligned role, black for a gyilkosok-aligned one -
    // only two colors, so semleges counts as white here (nothing crueler to hint at).
    const lastEliminatedId = state.dayEliminatedIds[state.dayEliminatedIds.length - 1];
    const lastEliminated = lastEliminatedId ? state.players.find((p) => p.id === lastEliminatedId) : null;
    let coffinPopupHtml = '';
    if (dayEliminationPopupOpen && lastEliminated) {
      const role = Game.getRole(lastEliminated.roleId);
      const guilty = !!role && role.team === 'gyilkosok';
      const label = guilty ? 'Fekete' : 'Fehér';
      coffinPopupHtml = `<div class="reason-line">${label} koporsóban temették el:<br><span class="coffin-name-row"><span class="coffin-icon">${coffinBadge(guilty)}</span><strong>${escapeHtml(lastEliminated.name)}</strong></span></div>`;
    }

    const targets = alive.map((p) => {
      const isSelected = p.id === daySelectedId;
      return `<button class="${isSelected ? 'selected' : ''}" data-action="select-day-target" data-id="${p.id}"><span class="tile-name-line">${playerLabel(p)}</span></button>`;
    }).join('');

    app.innerHTML = `
      <div class="card">
        ${deathBanner}
        ${revealBanner}
        ${shieldLostBanner}
        ${maimBanner}
        ${abductBanner}
        ${cupidoBanner}
        ${healBanner}
        ${breadBanner}
        ${starvationBanner}
        ${nightSummary}
        <h2>Gyanúsítás</h2>
        ${wrapWithPopup(`<div class="target-grid">${targets}</div>`, coffinPopupHtml, 'dismiss-coffin-popup')}
        <footer class="actions">
          <button class="pin-left" data-action="reopen-day-vote" ${state.dayEliminatedIds.length ? '' : 'disabled'}>Vissza</button>
          <button class="primary" data-action="confirm-eliminate" ${daySelectedId ? '' : 'disabled'}>Kiszavazás</button>
        </footer>
      </div>
      <footer class="actions">
        <button class="primary" data-action="next-round">Alszik a város!</button>
      </footer>
    `;
  }

  // ---- End screen ----

  // Why the game ended - see game.js's deriveWinReason()/state.winReason.
  function winReasonText(state) {
    return {
      gyilkosok_elfogytak: 'Minden gyilkos meghalt.',
      gyilkosok_tobbsegben: 'A gyilkosok elérték vagy túllépték a többséget a túlélők között.',
      starvation: 'A város kenyér nélkül maradt, és éhínség lett úrrá rajta.',
      solo: 'Kiszavazásra került, és ezzel egyedül nyert.',
    }[state.winReason] || '';
  }

  // Which round of state.roundHistory the ended screen is currently showing -
  // null until first rendered, at which point it defaults to the LAST round
  // (see renderEnded()) - that's the one that just happened, most relevant
  // right when the game ends. Reset back to null on leaving ENDED (render()).
  let endedHistoryIndex = null;

  function renderEnded(state) {
    let winnerText;
    if (state.winner === 'solo') {
      const soloWinner = state.players.find((p) => p.id === state.soloWinnerId);
      const soloRole = soloWinner ? Game.getRole(soloWinner.roleId) : null;
      winnerText = `<strong>${escapeHtml(soloWinner ? soloWinner.name : '?')}</strong>${soloRole ? ` (${soloRole.name})` : ''} nyert!`;
    } else {
      winnerText = `<strong>${teamLabel(state.winner)}</strong> győztek!`;
    }
    const reasonText = winReasonText(state);

    const history = state.roundHistory;
    if (endedHistoryIndex === null) endedHistoryIndex = Math.max(0, history.length - 1);
    endedHistoryIndex = Math.min(Math.max(endedHistoryIndex, 0), Math.max(0, history.length - 1));
    const entry = history[endedHistoryIndex];

    // Rebuilds that round's state just well enough for nightOutcomeEmoji()/
    // resolveTentativeNight() to read it the same way they read the CURRENT
    // state during that round's actual day - same players (roleId/name never
    // change), but nightActions/abductedIds swapped for that round's snapshot,
    // and alive flags rolled back to who was alive going into that day (see
    // resolveNight()'s own comment on why this - rather than separately stored
    // "who died/was maimed" - is enough to reproduce the exact same rows).
    //
    // shieldUsed is the one player field that's NOT safe to just copy from the
    // CURRENT player object - unlike alive (rolled back above), it only ever
    // flips true and stays that way, so a Katona whose shield gets used in a
    // LATER round would incorrectly show it already gone on an EARLIER round's
    // page too. state.katonaShieldLostRound records which round it actually
    // happened in, so it's rolled back the same way alive is.
    const historicalState = entry ? {
      ...state,
      nightActions: entry.nightActions,
      abductedIds: entry.abductedIds,
      players: state.players.map((p) => {
        const role = Game.getRole(p.roleId);
        const shieldUsed = role && role.hasShield
          ? (state.katonaShieldLostRound !== null && state.katonaShieldLostRound <= entry.round)
          : p.shieldUsed;
        return { ...p, alive: entry.aliveIds.includes(p.id), shieldUsed };
      }),
    } : null;
    const rows = historicalState ? nightSummaryRowsHtml(historicalState, entry.dayDeaths) : '';

    const roundLabel = entry ? `${entry.round}. kör` : 'Nincs esemény';
    const atFirst = endedHistoryIndex <= 0;
    const atLast = endedHistoryIndex >= history.length - 1;

    app.innerHTML = `
      <div class="card">
        <div class="banner win">${winnerText}</div>
        ${reasonText ? `<p class="muted">${reasonText}</p>` : ''}
        <h2>Történet</h2>
        <div class="history-pager">
          <button data-action="history-prev" ${atFirst ? 'disabled' : ''}>←</button>
          <strong>${roundLabel}</strong>
          <button data-action="history-next" ${atLast ? 'disabled' : ''}>→</button>
        </div>
        <ul class="player-list">${rows}</ul>
      </div>
      <footer class="actions">
        <button class="primary" data-action="reset-game">Új játék</button>
      </footer>
    `;
  }

  // ---- Main render + event handling ----

  let lastRenderedPhase = null; // only replay the slide-up entrance when the phase actually changes

  function render(state) {
    renderStatus(state);
    investigatePendingTargetId = state.phase === Game.PHASES.NIGHT ? investigatePendingTargetId : null;
    linkSelectedIds = state.phase === Game.PHASES.NIGHT ? linkSelectedIds : [];
    killSelectedIds = state.phase === Game.PHASES.NIGHT ? killSelectedIds : [];
    nightSelectedId = state.phase === Game.PHASES.NIGHT ? nightSelectedId : null;
    maimPendingTargetId = state.phase === Game.PHASES.NIGHT ? maimPendingTargetId : null;
    maimSelectedPart = state.phase === Game.PHASES.NIGHT ? maimSelectedPart : null;
    // Also reset when leaving NIGHT entirely, so next round's first role (often
    // the same roleId as this round's) is treated as "different" and re-synced,
    // instead of appearing to already match lastNightRoleShown from last night.
    lastNightRoleShown = state.phase === Game.PHASES.NIGHT ? lastNightRoleShown : null;
    assignSelectedIds = state.phase === Game.PHASES.ASSIGN ? assignSelectedIds : [];
    swapSelectedIds = state.phase === Game.PHASES.ASSIGN ? swapSelectedIds : [];
    daySelectedId = state.phase === Game.PHASES.DAY ? daySelectedId : null;
    dayEliminationPopupOpen = state.phase === Game.PHASES.DAY ? dayEliminationPopupOpen : false;
    endedHistoryIndex = state.phase === Game.PHASES.ENDED ? endedHistoryIndex : null;
    if (state.phase !== Game.PHASES.DAY) {
      stopDayTimerLoop();
      dayTimerEndAt = null;
      daySunEntered = false;
    }
    if (state.phase === Game.PHASES.HOME) renderHome(state);
    else if (state.phase === Game.PHASES.SETUP) renderSetup(state);
    else if (state.phase === Game.PHASES.ASSIGN) renderAssign(state);
    else if (state.phase === Game.PHASES.NIGHT) renderNight(state);
    else if (state.phase === Game.PHASES.DAY) renderDay(state);
    else if (state.phase === Game.PHASES.ENDED) renderEnded(state);
    renderModal();
    renderSkyWidget(state);

    if (state.phase !== lastRenderedPhase) {
      app.classList.remove('screen-enter');
      void app.offsetWidth; // force reflow so the animation restarts
      app.classList.add('screen-enter');
      lastRenderedPhase = state.phase;
    }
  }

  document.body.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-backdrop')) {
      rolesModalOpen = false;
      renderModal();
      return;
    }

    const btn = e.target.closest('[data-action]');
    if (!btn) {
      // A stray click (not on any actionable element) while a swap pick is still
      // showing on "Szerepek kiosztva" - whether mid-pick (1 selected) or just
      // sitting there as post-swap feedback (2 selected, see select-swap) -
      // clears it instead of leaving it stuck highlighted indefinitely.
      if (swapSelectedIds.length > 0) {
        swapSelectedIds = [];
        render(Game.getState());
      }
      return;
    }
    const action = btn.dataset.action;
    const state = Game.getState();

    try {
      if (action === 'toggle-roles-modal') { rolesModalOpen = true; renderModal(); }
      else if (action === 'close-roles-modal') { rolesModalOpen = false; renderModal(); }
      else if (action === 'start-day-timer') { startDayTimer(); renderSkyWidget(state); }
      else if (action === 'go-home') {
        if (state.phase === Game.PHASES.HOME) return;
        if (confirm('Biztosan befejezed a jelenlegi játékot és a kezdőlapra lépsz? A mentett állás elvész.')) {
          Game.resetGame();
        }
      }
      else if (action === 'go-setup') {
        roleDraft = { gyilkos: 1 };
        roleToggleDraft = {};
        gyilkosAutoSet = true;
        killsPerNightAutoSet = true;
        // resetGame() carries player names over from the previous game, so this
        // isn't necessarily 0 - the headcount-based suggestion should reflect
        // whoever's actually still in the list.
        applyAutoDefaults(state.players.length);
        Game.enterSetup();
      }
      else if (action === 'add-player') doAddPlayer();
      else if (action === 'remove-player') {
        applyAutoDefaults(state.players.length - 1);
        Game.removePlayer(btn.dataset.id);
      }
      else if (action === 'toggle-role-single') {
        const nowOn = btn.getAttribute('aria-pressed') !== 'true';
        btn.setAttribute('aria-pressed', nowOn ? 'true' : 'false');
        roleToggleDraft[btn.dataset.roleId] = nowOn;
        updateRoleAvailability();
      }
      else if (action === 'toggle-all-roles') {
        // Same top-to-bottom reading order as the setup screen itself
        // (setupRoleSortIndex/SETUP_ROLE_ORDER), so "fill until full" fills in the
        // order the narrator actually sees the rows in.
        const toggleableRoles = [...ROLES]
          .filter((r) => r.maxCount === 1 && !r.alwaysActive)
          .sort((a, b) => setupRoleSortIndex(a.id) - setupRoleSortIndex(b.id));
        // Based on whether ANY are on, not whether ALL are on - if the last fill
        // ran out of room partway (so not literally every role could be on at
        // once), "every role is on" can never become true, which would leave the
        // switch stuck in "fill" mode forever with no way to clear it. Any role
        // being on already means there's something to clear.
        const anyOn = toggleableRoles.some((r) => roleToggleDraft[r.id]);
        const newState = !anyOn;

        if (newState) {
          // Turning on: fill roles top to bottom only as long as there's room,
          // instead of blindly turning everything on and overflowing the player
          // count - once one doesn't fit, it (and everything after it) stays off.
          const totalPlayers = state.players.length;
          const gyilkosInput = document.getElementById('count-gyilkos');
          const gyilkosCount = gyilkosInput ? (parseInt(gyilkosInput.value, 10) || 0) : 0;
          let used = ROLES.filter((r) => r.alwaysActive).length + gyilkosCount;
          toggleableRoles.forEach((r) => {
            const cost = r.linkedCountRoleId ? gyilkosCount : 1;
            const fits = used + cost <= totalPlayers;
            roleToggleDraft[r.id] = fits;
            if (fits) used += cost;
            const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
            if (toggle) toggle.setAttribute('aria-pressed', fits ? 'true' : 'false');
          });
        } else {
          toggleableRoles.forEach((r) => {
            roleToggleDraft[r.id] = false;
            const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
            if (toggle) toggle.setAttribute('aria-pressed', 'false');
          });
        }

        // Only reads as "on" once everything actually fit and got turned on - if
        // capacity ran out partway, it stays off. The fill/clear decision above
        // is based on anyOn (not this), so the switch still isn't stuck: the next
        // press clears whatever did get turned on rather than trying to fill more.
        const nowAllOn = toggleableRoles.length > 0 && toggleableRoles.every((r) => roleToggleDraft[r.id]);
        btn.setAttribute('aria-pressed', nowAllOn ? 'true' : 'false');
        updateRoleAvailability();
      }
      else if (action === 'assign-roles') { swapSelectedIds = []; Game.beginRoleAssignment(collectRoleCounts()); }
      else if (action === 'auto-assign-roles') { swapSelectedIds = []; Game.autoAssignRoles(collectRoleCounts()); }
      else if (action === 'toggle-assignee') {
        const id = btn.dataset.id;
        const role = Game.currentAssignmentRole();
        const capacity = role ? (state.assignmentTotalCounts[role.id] || 1) : 1;
        const idx = assignSelectedIds.indexOf(id);
        if (idx >= 0) {
          assignSelectedIds.splice(idx, 1);
        } else {
          if (assignSelectedIds.length >= capacity) assignSelectedIds.shift(); // bump the oldest pick
          assignSelectedIds.push(id);
        }
        render(state);
      }
      else if (action === 'confirm-assignment') {
        Game.assignRoleToPlayers(assignSelectedIds);
        assignSelectedIds = [];
      }
      else if (action === 'assign-back') {
        assignSelectedIds = [];
        swapSelectedIds = [];
        Game.stepBackAssignment();
      }
      else if (action === 'cancel-assignment') {
        assignSelectedIds = [];
        swapSelectedIds = [];
        // Re-seed the setup screen's drafts from the counts that were actually in
        // use for this assignment (Game.cancelRoleAssignment() below wipes
        // state.assignmentTotalCounts) - otherwise Mégse would silently reset
        // "Szerepek beállítása" back to its defaults instead of showing what was
        // just configured. Matters most after a page reload mid-assignment, where
        // roleDraft/roleToggleDraft (plain JS variables, not persisted state) have
        // already reset to their defaults even though the game itself resumed.
        const counts = state.assignmentTotalCounts;
        roleDraft = { gyilkos: counts.gyilkos || 1 };
        roleToggleDraft = {};
        ROLES.forEach((r) => {
          if (r.maxCount === 1 && !r.alwaysActive) roleToggleDraft[r.id] = (counts[r.id] || 0) > 0;
        });
        Game.cancelRoleAssignment();
      }
      else if (action === 'select-swap') {
        const id = btn.dataset.id;
        if (swapSelectedIds.length === 1 && swapSelectedIds[0] === id) {
          // Tapping the sole pick again cancels it.
          swapSelectedIds = [];
          render(state);
        } else if (swapSelectedIds.length === 1) {
          // Second, different pick - swap them, and keep BOTH highlighted
          // afterward (instead of clearing back to nothing) so it's visible which
          // two rows just traded roles. Any further tap - even on one of this
          // same pair - starts a fresh pick, not a toggle within the old pair.
          const firstId = swapSelectedIds[0];
          swapSelectedIds = [firstId, id];
          Game.swapPlayerRoles(firstId, id);
        } else {
          swapSelectedIds = [id];
          render(state);
        }
      }
      else if (action === 'start-game') Game.startGame();
      else if (action === 'select-night-target') { nightSelectedId = btn.dataset.id; render(state); }
      else if (action === 'confirm-night-target') {
        const role = Game.currentNightRole();
        const targetId = nightSelectedId;
        if (role.nightAction === 'investigate') {
          // Don't record/advance yet - just hold the target and show the result
          // popup on top of this same board; Game.recordNightAction() only runs once
          // its own "Következő" is pressed (see 'confirm-investigate' below).
          investigatePendingTargetId = targetId;
          render(state);
        } else {
          Game.recordNightAction(targetId);
        }
      }
      else if (action === 'confirm-investigate') {
        Game.recordNightAction(investigatePendingTargetId);
      }
      else if (action === 'confirm-maim-target') {
        // Same idea as investigate above - the popup sits on top of this same
        // board until confirmed, nothing recorded yet.
        maimPendingTargetId = nightSelectedId;
        render(state);
      }
      else if (action === 'cancel-maim-target') { maimPendingTargetId = null; maimSelectedPart = null; render(state); }
      else if (action === 'select-maim-part') { maimSelectedPart = btn.dataset.part; render(state); }
      else if (action === 'confirm-maim-part') {
        Game.recordMaimAction(maimPendingTargetId, maimSelectedPart);
      }
      else if (action === 'skip-night') Game.skipNightAction();
      else if (action === 'night-back') Game.stepBackNightAction();
      else if (action === 'jump-night-step') Game.jumpToNightStep(btn.dataset.roleId);
      else if (action === 'finish-night') Game.finishNight();
      else if (action === 'toggle-link-target') {
        const id = btn.dataset.id;
        const idx = linkSelectedIds.indexOf(id);
        if (idx >= 0) {
          linkSelectedIds.splice(idx, 1);
        } else {
          if (linkSelectedIds.length >= 2) linkSelectedIds.shift(); // bump the oldest pick
          linkSelectedIds.push(id);
        }
        render(state);
      }
      else if (action === 'confirm-link') Game.recordLinkAction(linkSelectedIds[0], linkSelectedIds[1]);
      else if (action === 'toggle-kill-target') {
        const id = btn.dataset.id;
        const capacity = Game.killCapacity();
        const idx = killSelectedIds.indexOf(id);
        if (idx >= 0) {
          killSelectedIds.splice(idx, 1);
        } else {
          if (killSelectedIds.length >= capacity) killSelectedIds.shift(); // bump the oldest pick
          killSelectedIds.push(id);
        }
        render(state);
      }
      else if (action === 'confirm-kill') Game.recordKillAction(killSelectedIds);
      else if (action === 'select-day-target') { daySelectedId = btn.dataset.id; render(state); }
      else if (action === 'confirm-eliminate') {
        // Both local vars have to be set BEFORE calling into Game - eliminatePlayer()
        // triggers a synchronous render via its own save() call, so setting them
        // afterward would be one render too late for that first paint to show the
        // popup.
        const targetId = daySelectedId;
        daySelectedId = null;
        dayEliminationPopupOpen = true;
        Game.eliminatePlayer(targetId);
      }
      else if (action === 'dismiss-coffin-popup') { dayEliminationPopupOpen = false; render(state); }
      else if (action === 'confirm-hunter-shot') {
        // Same ordering as confirm-eliminate above - resolveHunterShot() renders
        // synchronously via its own save(), so both locals must already be set
        // before calling in for that first paint to show the shot victim's popup.
        const targetId = daySelectedId;
        daySelectedId = null;
        dayEliminationPopupOpen = true;
        Game.resolveHunterShot(targetId);
      }
      else if (action === 'reopen-day-vote') { dayEliminationPopupOpen = false; Game.reopenDayVote(); }
      else if (action === 'next-round') Game.nextRound();
      else if (action === 'history-prev') { endedHistoryIndex -= 1; render(state); }
      else if (action === 'history-next') { endedHistoryIndex += 1; render(state); }
      else if (action === 'reset-game') {
        if (confirm('Biztosan új játékot kezdesz? A jelenlegi állás elvész.')) Game.resetGame();
      }
    } catch (err) {
      alert(err.message);
    }
  });

  Game.init(render);
})();
</script>

</body>
