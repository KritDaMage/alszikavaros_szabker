<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alszik a város - Játékvezető</title>
<style>
  :root {
    --bg: #12141c;
    --panel: #1c1f2b;
    --panel-2: #262a3a;
    --border: #343a4d;
    --text: #eef0f6;
    --muted: #9aa0b4;
    --accent: #6c8cff;
    --accent-2: #8f6cff;
    --danger: #ff6c6c;
    --ok: #6cffab;
    --polgar: #6c8cff;
    --gyilkos: #ff6c6c;
    --semleges: #ffcf6c;
    font-size: 16px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 3rem;
  }

  header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  header h1 {
    font-size: 1.1rem;
    margin: 0;
  }

  .header-title-button {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    font: inherit;
    padding: 0;
  }
  .header-title-button:hover {
    color: var(--accent);
  }
  .header-town-emoji {
    display: inline-block;
    font-size: 1.6em;
    line-height: 1;
  }

  header .status {
    color: var(--muted);
    font-size: 0.9rem;
  }

  header .header-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem 1.25rem;
  }

  @keyframes screen-slide-up {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }

  main.screen-enter {
    animation: screen-slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @media (prefers-reduced-motion: reduce) {
    main.screen-enter {
      animation: none;
    }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .card h2 {
    margin: 0 0 0.75rem;
    font-size: 1rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  button {
    font: inherit;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1rem;
    cursor: pointer;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  button:hover { border-color: var(--accent); }

  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  button.danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
  }

  button.small {
    padding: 0.3rem 0.6rem;
    font-size: 0.85rem;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  input[type="text"], input[type="number"] {
    font: inherit;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 0.5rem 0.6rem;
  }

  .row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .player-list {
    list-style: none;
    margin: 0.75rem 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .player-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-2);
    padding: 0.5rem 0.7rem;
    border-radius: 8px;
  }

  .player-list li.dead {
    opacity: 0.45;
    text-decoration: line-through;
  }

  .player-list li.swap-row {
    cursor: pointer;
    border: 1px solid transparent;
  }
  .player-list li.swap-row.selected {
    border-color: var(--accent);
    background: rgba(108,140,255,0.18);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .badge.polgarok { background: rgba(108,140,255,0.15); color: var(--polgar); }
  .badge.gyilkosok { background: rgba(255,108,108,0.15); color: var(--gyilkos); }
  .badge.semleges { background: rgba(255,207,108,0.15); color: var(--semleges); }

  .role-emoji {
    display: inline-flex;
    flex-shrink: 0;
    font-size: 1.2rem;
    line-height: 1;
    margin-right: 0.35em;
  }

  .role-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.5rem;
    align-items: center;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
  }
  .role-row:last-child { border-bottom: none; }
  .role-row .role-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .night-role-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .card-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .role-emoji-lg {
    font-size: 1.8rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--panel-2);
  }
  .role-row input { width: 4rem; }

  .linked-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.5rem;
    padding: 0.3rem 0.5rem;
    font-weight: 600;
    color: var(--muted);
  }

  .toggle-switch {
    position: relative;
    width: 44px;
    height: 24px;
    padding: 0;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .toggle-switch[aria-pressed="true"] {
    background: rgba(108,140,255,0.25);
    border-color: var(--accent);
  }
  .toggle-switch[aria-pressed="true"]::after {
    transform: translateX(20px);
    background: var(--accent);
  }

  .toggle-with-count {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
  }

  .target-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .target-grid button {
    padding: 0.9rem 0.5rem;
  }

  .target-grid button.selected {
    border-color: var(--accent);
    background: rgba(108,140,255,0.18);
  }

  .tile-name-line {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tile-emoji-line {
    display: block;
    /* Fixed height (not min-height) - emoji glyphs commonly render taller than
       plain text at the same font-size, so a min-height-only box was still growing
       (and dragging the whole grid row along with it) the moment one got added.
       overflow:hidden clips the box to this exact size no matter what's inside.
       Two lines' worth now, since several bond-transferred actions can stack up
       on one tile at once. */
    height: 2.9rem;
    line-height: 1.35rem;
    margin-top: 0.4rem;
    padding-top: 0.25rem;
    border-top: 1px solid var(--border);
    text-align: left;
    white-space: normal;
    overflow: hidden;
    word-break: break-word;
  }

  .target-grid-wrap {
    position: relative;
  }
  .board-popup {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem;
    background: rgba(10,10,16,0.72);
    border-radius: 10px;
  }
  .board-popup-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    text-align: center;
    max-width: 90%;
  }
  .board-popup-box .reason-line {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
  }
  .board-popup-box .prompt {
    text-align: center;
  }
  .popup-choice-row {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 0.75rem;
  }
  .popup-choice-row button {
    padding: 0.75rem 1rem;
  }
  .popup-choice-row button.selected {
    border-color: var(--accent);
    background: rgba(108,140,255,0.18);
  }
  .assignee-card.assigned {
    opacity: 0.55;
    cursor: default;
  }

  .prompt {
    font-size: 1.1rem;
    margin-bottom: 0.25rem;
  }

  .muted { color: var(--muted); font-size: 0.9rem; }

  /* A kezdőlap szándékosan nincs .card-ba zárva - keret/panel nélkül,
     közvetlenül az oldal hátterén ül. */
  .home-card {
    text-align: center;
    padding: 2.5rem 1.5rem;
  }
  .home-title { font-size: 1.5rem; margin: 0 0 0.75rem; }
  .home-card .muted { max-width: 32rem; margin: 0 auto 1.5rem; }

  /* Idle nap/hold ciklus emojikkal a város fölött - lásd skyWidgetHtml(),
     újrafelhasználható máshol is (pl. a játék közbeni képernyőkön). */
  .sky-widget-emoji {
    max-width: 280px;
    margin: 0 auto 1rem;
  }
  .sky-arc-area {
    position: relative;
    height: 100px;
  }
  .sky-emoji {
    position: absolute;
    top: 0;
    left: 0;
    font-size: 2.4rem;
    line-height: 1;
    offset-path: path('M40,90 Q140,30 240,90');
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: 16s;
  }
  .sun-emoji { animation-name: sky-sun-arc; }
  .moon-emoji { animation-name: sky-moon-arc; }
  .town-emoji { font-size: 3.6rem; margin-top: -0.25rem; }

  @keyframes sky-sun-arc {
    0%   { offset-distance: 0%;   opacity: 0; }
    5%   { opacity: 1; }
    45%  { opacity: 1; }
    50%  { offset-distance: 100%; opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes sky-moon-arc {
    0%   { offset-distance: 0%;   opacity: 0; }
    50%  { offset-distance: 0%;   opacity: 0; }
    55%  { opacity: 1; }
    95%  { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sun-emoji, .moon-emoji {
      animation: none;
    }
    .sun-emoji { offset-distance: 35%; opacity: 1; }
    .moon-emoji { opacity: 0; }
  }

  .banner {
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.75rem;
  }
  .banner.info { background: rgba(108,140,255,0.12); border: 1px solid var(--accent); }
  .banner.warn { background: rgba(255,108,108,0.12); border: 1px solid var(--danger); }
  .banner.win { background: rgba(108,255,171,0.12); border: 1px solid var(--ok); }

  footer.actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    z-index: 100;
  }

  .modal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 1.1rem;
  }

  .roles-info-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .roles-info-list li:not(:last-child) {
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .roles-info-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }
</style>
</head>
<body>

<header>
  <h1><button type="button" class="header-title-button" data-action="go-home"><span class="header-town-emoji">🏘️</span> Alszik a város</button></h1>
  <div class="header-right">
    <button class="small" data-action="toggle-roles-modal">Szerepek leírása</button>
    <div class="status" id="status-line">Betöltés...</div>
  </div>
</header>

<main id="app"></main>
<div id="modal-root"></div>

<script src="roles.js"></script>
<script src="game.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const statusLine = document.getElementById('status-line');
  const modalRoot = document.getElementById('modal-root');

  let rolesModalOpen = false;

  function renderModal() {
    if (!rolesModalOpen) {
      modalRoot.innerHTML = '';
      return;
    }
    const rows = ROLES.map((r) => `
      <li>
        <div class="roles-info-row">
          <span class="badge ${r.team}">${roleEmoji(r)}</span>
          <strong>${r.name}</strong>
        </div>
        <p class="muted">${r.description}</p>
      </li>
    `).join('');

    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-card">
          <div class="modal-header">
            <h2>Szerepek leírása</h2>
            <button class="small" data-action="close-roles-modal">✕</button>
          </div>
          <ul class="roles-info-list">${rows}</ul>
        </div>
      </div>
    `;
  }

  function teamLabel(team) {
    return { polgarok: 'Polgárok', gyilkosok: 'Gyilkosok', semleges: 'Semleges' }[team] || team;
  }

  function teamLabelSingular(team) {
    return { polgarok: 'Polgár', gyilkosok: 'Gyilkos', semleges: 'Semleges' }[team] || team;
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function renderStatus(state) {
    const phaseLabel = {
      home: 'Kezdőlap',
      setup: 'Előkészítés',
      night: 'Éjszaka',
      day: 'Nappal',
      ended: 'Vége',
    }[state.phase];
    statusLine.textContent = state.round > 0
      ? `${state.round}. kör - ${phaseLabel}`
      : phaseLabel;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Wraps a role's emoji (see roles.js) in a span for consistent sizing/spacing.
  // How this actually renders (art style, or a missing-glyph box) is entirely up to
  // the viewer's device/OS - see the note in the roles modal for why.
  function roleEmoji(role, extraClass = '') {
    if (!role || !role.emoji) return '';
    return `<span class="role-emoji${extraClass ? ' ' + extraClass : ''}">${role.emoji}</span>`;
  }

  // Label for a player button during the game (night targeting, day elimination) -
  // the narrator sees everyone's role anyway, so showing it speeds up target picking.
  function playerLabel(p) {
    return `${roleEmoji(Game.getRole(p.roleId))}${escapeHtml(p.name)}`;
  }

  // The other half of tonight's Cupido pair for playerId, or null.
  function linkedPartnerId(state, playerId) {
    const link = state.nightActions.cupido;
    if (!link || !link.pairIds) return null;
    const [a, b] = link.pairIds;
    if (a === playerId) return b;
    if (b === playerId) return a;
    return null;
  }

  // The acting role's own emoji (see roles.js) - reused as the "this happened"
  // marker everywhere instead of a separate, hand-picked symbol per action. One
  // consistent set of emoji (the roles') instead of two overlapping ones to keep
  // matched up.
  function roleActionEmoji(roleId) {
    const role = Game.getRole(roleId);
    return role && role.emoji ? role.emoji : '';
  }

  // Left-to-right order night-action markers appear in, matching nightOrder (UFO=1,
  // Cupido=2, Pék=4, Orvos=5, Csonkoló=9, Gyilkos=10, Nyomozó=20) - so a live preview
  // during selection always slots into the same spot it'll end up in once actually
  // confirmed, instead of always landing at the end regardless of which role acts.
  const OUTCOME_ROLE_ORDER = ['ufo', 'cupido', 'katona-shield', 'pek', 'orvos', 'csonkolo', 'gyilkos', 'nyomozo'];

  // Everything already confirmed for playerId tonight, keyed by role (see
  // OUTCOME_ROLE_ORDER) - the shared basis for both nightOutcomeEmoji() and the
  // live-preview version in nightTileLabel(). A Cupido pair shares fate: whatever
  // happens to one (kill, maim, protection, gift) shows on the other too, matching
  // resolveNight()'s bond logic - only investigation doesn't bond-transfer, since
  // it's pure information, not a lasting effect.
  function nightOutcomeByRole(state, playerId) {
    const na = state.nightActions;
    const partnerId = linkedPartnerId(state, playerId);
    const partnerPlayer = partnerId ? state.players.find((pl) => pl.id === partnerId) : null;
    const partnerRole = partnerPlayer ? Game.getRole(partnerPlayer.roleId) : null;
    return {
      ufo: state.abductedIds.includes(playerId) ? roleActionEmoji('ufo') : '',
      cupido: na.cupido && na.cupido.pairIds && na.cupido.pairIds.includes(playerId) ? roleActionEmoji('cupido') : '',
      // Katona's immunity extends to whoever Cupido bonded them with tonight (see
      // resolveNight()'s roleImmune check) - shown right after the bond marker, on
      // the partner only (checking the PARTNER's role naturally excludes the Katona
      // themselves here).
      'katona-shield': partnerRole && partnerRole.immuneToKill ? roleActionEmoji('katona') : '',
      pek: na.pek && (na.pek.targetId === playerId || na.pek.targetId === partnerId) ? roleActionEmoji('pek') : '',
      orvos: na.orvos && (na.orvos.targetId === playerId || na.orvos.targetId === partnerId) ? roleActionEmoji('orvos') : '',
      // Gyilkos's kill and the Csonkoló's maim show what actually happened, not the
      // acting role's own emoji - a skull for a kill, specifically which body part
      // for a maim (same for the bonded partner too, since it's the same bodyPart).
      csonkolo: na.csonkolo && (na.csonkolo.targetId === playerId || na.csonkolo.targetId === partnerId)
        ? (na.csonkolo.bodyPart === 'kez' ? '✋' : '👅') : '',
      gyilkos: na.gyilkos && (na.gyilkos.targetId === playerId || na.gyilkos.targetId === partnerId) ? '💀' : '',
      nyomozo: na.nyomozo && na.nyomozo.targetId === playerId ? roleActionEmoji('nyomozo') : '',
    };
  }

  function nightOutcomeEmoji(state, playerId) {
    const byRole = nightOutcomeByRole(state, playerId);
    const parts = OUTCOME_ROLE_ORDER.map((r) => byRole[r]).filter(Boolean);
    return parts.length ? ` ${parts.join(' ')}` : '';
  }

  // Whether anyone can actually perform this role's action tonight - false once every
  // living holder is abducted (or the role's only holder(s) are dead). Drives the
  // "mock" turn in renderNight(): the role still gets called every night (see
  // beginNight() in game.js), but with nothing to click, just "Tovább".
  function roleHasActor(state, role) {
    return Game.alivePlayers().some((p) => p.roleId === role.id && !state.abductedIds.includes(p.id));
  }

  // previewEmoji: shown immediately while a candidate is merely selected/highlighted,
  // before the action is even confirmed - same as a role's emoji already showing up
  // next to a tapped-but-not-yet-confirmed candidate on the "Szerepek kiosztva" board.
  function nightPlayerLabel(state, p, previewEmoji = '') {
    const confirmed = nightOutcomeEmoji(state, p.id);
    const preview = previewEmoji ? ` ${previewEmoji}` : '';
    return `${playerLabel(p)}${confirmed}${preview}`;
  }

  // Same as nightPlayerLabel, but for grid tiles (target-grid/assignee-card buttons):
  // puts the outcome/preview emoji on its own (two-line-capable) block, in a slot
  // that's always reserved (see .tile-emoji-line), so every tile in the row stays
  // the same size whether or not it actually has anything to show there. The name
  // line is still clamped to one line (see the CSS) - a long name truncates instead
  // of wrapping, so it alone can't grow a tile taller than its neighbours.
  // previewRoleId, if given, slots previewEmoji into its correct spot in
  // OUTCOME_ROLE_ORDER instead of just appending it - so during selection, the
  // marker already sits exactly where it'll end up once actually confirmed. Left
  // out (e.g. Cupido's own marker, which may already bundle an inherited UFO/Katona
  // preview into one string), the preview is just appended - fine there since
  // nothing later in the night could be confirmed yet at that point anyway.
  function nightTileLabel(state, p, previewEmoji = '', previewRoleId = null) {
    const byRole = nightOutcomeByRole(state, p.id);
    if (previewEmoji && previewRoleId && previewRoleId in byRole) {
      byRole[previewRoleId] = previewEmoji;
    }
    const parts = OUTCOME_ROLE_ORDER.map((r) => byRole[r]).filter(Boolean);
    if (previewEmoji && !(previewRoleId && previewRoleId in byRole)) parts.push(previewEmoji);
    return `<span class="tile-name-line">${playerLabel(p)}</span><span class="tile-emoji-line">${parts.join(' ')}</span>`;
  }

  // Role display order: nightOrder ascending (no-night-action roles after all the
  // night roles, in ROLES array order among themselves), Polgár always last since
  // it's just the leftover filler. Used to sort the post-assignment roster.
  const ROLE_SORT_ORDER = [
    ...ROLES.filter((r) => r.id !== 'polgar').sort((a, b) => (a.nightOrder ?? Infinity) - (b.nightOrder ?? Infinity)).map((r) => r.id),
    'polgar',
  ];
  function roleSortIndex(roleId) {
    const idx = ROLE_SORT_ORDER.indexOf(roleId);
    return idx === -1 ? ROLE_SORT_ORDER.length : idx;
  }

  // Idle nap/hold ciklus a város fölött - önálló, újrafelhasználható SVG dísz.
  // Jelenleg csak a kezdőlapon fut szabadon; később a játék közbeni képernyőkön
  // (éjszaka/nappal) is be lehet illeszteni, akár a tényleges fázishoz igazítva.
  function skyWidgetHtml() {
    return `
      <div class="sky-widget-emoji" aria-hidden="true">
        <div class="sky-arc-area">
          <span class="sky-emoji sun-emoji">☀️</span>
          <span class="sky-emoji moon-emoji">🌙</span>
        </div>
        <div class="town-emoji">🏘️</div>
      </div>
    `;
  }

  // ---- Home screen ----

  function renderHome(state) {
    app.innerHTML = `
      <div class="home-card">
        ${skyWidgetHtml()}
        <h2 class="home-title">Alszik a város</h2>
        <p class="muted">Játékvezetői segédlet: végigvezet az éjszakai és nappali fázisokon, kiosztja a szerepeket, és nyomon követi az eseményeket.</p>
        <button class="primary" data-action="go-setup">Új játék indítása</button>
      </div>
    `;
  }

  // ---- Setup screen ----

  // Role counts/toggles are plain DOM state, but renderSetup() rebuilds the whole
  // screen from scratch on every add/remove-player - without this draft, that would
  // wipe out whatever the narrator had already configured. Reset on fresh entry to
  // setup (see the 'go-setup' action), not on every re-render within it.
  let roleDraft = { gyilkos: 1 }; // roleId -> number, for plain number inputs (gyilkos)
  let roleToggleDraft = {}; // roleId -> boolean, for every toggle switch

  function renderSetup(state) {
    const playersHtml = state.players.map((p) => `
      <li>
        <span>${escapeHtml(p.name)}</span>
        <button class="small danger" data-action="remove-player" data-id="${p.id}">✕</button>
      </li>
    `).join('');

    // "Összes bekapcsolása" master toggle - flips every toggleable role (everything
    // with its own on/off switch, i.e. maxCount:1 and not alwaysActive) at once.
    const toggleableRoles = ROLES.filter((r) => r.maxCount === 1 && !r.alwaysActive);
    const allRolesOn = toggleableRoles.length > 0 && toggleableRoles.every((r) => roleToggleDraft[r.id]);
    const selectAllHtml = `
      <div class="role-row">
        <div><strong>Összes bekapcsolása</strong></div>
        <button type="button" class="toggle-switch" data-action="toggle-all-roles" aria-pressed="${allRolesOn ? 'true' : 'false'}"></button>
      </div>
    `;

    const rolesHtml = ROLES.filter((r) => r.id !== 'polgar').map((r) => {
      let control;
      if (r.alwaysActive) {
        control = '';
      } else if (r.linkedCountRoleId && r.maxCount === 1) {
        const pressed = roleToggleDraft[r.id] ? 'true' : 'false';
        control = `
          <div class="toggle-with-count">
            <button type="button" class="toggle-switch" data-action="toggle-role-single" data-role-id="${r.id}" aria-pressed="${pressed}"></button>
            <span class="linked-count" id="count-${r.id}-display">0</span>
          </div>
        `;
      } else if (r.linkedCountRoleId) {
        control = `<span class="linked-count" id="count-${r.id}-display">0</span>`;
      } else if (r.maxCount === 1) {
        const pressed = roleToggleDraft[r.id] ? 'true' : 'false';
        control = `<button type="button" class="toggle-switch" data-action="toggle-role-single" data-role-id="${r.id}" aria-pressed="${pressed}"></button>`;
      } else {
        const minCount = r.minCount || 0;
        control = `<input type="number" min="${minCount}" id="count-${r.id}" value="${roleDraft[r.id] ?? minCount}" />`;
      }
      return `
        <div class="role-row">
          <div>
            <div class="role-title"><span class="badge ${r.team}">${roleEmoji(r)}</span><strong>${r.name}</strong></div>
            <div class="muted">${r.description}</div>
          </div>
          ${control}
        </div>
      `;
    }).join('');

    app.innerHTML = `
      <div class="card">
        <h2>Játékosok (${state.players.length})</h2>
        <div class="row">
          <input type="text" id="new-player-name" placeholder="Játékos neve" />
          <button class="primary" data-action="add-player">Hozzáadás</button>
        </div>
        <ul class="player-list">${playersHtml}</ul>
      </div>

      <div class="card">
        <h2>Szerepek beállítása</h2>
        <p class="muted">Add meg, hány darab legyen az egyes szerepekből. A maradék játékos automatikusan Polgár lesz.</p>
        ${selectAllHtml}
        ${rolesHtml}
        <div id="role-capacity-warning"></div>
        <footer class="actions">
          <button id="auto-assign-btn" data-action="auto-assign-roles" ${state.players.length < 3 ? 'disabled' : ''}>Automatikus sorsolás</button>
          <button class="primary" id="assign-roles-btn" data-action="assign-roles" ${state.players.length < 3 ? 'disabled' : ''}>Szerepek kiosztása</button>
        </footer>
      </div>

    `;

    document.getElementById('new-player-name').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doAddPlayer();
    });

    // Keep linked-count displays (e.g. Kőműves = number of Gyilkos) in sync as the
    // narrator types into the role they mirror.
    ROLES.filter((r) => r.linkedCountRoleId).forEach((r) => {
      const sourceInput = document.getElementById(`count-${r.linkedCountRoleId}`);
      const display = document.getElementById(`count-${r.id}-display`);
      if (!sourceInput || !display) return;
      const sync = () => { display.textContent = parseInt(sourceInput.value, 10) || 0; };
      sync();
      sourceInput.addEventListener('input', sync);
    });

    const gyilkosInput = document.getElementById('count-gyilkos');
    if (gyilkosInput) {
      gyilkosInput.addEventListener('input', () => {
        roleDraft.gyilkos = parseInt(gyilkosInput.value, 10) || 0;
        updateRoleAvailability();
      });
    }
    updateRoleAvailability();
  }

  // Reads the role-count controls straight out of the DOM - shared by the manual
  // ("Szerepek kiosztása") and automatic ("Automatikus sorsolás") assignment buttons.
  function collectRoleCounts() {
    const counts = {};
    ROLES.filter((r) => r.id !== 'polgar').forEach((r) => {
      let val;
      if (r.alwaysActive) {
        val = 1;
      } else if (r.linkedCountRoleId) {
        const sourceInput = document.getElementById(`count-${r.linkedCountRoleId}`);
        const sourceCount = sourceInput ? (parseInt(sourceInput.value, 10) || 0) : 0;
        if (r.maxCount === 1) {
          const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
          val = (toggle && toggle.getAttribute('aria-pressed') === 'true') ? sourceCount : 0;
        } else {
          val = sourceCount;
        }
      } else if (r.maxCount === 1) {
        const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
        val = toggle && toggle.getAttribute('aria-pressed') === 'true' ? 1 : 0;
      } else {
        val = parseInt(document.getElementById(`count-${r.id}`).value, 10) || 0;
      }
      if (val > 0) counts[r.id] = val;
    });
    return counts;
  }

  // Once the players' slots are full (always-active roles + gyilkos count + every
  // ON toggle's headcount), disable any still-OFF toggle that would overflow them -
  // it stays locked until a slot frees up (a toggle turns off, gyilkos count drops,
  // or more players are added).
  function updateRoleAvailability() {
    const state = Game.getState();
    const totalPlayers = state.players.length;

    const gyilkosInput = document.getElementById('count-gyilkos');
    const gyilkosCount = gyilkosInput ? (parseInt(gyilkosInput.value, 10) || 0) : 0;

    const alwaysActiveCount = ROLES.filter((r) => r.alwaysActive).length;
    const toggleRoles = ROLES.filter((r) => r.maxCount === 1 && !r.alwaysActive);

    let used = alwaysActiveCount + gyilkosCount;
    toggleRoles.forEach((r) => {
      const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
      if (toggle && toggle.getAttribute('aria-pressed') === 'true') {
        used += r.linkedCountRoleId ? gyilkosCount : 1;
      }
    });

    const remaining = totalPlayers - used;

    toggleRoles.forEach((r) => {
      const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
      if (!toggle) return;
      if (toggle.getAttribute('aria-pressed') === 'true') {
        toggle.disabled = false;
        return;
      }
      const cost = r.linkedCountRoleId ? gyilkosCount : 1;
      toggle.disabled = cost > remaining;
    });

    if (gyilkosInput) {
      const usedWithoutGyilkos = used - gyilkosCount;
      gyilkosInput.max = String(Math.max(0, totalPlayers - usedWithoutGyilkos));
    }

    // Already over capacity (e.g. a player was removed after roles were configured,
    // or the gyilkos count was typed in directly) - warn and block assignment.
    const overflow = -remaining;

    // Roles with a minimum (e.g. at least 1 gyilkos) that isn't currently met. Only
    // plain number-input roles can have minCount, and gyilkos is the only one so far.
    const unmetMinimums = ROLES.filter((r) => typeof r.minCount === 'number' && gyilkosCount < r.minCount);

    const warningEl = document.getElementById('role-capacity-warning');
    if (warningEl) {
      const messages = [];
      if (overflow > 0) {
        messages.push(`Több szerep van kiválasztva, mint ahány játékos van (${overflow} hellyel túl sok). Csökkents valamit, vagy adj hozzá több játékost.`);
      }
      unmetMinimums.forEach((r) => {
        messages.push(`Legalább ${r.minCount} ${r.name} kell.`);
      });
      warningEl.innerHTML = messages.map((msg) => `<div class="banner warn">${msg}</div>`).join('');
    }

    const blocked = totalPlayers < 3 || overflow > 0 || unmetMinimums.length > 0;
    const assignBtn = document.getElementById('assign-roles-btn');
    if (assignBtn) assignBtn.disabled = blocked;
    const autoAssignBtn = document.getElementById('auto-assign-btn');
    if (autoAssignBtn) autoAssignBtn.disabled = blocked;
  }

  function doAddPlayer() {
    const input = document.getElementById('new-player-name');
    Game.addPlayer(input.value);
    // Game.addPlayer() re-renders the setup screen synchronously, which replaces
    // this input with a fresh (empty) one - re-query it so focus lands on the new one.
    const freshInput = document.getElementById('new-player-name');
    if (freshInput) freshInput.focus();
  }

  // ---- Role assignment screen ("0. éjszaka") ----
  // One distinct role at a time, same look as the real night screen (renderNight).
  // Everyone stays visible on the board throughout: already-assigned players show
  // their role emoji and are locked. For roles with more than one slot (e.g. 2
  // gyilkos), pick all of them on this one screen - tap to select/deselect; once
  // full, tapping a new person bumps the oldest pick (see the click handler).
  // "Következő" confirms once the count matches; "Vissza" undoes the previous
  // role's confirmation so it can be redone.

  let assignSelectedIds = [];
  let swapSelectedId = null; // first tap on the "Szerepek kiosztva" board, until a second tap swaps roles

  function renderAssign(state) {
    const role = Game.currentAssignmentRole();
    const canGoBack = state.assignmentHistory.length > 0;

    if (!role) {
      // Queue empty - everyone has a role. Stay right here instead of dropping back
      // to the top of the SETUP screen; offer to start, or step back to fix a pick.
      // Tap two rows to swap their roles, if something needs fixing without a full
      // "Vissza".
      const rows = [...state.players].sort((a, b) => roleSortIndex(a.roleId) - roleSortIndex(b.roleId)).map((p) => {
        const pRole = Game.getRole(p.roleId);
        const isSelected = p.id === swapSelectedId;
        return `<li class="swap-row${isSelected ? ' selected' : ''}" data-action="select-swap" data-id="${p.id}"><span>${escapeHtml(p.name)}</span><span class="badge ${pRole.team}">${roleEmoji(pRole)}${pRole.name}</span></li>`;
      }).join('');
      app.innerHTML = `
        <div class="card">
          <div class="card-header-row">
            <h2>Szerepek kiosztva</h2>
            <button data-action="cancel-assignment">Mégse</button>
          </div>
          <p class="muted">Koppints két játékosra, hogy kicseréld a szerepüket.</p>
          <ul class="player-list">${rows}</ul>
          <footer class="actions">
            <button data-action="assign-back" ${canGoBack ? '' : 'disabled'}>Vissza</button>
            <button class="primary" data-action="start-game">Játék indítása</button>
          </footer>
        </div>
      `;
      return;
    }

    const capacity = state.assignmentTotalCounts[role.id] || 1;
    const promptText = capacity > 1
      ? `Válassz ki ${capacity} embert, akik ${role.name} lesznek! (${assignSelectedIds.length}/${capacity} kiválasztva)`
      : `Ki legyen a(z) ${role.name}?`;

    const board = state.players.map((p) => {
      if (p.roleId) {
        return `<button class="assignee-card assigned" disabled><span class="tile-name-line">${playerLabel(p)}</span></button>`;
      }
      const isSelected = assignSelectedIds.includes(p.id);
      const label = isSelected ? `${roleEmoji(role)}${escapeHtml(p.name)}` : escapeHtml(p.name);
      return `<button class="assignee-card${isSelected ? ' selected' : ''}" data-action="toggle-assignee" data-id="${p.id}"><span class="tile-name-line">${label}</span></button>`;
    }).join('');

    app.innerHTML = `
      <div class="card">
        <div class="card-header-row">
          <div class="night-role-header">
            ${roleEmoji(role, 'role-emoji-lg')}
            <h2>${role.name}</h2>
          </div>
          <button data-action="cancel-assignment">Mégse</button>
        </div>
        <p class="prompt">${promptText}</p>
        <div class="target-grid">${board}</div>
        <footer class="actions">
          <button data-action="assign-back" ${canGoBack ? '' : 'disabled'}>Vissza</button>
          <button class="primary" data-action="confirm-assignment" ${assignSelectedIds.length === capacity ? '' : 'disabled'}>Következő</button>
        </footer>
      </div>
    `;
  }

  // ---- Pre-game reveal ("0. éjszaka" bemutatkozás, pl. Kőműves) ----

  function renderReveal(state) {
    const role = Game.currentPreGameReveal();
    if (!role) {
      app.innerHTML = `<div class="card"><div class="banner info">Kész.</div></div>`;
      return;
    }
    app.innerHTML = `
      <div class="card">
        <div class="night-role-header">
          ${roleEmoji(role, 'role-emoji-lg')}
          <h2>${role.name}</h2>
        </div>
        <p class="prompt">${role.preGameRevealPrompt || role.actionPrompt || ''}</p>
        <footer class="actions">
          <button class="primary" data-action="ack-pregame-reveal">Kész, tovább</button>
        </footer>
      </div>
    `;
  }

  // ---- Night screen ----

  let investigatePendingTargetId = null; // Nyomozó's target, confirmed, waiting for the result to be acknowledged
  let linkSelectedIds = []; // Cupido's picks this night - up to 2, toggled on/off
  let nightSelectedId = null; // single-target night action pick, until confirmed
  let maimPendingTargetId = null; // Csonkoló's target, confirmed, waiting for a body-part pick
  let maimSelectedPart = null; // 'kez' | 'nyelv' picked in the popup, until confirmed

  // Wraps a board (a target grid or a plain roster list) with a popup layered on top
  // of it - same look everywhere a turn needs to pause the narrator on something
  // (investigate's result, the Csonkoló's body-part pick, or a role nobody can act
  // out) instead of swapping to a separate screen. The board underneath keeps its
  // shape; the popup just covers it until dismissed/confirmed. dismissAction, if
  // given, is put on the backdrop itself so tapping outside the box (or on its
  // padding) triggers that action - the Csonkoló's body-part popup uses this so
  // "clicking away" cancels back to target-picking instead of needing its own button;
  // Nyomozó's result popup leaves this unset - it can only be advanced past via the
  // board's own "Következő" button, not dismissed by tapping away.
  function wrapWithPopup(contentHtml, popupHtml, dismissAction) {
    if (!popupHtml) return contentHtml;
    const dismissAttr = dismissAction ? ` data-action="${dismissAction}"` : '';
    return `
      <div class="target-grid-wrap">
        ${contentHtml}
        <div class="board-popup"${dismissAttr}><div class="board-popup-box">${popupHtml}</div></div>
      </div>
    `;
  }

  function renderNight(state) {
    const role = Game.currentNightRole();
    const canGoBackNight = state.nightActionHistory.length > 0;
    // Anyone abducted by the UFO can still be picked as a target by other roles too -
    // the action just won't have any effect on them (see game.js resolveNight/investigateResult).
    // The UFO itself can't pick itself either, but stays visible on the board (disabled)
    // instead of vanishing from the list - same for anyone else a role can't target.
    const targetable = Game.alivePlayers();

    // Nyomozó's result and the Csonkoló's body-part pick are both popups that sit on
    // top of their OWN role's target board, not the next one - Game.recordNightAction()/
    // recordMaimAction() only runs once the board's own "Következő" footer button is
    // pressed a second time (see the generic and maim branches below), so the board
    // underneath doesn't advance to the next role until then. Neither popup has a
    // button of its own - the shared footer button confirms both. The Csonkoló's
    // popup can also be cancelled by tapping away (back to target-picking); Nyomozó's
    // result can't - it only advances via the footer button.
    let popupHtml = '';
    let investigatePopupActive = false;
    let maimPopupActive = false;
    let popupDismissAction;
    if (investigatePendingTargetId) {
      // No dismissAction - unlike the Csonkoló's popup, tapping away doesn't cancel
      // this one, only the board's own "Következő" button does (see the generic
      // branch below, where nextAction/nextEnabled switch to confirm-investigate).
      investigatePopupActive = true;
      const result = Game.investigateResult(investigatePendingTargetId);
      const label = result && result.abducted ? 'Elrabolva' : teamLabelSingular(result ? result.team : '');
      // Same .reason-line markup as the mock round's "meghalt/elrabolta" popup - not
      // .prompt - so the two boxes end up pixel-identical instead of drifting apart.
      popupHtml = `<div class="reason-line">${label}</div>`;
    } else if (maimPendingTargetId) {
      maimPopupActive = true;
      popupDismissAction = 'cancel-maim-target';
      popupHtml = `
        <p class="prompt">Melyik testrészét csonkítod meg?</p>
        <div class="popup-choice-row">
          <button class="${maimSelectedPart === 'kez' ? 'selected' : ''}" data-action="select-maim-part" data-part="kez">✋ Kéz<br>(nem szavazhat)</button>
          <button class="${maimSelectedPart === 'nyelv' ? 'selected' : ''}" data-action="select-maim-part" data-part="nyelv">👅 Nyelv<br>(nem beszélhet)</button>
        </div>
      `;
    }

    if (!role) {
      const rows = Game.alivePlayers().map((p) => `<li>${nightPlayerLabel(state, p)}</li>`).join('');
      app.innerHTML = `
        <div class="card">
          <div class="banner info">Minden éjszakai szerep megvolt.</div>
          ${wrapWithPopup(`<ul class="player-list">${rows}</ul>`, popupHtml, popupDismissAction)}
          <footer class="actions">
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button class="primary" data-action="resolve-night">Éjszaka lezárása</button>
          </footer>
        </div>
      `;
      return;
    }

    if (!roleHasActor(state, role)) {
      // Every holder of this role is dead or was abducted tonight - the turn still
      // gets called (see beginNight()'s comment in game.js), but nothing can be picked.
      // Keep showing the normal-looking full board underneath; the popup covers it,
      // explaining why - either investigate's result if that's still pending, or this
      // role's own reason as a fallback. Dead holders aren't part of Game.alivePlayers()
      // any more, so they're spliced back in just for this board.
      const holders = state.players.filter((p) => p.roleId === role.id);
      const deadHolders = holders.filter((p) => !p.alive);
      // Same two-part tile markup (name line + reserved emoji line) as every other
      // night screen's target-grid, even though nothing goes in the emoji line here -
      // otherwise these tiles come out shorter than the ones on other roles' turns,
      // and the whole board visibly jumps in height when moving to/from this screen.
      const board = [...Game.alivePlayers(), ...deadHolders]
        .map((p) => `<button disabled><span class="tile-name-line">${playerLabel(p)}</span><span class="tile-emoji-line"></span></button>`)
        .join('');
      const reasonLines = holders.map((p) => {
        const reason = !p.alive ? '💀 Meghalt' : `${roleActionEmoji('ufo')} Elrabolta az UFO`;
        return `<div class="reason-line">${reason}</div>`;
      }).join('');
      app.innerHTML = `
        <div class="card">
          <div class="night-role-header">
            ${roleEmoji(role, 'role-emoji-lg')}
            <h2>${role.name}</h2>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          ${wrapWithPopup(`<div class="target-grid">${board}</div>`, popupHtml || reasonLines, popupHtml ? popupDismissAction : undefined)}
          <footer class="actions">
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button class="primary" data-action="skip-night">Tovább</button>
          </footer>
        </div>
      `;
      return;
    }

    if (role.nightAction === 'link') {
      const capacity = 2;
      // If one of the two picks is already abducted (only the UFO, nightOrder 1,
      // could have acted before Cupido, nightOrder 2), the bond drags the other one
      // into the same abduction (see recordLinkAction() in game.js) - preview that
      // on the not-yet-abducted partner as soon as both are picked, not just after
      // "Összekötés" is actually pressed.
      const abductedSelectedId = linkSelectedIds.find((id) => state.abductedIds.includes(id));
      // Same idea for a Katona's immunity - if one of the two picks IS a Katona, the
      // other one is now shielded too (see the partnerRole check in resolveNight()).
      // Only the non-Katona partner gets the preview, not the Katona's own tile.
      const katonaSelectedId = linkSelectedIds.find((id) => {
        const pl = state.players.find((x) => x.id === id);
        const r = pl ? Game.getRole(pl.roleId) : null;
        return r && r.immuneToKill;
      });
      const board = targetable.map((p) => {
        const isSelected = linkSelectedIds.includes(p.id);
        let preview = '';
        if (isSelected) {
          preview = roleActionEmoji('cupido');
          if (abductedSelectedId && abductedSelectedId !== p.id && !state.abductedIds.includes(p.id)) {
            preview += ` ${roleActionEmoji('ufo')}`;
          }
          if (katonaSelectedId && katonaSelectedId !== p.id) {
            preview += ` ${roleActionEmoji('katona')}`;
          }
        }
        return `<button class="assignee-card${isSelected ? ' selected' : ''}" data-action="toggle-link-target" data-id="${p.id}">${nightTileLabel(state, p, preview, 'cupido')}</button>`;
      }).join('');

      app.innerHTML = `
        <div class="card">
          <div class="night-role-header">
            ${roleEmoji(role, 'role-emoji-lg')}
            <h2>${role.name}</h2>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          <p class="muted">Válassz ki két embert, akiket ma éjjelre összekötsz. (${linkSelectedIds.length}/2 kiválasztva)</p>
          ${wrapWithPopup(`<div class="target-grid">${board}</div>`, popupHtml, popupDismissAction)}
          <footer class="actions">
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button data-action="skip-night">Kihagyás</button>
            <button class="primary" data-action="confirm-link" ${linkSelectedIds.length === capacity ? '' : 'disabled'}>Összekötés</button>
          </footer>
        </div>
      `;
      return;
    }

    if (role.nightAction === 'maim') {
      // The body-part choice is a popup on top of this same board (built above into
      // popupHtml when maimPendingTargetId is set) instead of a separate screen - the
      // target-picking step just stays visible underneath while it's open. The same
      // "Következő" footer button drives both steps: picks the target first, then
      // (once the popup is open) confirms the selected body part.
      const selectedPartnerId = nightSelectedId ? linkedPartnerId(state, nightSelectedId) : null;
      const targets = targetable.map((p) => {
        const isSelected = p.id === nightSelectedId;
        const preview = (isSelected || p.id === selectedPartnerId) ? roleActionEmoji('csonkolo') : '';
        return `<button class="${isSelected ? 'selected' : ''}" data-action="select-night-target" data-id="${p.id}">${nightTileLabel(state, p, preview, 'csonkolo')}</button>`;
      }).join('');
      const nextAction = maimPopupActive ? 'confirm-maim-part' : 'confirm-maim-target';
      const nextEnabled = maimPopupActive ? !!maimSelectedPart : !!nightSelectedId;
      app.innerHTML = `
        <div class="card">
          <div class="night-role-header">
            ${roleEmoji(role, 'role-emoji-lg')}
            <h2>${role.name}</h2>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          ${wrapWithPopup(`<div class="target-grid">${targets}</div>`, popupHtml, popupDismissAction)}
          <footer class="actions">
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button data-action="skip-night">Kihagyás</button>
            <button class="primary" data-action="${nextAction}" ${nextEnabled ? '' : 'disabled'}>Következő</button>
          </footer>
        </div>
      `;
      return;
    }

    const selectedPartnerId = nightSelectedId ? linkedPartnerId(state, nightSelectedId) : null;
    const targets = targetable.map((p) => {
      const isSelected = p.id === nightSelectedId;
      // The UFO can't abduct itself, and there's no point in the Nyomozó investigating
      // themselves - both still shown on the board, just disabled.
      const selectable = !((role.id === 'ufo' && p.roleId === 'ufo') || (role.id === 'nyomozo' && p.roleId === 'nyomozo'));
      // Gyilkos, Orvos and Pék all bond-transfer to the partner (investigation
      // doesn't). Gyilkos shows a skull rather than its own role emoji - what
      // actually happens, not who did it.
      const bondTransfers = role.id === 'gyilkos' || role.id === 'orvos' || role.id === 'pek';
      const partnerPreview = bondTransfers && p.id === selectedPartnerId ? (role.id === 'gyilkos' ? '💀' : roleActionEmoji(role.id)) : '';
      const preview = isSelected ? (role.id === 'gyilkos' ? '💀' : roleActionEmoji(role.id)) : partnerPreview;
      const cls = isSelected ? 'selected' : '';
      const attrs = selectable ? `data-action="select-night-target" data-id="${p.id}"` : 'disabled';
      return `<button class="${cls}" ${attrs}>${nightTileLabel(state, p, preview, role.id)}</button>`;
    }).join('');

    // The same "Következő" footer button drives both steps of Nyomozó's investigate,
    // same as the Csonkoló's maim: picks the target first, then (once the result
    // popup is open) acknowledges it and actually advances.
    const nextAction = investigatePopupActive ? 'confirm-investigate' : 'confirm-night-target';
    const nextEnabled = investigatePopupActive ? true : !!nightSelectedId;

    app.innerHTML = `
      <div class="card">
        <div class="night-role-header">
          ${roleEmoji(role, 'role-emoji-lg')}
          <h2>${role.name}</h2>
        </div>
        <p class="prompt">${role.actionPrompt || ''}</p>
        ${wrapWithPopup(`<div class="target-grid">${targets}</div>`, popupHtml, popupDismissAction)}
        <footer class="actions">
          <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
          <button data-action="skip-night">Kihagyás</button>
          <button class="primary" data-action="${nextAction}" ${nextEnabled ? '' : 'disabled'}>Következő</button>
        </footer>
      </div>
    `;
  }

  // ---- Day screen ----

  let daySelectedId = null; // single-target day pick (elimination or a Vadász's shot), until confirmed

  function renderDay(state) {
    const alive = Game.alivePlayers();
    const deaths = state.pendingDeaths
      .map((id) => state.players.find((p) => p.id === id))
      .filter(Boolean);

    const deathBanner = deaths.length === 0
      ? `<div class="banner info">Az éjszaka mindenki túlélte.</div>`
      : `<div class="banner warn">Éjjel meghalt: <strong>${deaths.map((p) => nightPlayerLabel(state, p)).join(', ')}</strong></div>`;

    const breadAction = state.nightActions['pek'];
    // Cupido's bond drags the partner in here too, same as the other night actions.
    const breadPartnerId = breadAction ? linkedPartnerId(state, breadAction.targetId) : null;
    const breadRecipients = breadAction
      ? [breadAction.targetId, breadPartnerId].filter(Boolean).map((id) => state.players.find((p) => p.id === id)).filter(Boolean)
      : [];
    const breadBanner = breadRecipients.length
      ? `<div class="banner info">Ma reggel kenyeret kapott: <strong>${breadRecipients.map((p) => playerLabel(p)).join(', ')}</strong></div>`
      : '';

    const maimBanner = state.pendingMaim
      .map((m) => ({ ...m, player: state.players.find((p) => p.id === m.targetId) }))
      .filter((m) => m.player && m.player.alive)
      .map((m) => `<div class="banner warn"><strong>${escapeHtml(m.player.name)}</strong> ma ${m.bodyPart === 'kez' ? 'nem szavazhat (megcsonkított kéz)' : 'nem beszélhet (megcsonkított nyelv)'}.</div>`)
      .join('');

    if (state.pendingHunterShot) {
      const shooter = state.players.find((p) => p.id === state.pendingHunterShot);
      const shotTargets = alive.map((p) => {
        const isSelected = p.id === daySelectedId;
        return `<button class="${isSelected ? 'selected' : ''}" data-action="select-day-target" data-id="${p.id}"><span class="tile-name-line">${playerLabel(p)}</span></button>`;
      }).join('');
      app.innerHTML = `
        <div class="card">
          <div class="banner warn"><strong>${escapeHtml(shooter ? shooter.name : 'A vadász')}</strong> (Vadász) utolsó tettként lelő valakit - válaszd ki, kit!</div>
          <div class="target-grid">${shotTargets}</div>
          <footer class="actions">
            <button class="primary" data-action="confirm-hunter-shot" ${daySelectedId ? '' : 'disabled'}>Következő</button>
          </footer>
        </div>
      `;
      return;
    }

    if (state.dayVoteResolved) {
      // Nappal csak 1 embert lehet kiszavazni - a döntés (kiszavazás vagy senki
      // sem) egyszer hozható meg naponta, utána a szavazás zárolva marad.
      app.innerHTML = `
        <div class="card">
          ${deathBanner}
          ${breadBanner}
          ${maimBanner}
          <div class="banner info">A mai szavazás lezárult.</div>
        </div>
        <footer class="actions">
          <button class="primary" data-action="next-round">Következő éjszaka</button>
        </footer>
      `;
      return;
    }

    const targets = alive.map((p) => {
      const isSelected = p.id === daySelectedId;
      return `<button class="${isSelected ? 'selected' : ''}" data-action="select-day-target" data-id="${p.id}"><span class="tile-name-line">${playerLabel(p)}</span></button>`;
    }).join('');

    app.innerHTML = `
      <div class="card">
        ${deathBanner}
        ${breadBanner}
        ${maimBanner}
        <h2>Kiszavazás</h2>
        <div class="target-grid">${targets}</div>
        <footer class="actions">
          <button data-action="no-elimination">Senkit sem szavaznak ki</button>
          <button class="primary" data-action="confirm-eliminate" ${daySelectedId ? '' : 'disabled'}>Kiszavazás megerősítése</button>
        </footer>
      </div>
      <footer class="actions">
        <button class="primary" data-action="next-round">Következő éjszaka</button>
      </footer>
    `;
  }

  // ---- End screen ----

  function renderEnded(state) {
    let winnerText;
    if (state.winner === 'solo') {
      const soloWinner = state.players.find((p) => p.id === state.soloWinnerId);
      const soloRole = soloWinner ? Game.getRole(soloWinner.roleId) : null;
      winnerText = `<strong>${escapeHtml(soloWinner ? soloWinner.name : '?')}</strong>${soloRole ? ` (${soloRole.name})` : ''} nyert!`;
    } else {
      winnerText = `<strong>${teamLabel(state.winner)}</strong> győztek!`;
    }
    const rows = state.players.map((p) => {
      const role = Game.getRole(p.roleId);
      return `<li class="${p.alive ? '' : 'dead'}"><span>${escapeHtml(p.name)}</span><span class="badge ${role.team}">${roleEmoji(role)}${role.name}</span></li>`;
    }).join('');

    app.innerHTML = `
      <div class="card">
        <div class="banner win">${winnerText}</div>
        <h2>Végső szereposztás</h2>
        <ul class="player-list">${rows}</ul>
      </div>
      <footer class="actions">
        <button class="primary" data-action="reset-game">Új játék</button>
      </footer>
    `;
  }

  // ---- Main render + event handling ----

  let lastRenderedPhase = null; // only replay the slide-up entrance when the phase actually changes

  function render(state) {
    renderStatus(state);
    investigatePendingTargetId = state.phase === Game.PHASES.NIGHT ? investigatePendingTargetId : null;
    linkSelectedIds = state.phase === Game.PHASES.NIGHT ? linkSelectedIds : [];
    nightSelectedId = state.phase === Game.PHASES.NIGHT ? nightSelectedId : null;
    maimPendingTargetId = state.phase === Game.PHASES.NIGHT ? maimPendingTargetId : null;
    maimSelectedPart = state.phase === Game.PHASES.NIGHT ? maimSelectedPart : null;
    assignSelectedIds = state.phase === Game.PHASES.ASSIGN ? assignSelectedIds : [];
    swapSelectedId = state.phase === Game.PHASES.ASSIGN ? swapSelectedId : null;
    daySelectedId = state.phase === Game.PHASES.DAY ? daySelectedId : null;
    if (state.phase === Game.PHASES.HOME) renderHome(state);
    else if (state.phase === Game.PHASES.SETUP) renderSetup(state);
    else if (state.phase === Game.PHASES.ASSIGN) renderAssign(state);
    else if (state.phase === Game.PHASES.REVEAL) renderReveal(state);
    else if (state.phase === Game.PHASES.NIGHT) renderNight(state);
    else if (state.phase === Game.PHASES.DAY) renderDay(state);
    else if (state.phase === Game.PHASES.ENDED) renderEnded(state);
    renderModal();

    if (state.phase !== lastRenderedPhase) {
      app.classList.remove('screen-enter');
      void app.offsetWidth; // force reflow so the animation restarts
      app.classList.add('screen-enter');
      lastRenderedPhase = state.phase;
    }
  }

  document.body.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-backdrop')) {
      rolesModalOpen = false;
      renderModal();
      return;
    }

    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const state = Game.getState();

    try {
      if (action === 'toggle-roles-modal') { rolesModalOpen = true; renderModal(); }
      else if (action === 'close-roles-modal') { rolesModalOpen = false; renderModal(); }
      else if (action === 'go-home') {
        if (state.phase === Game.PHASES.HOME) return;
        if (confirm('Biztosan befejezed a jelenlegi játékot és a kezdőlapra lépsz? A mentett állás elvész.')) {
          Game.resetGame();
        }
      }
      else if (action === 'go-setup') {
        roleDraft = { gyilkos: 1 };
        roleToggleDraft = {};
        Game.enterSetup();
      }
      else if (action === 'add-player') doAddPlayer();
      else if (action === 'remove-player') Game.removePlayer(btn.dataset.id);
      else if (action === 'toggle-role-single') {
        const nowOn = btn.getAttribute('aria-pressed') !== 'true';
        btn.setAttribute('aria-pressed', nowOn ? 'true' : 'false');
        roleToggleDraft[btn.dataset.roleId] = nowOn;
        updateRoleAvailability();
      }
      else if (action === 'toggle-all-roles') {
        const toggleableRoles = ROLES.filter((r) => r.maxCount === 1 && !r.alwaysActive);
        const allOn = toggleableRoles.length > 0 && toggleableRoles.every((r) => roleToggleDraft[r.id]);
        const newState = !allOn;
        toggleableRoles.forEach((r) => {
          roleToggleDraft[r.id] = newState;
          const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
          if (toggle) toggle.setAttribute('aria-pressed', newState ? 'true' : 'false');
        });
        btn.setAttribute('aria-pressed', newState ? 'true' : 'false');
        updateRoleAvailability();
      }
      else if (action === 'assign-roles') { swapSelectedId = null; Game.beginRoleAssignment(collectRoleCounts()); }
      else if (action === 'auto-assign-roles') { swapSelectedId = null; Game.autoAssignRoles(collectRoleCounts()); }
      else if (action === 'toggle-assignee') {
        const id = btn.dataset.id;
        const role = Game.currentAssignmentRole();
        const capacity = role ? (state.assignmentTotalCounts[role.id] || 1) : 1;
        const idx = assignSelectedIds.indexOf(id);
        if (idx >= 0) {
          assignSelectedIds.splice(idx, 1);
        } else {
          if (assignSelectedIds.length >= capacity) assignSelectedIds.shift(); // bump the oldest pick
          assignSelectedIds.push(id);
        }
        render(state);
      }
      else if (action === 'confirm-assignment') {
        Game.assignRoleToPlayers(assignSelectedIds);
        assignSelectedIds = [];
      }
      else if (action === 'assign-back') {
        assignSelectedIds = [];
        swapSelectedId = null;
        Game.stepBackAssignment();
      }
      else if (action === 'cancel-assignment') {
        assignSelectedIds = [];
        swapSelectedId = null;
        Game.cancelRoleAssignment();
      }
      else if (action === 'select-swap') {
        const id = btn.dataset.id;
        if (swapSelectedId === null || swapSelectedId === id) {
          swapSelectedId = swapSelectedId === id ? null : id;
          render(state);
        } else {
          const firstId = swapSelectedId;
          // Clear the selection before swapping - Game.swapPlayerRoles() re-renders
          // synchronously via save(), so it must already be null by then or the
          // just-swapped player would still show as selected afterwards.
          swapSelectedId = null;
          Game.swapPlayerRoles(firstId, id);
        }
      }
      else if (action === 'start-game') Game.startGame();
      else if (action === 'select-night-target') { nightSelectedId = btn.dataset.id; render(state); }
      else if (action === 'confirm-night-target') {
        const role = Game.currentNightRole();
        const targetId = nightSelectedId;
        nightSelectedId = null;
        if (role.nightAction === 'investigate') {
          // Don't record/advance yet - just hold the target and show the result
          // popup on top of this same board; Game.recordNightAction() only runs once
          // its own "Következő" is pressed (see 'confirm-investigate' below).
          investigatePendingTargetId = targetId;
          render(state);
        } else {
          Game.recordNightAction(targetId);
        }
      }
      else if (action === 'confirm-investigate') {
        const targetId = investigatePendingTargetId;
        investigatePendingTargetId = null;
        Game.recordNightAction(targetId);
      }
      else if (action === 'confirm-maim-target') {
        maimPendingTargetId = nightSelectedId;
        nightSelectedId = null;
        render(state);
      }
      else if (action === 'cancel-maim-target') { maimPendingTargetId = null; maimSelectedPart = null; render(state); }
      else if (action === 'select-maim-part') { maimSelectedPart = btn.dataset.part; render(state); }
      else if (action === 'confirm-maim-part') {
        const targetId = maimPendingTargetId;
        const part = maimSelectedPart;
        maimPendingTargetId = null;
        maimSelectedPart = null;
        Game.recordMaimAction(targetId, part);
      }
      else if (action === 'skip-night') {
        nightSelectedId = null;
        investigatePendingTargetId = null;
        maimPendingTargetId = null;
        maimSelectedPart = null;
        linkSelectedIds = [];
        Game.skipNightAction();
      }
      else if (action === 'night-back') {
        // Clear all in-progress night-screen selections before stepping back - it
        // re-renders synchronously via save(), so stale picks must already be gone.
        nightSelectedId = null;
        investigatePendingTargetId = null;
        maimPendingTargetId = null;
        maimSelectedPart = null;
        linkSelectedIds = [];
        Game.stepBackNightAction();
      }
      else if (action === 'toggle-link-target') {
        const id = btn.dataset.id;
        const idx = linkSelectedIds.indexOf(id);
        if (idx >= 0) {
          linkSelectedIds.splice(idx, 1);
        } else {
          if (linkSelectedIds.length >= 2) linkSelectedIds.shift(); // bump the oldest pick
          linkSelectedIds.push(id);
        }
        render(state);
      }
      else if (action === 'confirm-link') {
        const ids = linkSelectedIds;
        // Same ordering fix as confirm-night-target - clear before the synchronous
        // re-render inside recordLinkAction(), not after.
        linkSelectedIds = [];
        Game.recordLinkAction(ids[0], ids[1]);
      }
      else if (action === 'ack-pregame-reveal') Game.acknowledgePreGameReveal();
      else if (action === 'resolve-night') Game.resolveNight();
      else if (action === 'select-day-target') { daySelectedId = btn.dataset.id; render(state); }
      else if (action === 'confirm-eliminate') {
        Game.eliminatePlayer(daySelectedId);
        daySelectedId = null;
      }
      else if (action === 'confirm-hunter-shot') {
        Game.resolveHunterShot(daySelectedId);
        daySelectedId = null;
      }
      else if (action === 'no-elimination') { daySelectedId = null; Game.noElimination(); }
      else if (action === 'next-round') Game.nextRound();
      else if (action === 'reset-game') {
        if (confirm('Biztosan új játékot kezdesz? A jelenlegi állás elvész.')) Game.resetGame();
      }
    } catch (err) {
      alert(err.message);
    }
  });

  Game.init(render);
})();
</script>

</body>
</html>
