<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alszik a város - Játékvezető</title>
<style>
  :root {
    --bg: #12141c;
    --panel: #1c1f2b;
    --panel-2: #262a3a;
    --border: #343a4d;
    --text: #eef0f6;
    --muted: #9aa0b4;
    --accent: #6c8cff;
    --accent-2: #8f6cff;
    --danger: #ff6c6c;
    --ok: #6cffab;
    --polgar: #6c8cff;
    --gyilkos: #ff6c6c;
    --semleges: #ffcf6c;
    font-size: 16px;
  }

  * { box-sizing: border-box; }

  /* A banner appearing (e.g. "Éjjel meghalt: ...") can push the page taller than
     the viewport, toggling the vertical scrollbar on - without reserving its
     width up front, that toggle changes the available horizontal space and
     visibly shifts everything left/right. Reserving the gutter always, whether
     or not a scrollbar is actually showing, keeps the width constant no matter
     what content appears or disappears. */
  html {
    scrollbar-gutter: stable;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 3rem;
  }

  header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  header h1 {
    font-size: 1.1rem;
    margin: 0;
  }

  .header-title-button {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    font: inherit;
    padding: 0;
  }
  .header-title-button:hover {
    color: var(--accent);
  }
  .header-town-emoji {
    display: inline-block;
    font-size: 1.6em;
    line-height: 1;
  }

  header .status {
    color: var(--muted);
    font-size: 0.9rem;
  }

  header .header-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  /* Single shared centering point for both the sky widget and the board, so they
     can't independently drift out of alignment with each other - only one place
     computes "centered", not two copies of the same max-width/margin rule. */
  .app-column {
    max-width: 640px;
    margin: 0 auto;
  }

  main {
    padding: 1rem 1.25rem;
  }

  .roles-info-trigger {
    text-align: center;
    padding: 0 1.25rem 1.5rem;
  }

  @keyframes screen-slide-up {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }

  main.screen-enter {
    animation: screen-slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @media (prefers-reduced-motion: reduce) {
    main.screen-enter {
      animation: none;
    }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .card h2 {
    margin: 0 0 0.75rem;
    font-size: 1rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  button {
    font: inherit;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1rem;
    cursor: pointer;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  button:hover { border-color: var(--accent); }

  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  button.danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
  }

  button.small {
    padding: 0.3rem 0.6rem;
    font-size: 0.85rem;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  input[type="text"], input[type="number"] {
    font: inherit;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 0.5rem 0.6rem;
  }

  .row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .player-list {
    list-style: none;
    margin: 0.75rem 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .player-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-2);
    padding: 0.5rem 0.7rem;
    border-radius: 8px;
  }

  .player-list li.dead {
    opacity: 0.45;
  }

  .row-left {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .row-right {
    flex-shrink: 0;
  }

  .player-list li.swap-row {
    cursor: pointer;
    border: 1px solid transparent;
  }
  .player-list li.swap-row.selected {
    border-color: var(--accent);
    background: rgba(108,140,255,0.18);
  }
  /* Same role as the currently active first pick - not offered as a second pick
     at all (see select-swap), since swapping two same-role players is a no-op. */
  .player-list li.swap-row-blocked {
    opacity: 0.4;
    cursor: default;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .badge.polgarok { background: rgba(108,140,255,0.15); color: var(--polgar); }
  .badge.gyilkosok { background: rgba(255,108,108,0.15); color: var(--gyilkos); }
  .badge.semleges { background: rgba(255,207,108,0.15); color: var(--semleges); }

  /* Where the badge wraps only the emoji and the role name sits next to it in its
     own <strong> (Szerepek leírása, the setup screen's role list, the night
     header) instead of both being inside one badge together (Szerepek kiosztva,
     the night summary, the ended screen) - the name reads much fainter there
     otherwise, since it's plain --text instead of the team color. */
  .badge.polgarok + strong { color: var(--polgar); }
  .badge.gyilkosok + strong { color: var(--gyilkos); }
  .badge.semleges + strong { color: var(--semleges); }

  .role-emoji {
    display: inline-flex;
    flex-shrink: 0;
    font-size: 1.2rem;
    line-height: 1;
    margin-right: 0.35em;
  }

  .role-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.75rem;
    align-items: center;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
  }
  .role-row:last-child { border-bottom: none; }
  .role-row .role-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .role-row .muted {
    margin-top: 0.2rem;
    line-height: 1.4;
  }
  /* This badge wraps only the emoji (the role name sits outside it, in its own
     <strong>) - .role-emoji's margin-right (for when text follows in the same
     badge, like the post-assignment roster) has nothing to balance here, which
     pushed the emoji off-center inside the pill. */
  .role-row .role-title .badge .role-emoji {
    margin-right: 0;
  }

  .night-role-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    /* Scaled-up version of .roles-info-row's badge+name row (combined with that
       class on the same element in renderNight) - same look as "Szerepek
       leírása", just sized to read as a screen header instead of a compact list
       row. */
    font-size: 1.3rem;
  }
  .night-role-header .badge {
    padding: 0.4rem 0.8rem;
  }
  .night-role-header .role-emoji {
    font-size: 1.6rem;
  }
  /* This badge wraps only the emoji (the role name sits outside it, in its own
     <strong>) - .role-emoji's margin-right (for when text follows in the same
     badge elsewhere) has nothing to balance here, which pushes the emoji
     off-center inside the pill. Same fix as .role-row's badge (setup screen). */
  .roles-info-row .badge .role-emoji {
    margin-right: 0;
  }
  .card-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .role-count-badge {
    font-size: 0.9rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
  }
  .role-count-badge.over {
    color: var(--danger);
  }
  .role-emoji-lg {
    font-size: 1.8rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--panel-2);
  }
  .role-row input { width: 4rem; }

  .linked-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.5rem;
    padding: 0.3rem 0.5rem;
    font-weight: 600;
    color: var(--muted);
  }

  .toggle-switch {
    position: relative;
    width: 44px;
    height: 24px;
    padding: 0;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .toggle-switch[aria-pressed="true"] {
    background: rgba(108,140,255,0.25);
    border-color: var(--accent);
  }
  .toggle-switch[aria-pressed="true"]::after {
    transform: translateX(20px);
    background: var(--accent);
  }

  .toggle-with-count {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
  }

  .target-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  /* Tonight's role order, top of every night screen - see nightProgressHtml(). */
  .night-progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.9rem;
  }
  .night-progress-step {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    padding: 0;
    flex-shrink: 0;
    border-radius: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 1.05rem;
    opacity: 0.35;
    cursor: pointer;
  }
  .night-progress-step:hover {
    opacity: 0.6;
    border-color: var(--accent);
  }
  .night-progress-step.current:hover {
    opacity: 1;
  }
  /* CSS-drawn chevron instead of a text character - a glyph's height/baseline
     never quite lines up with the step boxes next to it, so this is sized and
     centered against the same 2rem height as .night-progress-step instead. */
  .night-progress-arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 0.6rem;
    height: 2rem;
    flex-shrink: 0;
  }
  .night-progress-arrow::before {
    content: '';
    width: 0.5rem;
    height: 0.5rem;
    border-right: 2px solid var(--muted);
    border-top: 2px solid var(--muted);
    transform: rotate(45deg);
  }
  .night-progress-step.done {
    opacity: 0.75;
  }
  /* Actually picked something this round. */
  .night-progress-step.done.acted {
    background: rgba(108,255,171,0.18);
    border-color: var(--ok);
  }
  /* Passed through with nothing recorded - either "Kihagyás" or nobody could
     act that round - worth a second look before "Reggel". */
  .night-progress-step.done.skipped {
    background: rgba(255,207,108,0.18);
    border-color: var(--semleges);
  }
  /* No living holder left at all - permanent for the rest of the game, unlike
     an abduction (which can un-happen the moment the UFO's target moves), so
     this gets its own distinct look instead of sharing the amber "worth
     double-checking" color with something that might still change. */
  .night-progress-step.done.dead {
    background: rgba(255,255,255,0.08);
    border-color: var(--muted);
  }
  .night-progress-step.done.dead .night-progress-emoji {
    filter: grayscale(1) brightness(0.55);
  }
  .night-progress-step.current {
    opacity: 1;
    border-color: var(--accent);
    background: rgba(108,140,255,0.2);
    transform: scale(1.15);
  }

  .target-grid button {
    padding: 0.9rem 0.5rem;
    /* <button> clips overflowing content by default in some browsers even
       without an explicit overflow:hidden anywhere - without this, a tall emoji
       glyph in .tile-emoji-line (overflow:visible there, see that rule) still
       got its top sliced off by the button itself. */
    overflow: visible;
    /* A grid item's default min-width is "auto", which lets its intrinsic content
       size (here, a long NOWRAP player name in .tile-name-line) override the
       column's minmax(120px, 1fr) track sizing - different renders (whichever
       tile currently has the longest name) then get different actual column
       widths, making the whole board visibly shift left/right between screens.
       This makes the track win instead, so .tile-name-line's own ellipsis
       actually kicks in rather than the button forcing the grid wider. */
    min-width: 0;
  }

  .target-grid button.selected {
    border-color: var(--accent);
    background: rgba(108,140,255,0.18);
  }

  .tile-name-line {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tile-emoji-line {
    display: block;
    /* Fixed height (not min-height) - emoji glyphs commonly render taller than
       plain text at the same font-size, so a min-height-only box was still growing
       (and dragging the whole grid row along with it) the moment one got added.
       Two lines' worth now, since several bond-transferred actions can stack up
       on one tile at once. overflow:visible (not hidden) - the fixed height still
       keeps every tile in a row the same height, but an emoji taller than that
       (or a third line, if one ever stacks up) is allowed to spill past this box's
       edge instead of being silently sliced off - better to poke out a little
       than to lose part of a glyph.
    */
    height: 2.9rem;
    line-height: 1.35rem;
    margin-top: 0.4rem;
    padding-top: 0.25rem;
    border-top: 1px solid var(--border);
    text-align: left;
    white-space: normal;
    overflow: visible;
    word-break: break-word;
  }

  .target-grid-wrap {
    position: relative;
  }
  .board-popup {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem;
    background: rgba(10,10,16,0.72);
    border-radius: 10px;
  }
  .board-popup-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    text-align: center;
    max-width: 90%;
  }
  .board-popup-box .reason-line {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
  }
  .coffin-name-row {
    position: relative;
    display: inline-block;
    margin-top: 0.5rem;
  }
  .coffin-name-row .coffin-icon {
    position: absolute;
    top: 50%;
    right: 100%;
    transform: translateY(-50%);
    margin-right: 0.35rem;
    white-space: nowrap;
  }
  /* A plain circle emoji next to the coffin rendered inconsistently across
     fonts/platforms - a solid white/black background behind just the coffin
     itself reads as the intended "which team" badge everywhere instead. Same
     wide pill shape as the role badges (.badge) elsewhere, not a tight circle. */
  .coffin-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 1.2em;
    vertical-align: middle;
    border: 1px solid var(--border);
  }
  .coffin-badge.white { background: #f2f2f2; }
  .coffin-badge.black { background: #1a1a1a; }
  .board-popup-box .prompt {
    text-align: center;
  }
  .popup-choice-row {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 0.75rem;
  }
  .popup-choice-row button {
    padding: 0.75rem 1rem;
  }
  .popup-choice-row button.selected {
    border-color: var(--accent);
    background: rgba(108,140,255,0.18);
  }
  .assignee-card.assigned {
    opacity: 0.55;
    cursor: default;
  }

  .prompt {
    /* <p> has a browser-default top margin (~1em) that nothing here ever wanted -
       most noticeable in the compact popup boxes (see .board-popup-box), where
       it pushed the text down away from the box's own top padding instead of
       sitting flush under it. */
    margin: 0 0 0.25rem;
    font-size: 1.1rem;
  }

  .muted { color: var(--muted); font-size: 0.9rem; }

  /* A kezdőlap szándékosan nincs .card-ba zárva - keret/panel nélkül,
     közvetlenül az oldal hátterén ül. */
  .home-card {
    text-align: center;
    padding: 2.5rem 1.5rem;
  }
  .home-title { font-size: 1.5rem; margin: 0 0 0.75rem; }
  .home-card .muted { max-width: 32rem; margin: 0 auto 1.5rem; }

  /* Idle nap/hold ciklus emojikkal a város fölött - lásd skyWidgetHtml(),
     újrafelhasználható máshol is (pl. a játék közbeni képernyőkön). */
  .sky-widget-emoji {
    /* Explicit width, not just max-width - .sky-arc-area's only children are
       absolutely positioned (the sun/moon), so it has no normal-flow content of
       its own to size itself by. As a flex item (see #sky-widget-root) that meant
       it collapsed to near-zero width instead of the intended 280px, decoupling
       the house's position from the coordinate space the sun/moon math assumes. */
    width: 280px;
    max-width: 100%;
    margin: 0 auto 1rem;
    /* .town-emoji has no centering of its own - on the home screen it only looks
       centered because it inherits text-align:center from .home-card. The in-game
       context has no such ancestor, so without this, the house glyph sits
       left-aligned inside this (correctly centered) box - that was the actual
       ~100px shift all along, not a box-positioning problem. */
    text-align: center;
    /* Positioning context for .sky-timer-overlay (the day countdown, sat above
       the house so the sun/moon passes behind the number, not behind the house). */
    position: relative;
  }
  .sky-arc-area {
    position: relative;
    height: 100px;
  }
  .sky-emoji {
    position: absolute;
    top: 0;
    left: 0;
    font-size: 2.4rem;
    line-height: 1;
    offset-path: path('M40,65 Q140,25 240,65');
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: 16s;
  }
  .sun-emoji { animation-name: sky-sun-arc; }
  .moon-emoji { animation-name: sky-moon-arc; }
  .town-emoji { font-size: 3.6rem; margin-top: -0.25rem; }

  /* The day discussion countdown, laid over the sky area above the house instead
     of sitting in its own row underneath the whole widget - the sun's arc (see
     .sky-emoji above, low points around y:70) runs right through this same spot,
     so it passes visibly behind the number instead of the two never overlapping. */
  .sky-timer-overlay {
    position: absolute;
    left: 50%;
    top: 85px;
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  @keyframes sky-sun-arc {
    0%   { offset-distance: 0%;   opacity: 0; }
    5%   { opacity: 1; }
    45%  { opacity: 1; }
    50%  { offset-distance: 100%; opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes sky-moon-arc {
    0%   { offset-distance: 0%;   opacity: 0; }
    50%  { offset-distance: 0%;   opacity: 0; }
    55%  { opacity: 1; }
    95%  { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sun-emoji, .moon-emoji {
      animation: none;
    }
    .sun-emoji { offset-distance: 35%; opacity: 1; }
    .moon-emoji { opacity: 0; }
  }

  /* Same sky widget, but driven from real game state instead of an idle CSS loop -
     see renderSkyWidget()/daySkyWidgetHtml()/nightSkyWidgetHtml(). Sits above the
     board (#sky-widget-root, before <main>) during the day/night phases: the sun
     glides across as the 7-minute discussion timer counts down, the moon steps
     forward each time a night action is confirmed/skipped. Reuses .sky-widget-emoji
     at its normal (home screen) size, unscaled - the offset-path's coordinates are
     an SVG path baked to that size, so shrinking the container without also
     rescaling the path just misaligns the emoji against it. */
  #sky-widget-root:empty { display: none; }
  /* Flex-centered rather than relying on the widget's own margin:auto - guarantees
     centering regardless of what .sky-widget-inline (below) does to that margin. */
  #sky-widget-root {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .sky-widget-inline {
    margin: 0.75rem 0 0;
  }
  .sky-emoji-manual {
    animation: none;
    /* Positioned via plain left/top (see skyArcPosition()), not offset-path - so
       this cancels the inherited path/anchor entirely rather than fighting it. */
    offset-path: none;
    transform: translate(-50%, -50%);
  }
  @keyframes sky-sun-reveal {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .sky-emoji-reveal {
    animation: sky-sun-reveal 0.8s ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .sky-emoji-reveal { animation: none; }
  }
  .sky-timer-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    margin: 0.4rem 0 0.25rem;
  }
  .sky-timer-text {
    font-variant-numeric: tabular-nums;
    font-size: 3.8rem;
    font-weight: 700;
    color: var(--text);
    /* Taller/narrower digits, closer to a digital-clock face than the default
       system sans - falls back to a plain condensed hint on the default font
       where "Arial Narrow" isn't installed. */
    font-family: 'Arial Narrow', 'Segoe UI Condensed', Arial, sans-serif;
    font-stretch: condensed;
    /* Stays readable when the sun/moon (see .sky-timer-overlay) passes directly
       behind the number. */
    text-shadow: 0 0 6px var(--bg), 0 0 12px var(--bg);
  }

  .banner {
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.75rem;
  }
  .banner.info { background: rgba(108,140,255,0.12); border: 1px solid var(--accent); }
  .banner.warn { background: rgba(255,108,108,0.12); border: 1px solid var(--danger); }
  .banner.win { background: rgba(108,255,171,0.12); border: 1px solid var(--ok); }
  .banner-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .history-pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin: 0.5rem 0 1rem;
  }
  .history-pager strong {
    min-width: 5rem;
    text-align: center;
  }

  /* Collapsible "what happened last night" recap on the day screen - closed by
     default, only for the narrator to check if they want to. */
  .night-summary {
    margin-bottom: 0.75rem;
  }
  .night-summary summary {
    cursor: pointer;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 0.9rem;
    list-style: none;
  }
  .night-summary summary::-webkit-details-marker { display: none; }
  .night-summary summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 0.4em;
    transition: transform 0.15s ease;
  }
  .night-summary[open] summary::before {
    transform: rotate(90deg);
  }
  .night-summary .player-list {
    margin-top: 0.5rem;
  }

  /* An attempted action that's already known not to take effect (protected,
     immune, abducted, or - for the Gyilkos - every Gyilkos got abducted before it
     landed) - see resolveTentativeNight() and voidedMarker(). Dimmed instead of
     hidden, so it's still clear something was tried, just distinguished from
     what actually stuck. */
  .outcome-voided {
    opacity: 0.35;
  }

  footer.actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  /* Pins this button (and anything before it in the same footer) to the left
     edge, pushing the rest of that footer's buttons into their usual
     right-aligned group instead - e.g. "Vissza"/"Kihagyás" split off from the
     primary forward action. */
  footer.actions .pin-left {
    margin-right: auto;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    z-index: 100;
  }

  .modal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 1.1rem;
  }

  .roles-info-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .roles-info-list li:not(:last-child) {
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .roles-info-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }
</style>
</head>
<body>

<header>
  <h1><button type="button" class="header-title-button" data-action="go-home"><span class="header-town-emoji">🏘️</span> Alszik a város</button></h1>
  <div class="header-right">
    <div class="status" id="status-line">Betöltés...</div>
  </div>
</header>

<div class="app-column">
  <div id="sky-widget-root"></div>
  <main id="app"></main>
  <div class="roles-info-trigger">
    <button class="small" data-action="toggle-roles-modal">Szerepek leírása</button>
  </div>
</div>
<div id="modal-root"></div>

<script src="roles.js"></script>
<script src="game.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const statusLine = document.getElementById('status-line');
  const modalRoot = document.getElementById('modal-root');
  const skyWidgetRoot = document.getElementById('sky-widget-root');

  let rolesModalOpen = false;

  function renderModal() {
    if (!rolesModalOpen) {
      modalRoot.innerHTML = '';
      return;
    }
    const rows = ROLES.map((r) => `
      <li>
        <div class="roles-info-row">
          <span class="badge ${r.team}">${roleEmoji(r)}</span>
          <strong>${r.name}</strong>
        </div>
        <p class="muted">${r.description}</p>
      </li>
    `).join('');

    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-card">
          <div class="modal-header">
            <h2>Szerepek leírása</h2>
            <button class="small" data-action="close-roles-modal">✕</button>
          </div>
          <ul class="roles-info-list">${rows}</ul>
        </div>
      </div>
    `;
  }

  function teamLabel(team) {
    return { polgarok: 'Polgárok', gyilkosok: 'Gyilkosok', semleges: 'Semleges' }[team] || team;
  }

  function teamLabelSingular(team) {
    return { polgarok: 'Polgár', gyilkosok: 'Gyilkos', semleges: 'Semleges' }[team] || team;
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function renderStatus(state) {
    const phaseLabel = {
      home: 'Kezdőlap',
      setup: 'Előkészítés',
      night: 'Éjszaka',
      day: 'Nappal',
      ended: 'Vége',
    }[state.phase];
    statusLine.textContent = state.round > 0
      ? `${state.round}. kör - ${phaseLabel}`
      : phaseLabel;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Wraps a role's emoji (see roles.js) in a span for consistent sizing/spacing.
  // How this actually renders (art style, or a missing-glyph box) is entirely up to
  // the viewer's device/OS - see the note in the roles modal for why.
  function roleEmoji(role, extraClass = '') {
    if (!role || !role.emoji) return '';
    return `<span class="role-emoji${extraClass ? ' ' + extraClass : ''}">${role.emoji}</span>`;
  }

  // Label for a player button during the game (night targeting, day elimination) -
  // the narrator sees everyone's role anyway, so showing it speeds up target picking.
  function playerLabel(p) {
    return `${roleEmoji(Game.getRole(p.roleId))}${escapeHtml(p.name)}`;
  }

  // The other half of tonight's Cupido pair for playerId, or null.
  function linkedPartnerId(state, playerId) {
    const link = state.nightActions.cupido;
    if (!link || !link.pairIds) return null;
    const [a, b] = link.pairIds;
    if (a === playerId) return b;
    if (b === playerId) return a;
    return null;
  }

  // The acting role's own emoji (see roles.js) - reused as the "this happened"
  // marker everywhere instead of a separate, hand-picked symbol per action. One
  // consistent set of emoji (the roles') instead of two overlapping ones to keep
  // matched up.
  function roleActionEmoji(roleId) {
    const role = Game.getRole(roleId);
    return role && role.emoji ? role.emoji : '';
  }

  // Left-to-right order night-action markers appear in, matching the nightOrder
  // (Gyilkos=1, UFO=2, Cupido=3, Csonkoló=4, Orvos=5, Rendőr=6, Pék=7) - so a live
  // preview during selection always slots into the same spot it'll end up in once
  // actually confirmed, instead of always landing at the end regardless of which
  // role acts.
  const OUTCOME_ROLE_ORDER = ['ufo', 'cupido', 'katona-shield', 'pek', 'orvos', 'csonkolo', 'gyilkos', 'nyomozo'];

  // Wraps an outcome emoji that was attempted but is already known not to take
  // effect, so it renders dimmed instead of full-strength - see
  // resolveTentativeNight() below for what "already known" means.
  function voidedMarker(emoji) {
    return `<span class="outcome-voided">${emoji}</span>`;
  }

  // White for a polgárok/semleges-aligned death, black for a gyilkosok-aligned
  // one - the coffin's own background instead of a separate circle emoji next
  // to it, which rendered inconsistently across fonts/platforms.
  function coffinBadge(guilty) {
    return `<span class="coffin-badge ${guilty ? 'black' : 'white'}">⚰️</span>`;
  }

  // The single source of truth for "what would tonight look like" - every night
  // marker (nightOutcomeByRole() below) reads its answer from here instead of
  // separately re-deriving abduction/bond/protection logic with its own
  // hand-threaded tentative options. That used to cause real bugs: one
  // function's tentative-awareness could drift out of sync with another's (e.g.
  // the maim-voiding check reading the CONFIRMED Cupido bond while the marker
  // deciding whether to show it at all already used the tentative one), so a
  // marker could show but never grey out right, or grey out but not on the tile
  // that actually explains why.
  //
  // override describes the ONE role currently being edited on its own screen,
  // before "Következő" is pressed - every other role's action is read straight
  // from the confirmed state.nightActions, since only one screen (one role) is
  // ever mid-edit at a time:
  //   { role: 'ufo', targetId }      - UFO's own screen
  //   { role: 'cupido', pairIds }    - Cupido's own screen, once both picks are made
  //   { role: 'orvos', targetId }    - Orvos's own screen
  //   { role: 'csonkolo', targetId } - Csonkoló's own screen, before a body part is even chosen
  // Omit (or pass null/undefined) to resolve the confirmed state only.
  function resolveTentativeNight(state, override) {
    const na = state.nightActions;
    const ov = override || {};
    const ufoTargetId = ov.role === 'ufo' ? (ov.targetId || null) : (na.ufo ? na.ufo.targetId : null);
    const cupidoPairIdsRaw = ov.role === 'cupido' ? (ov.pairIds || null) : (na.cupido ? na.cupido.pairIds : null);
    const orvosTargetIdRaw = ov.role === 'orvos' ? (ov.targetId || null) : (na.orvos ? na.orvos.targetId : null);
    const csonkoloTargetIdRaw = ov.role === 'csonkolo' ? (ov.targetId || null) : (na.csonkolo ? na.csonkolo.targetId : null);
    const csonkoloBodyPartRaw = ov.role === 'csonkolo' ? null : (na.csonkolo ? na.csonkolo.bodyPart : null);

    // Who's unreachable tonight - the UFO's direct target, plus anyone Cupido
    // bonded to them (chain-drag), mirroring game.js's own computeAbductedIds().
    // Deliberately uses the RAW (un-gated) Cupido pair, not the actor-gated one
    // below - the bond's mere EXISTENCE still chain-drags an abduction even if
    // Cupido's own actor turns out to also be abducted; only the bond's OTHER
    // effects (see actorAbducted() below) go away.
    const abductedIds = [];
    if (ufoTargetId) abductedIds.push(ufoTargetId);
    if (cupidoPairIdsRaw) {
      const [a, b] = cupidoPairIdsRaw;
      if (abductedIds.includes(a) && !abductedIds.includes(b)) abductedIds.push(b);
      else if (abductedIds.includes(b) && !abductedIds.includes(a)) abductedIds.push(a);
    }
    const isAbducted = (id) => id != null && abductedIds.includes(id);

    // A single-holder role (Orvos/Cupido/Csonkoló/Pék/Rendőr) whose own holder
    // got abducted tonight doesn't act at all - "és az ő éjszakai szerepe sem
    // érvényesül" (roles.js's UFO description), mirroring game.js's own
    // resolveNight(). Whatever they picked is still sitting in
    // state.nightActions (nothing here deletes it) - every marker below just
    // treats it as if it never happened, so it disappears from the preview
    // entirely (not merely dimmed - there was nothing to attempt).
    function actorAbducted(roleId) {
      if (roleId === 'ufo') return false; // see roleHasActor()'s comment - the UFO can't void its own turn
      const holder = state.players.find((p) => p.roleId === roleId);
      return !!holder && isAbducted(holder.id);
    }
    const cupidoPairIds = actorAbducted('cupido') ? null : cupidoPairIdsRaw;
    const orvosTargetId = actorAbducted('orvos') ? null : orvosTargetIdRaw;
    const csonkoloTargetId = actorAbducted('csonkolo') ? null : csonkoloTargetIdRaw;
    const csonkoloBodyPart = csonkoloTargetId ? csonkoloBodyPartRaw : null;
    const pekGated = actorAbducted('pek');
    const nyomozoGated = actorAbducted('nyomozo');

    // Who's bonded to whom tonight - fully driven by the (actor-gated) Cupido
    // pair above for EVERY player, including returning null for someone who was
    // confirmed-bonded before a tentative edit dropped them from the new pair
    // (or before the Cupido player themselves turned out to be abducted),
    // instead of only the two currently-tapped candidates knowing about it.
    function partnerOf(playerId) {
      if (!cupidoPairIds) return null;
      const [a, b] = cupidoPairIds;
      if (a === playerId) return b;
      if (b === playerId) return a;
      return null;
    }

    const gyilkosTargetIds = (na.gyilkos && na.gyilkos.targetIds) || [];
    const livingGyilkosok = state.players.filter((p) => p.alive && p.roleId === 'gyilkos');
    const allKillersAbducted = livingGyilkosok.length > 0 && livingGyilkosok.every((p) => isAbducted(p.id));

    // Mirrors resolveNight()'s (game.js) per-target kill check, run against
    // whatever's known SO FAR (tentative or confirmed) instead of waiting for
    // the whole night to be locked in. Exposed on the returned object (not just
    // used internally by forPlayer below) so the Gyilkos's OWN screen can ask
    // "would THIS candidate's kill land" live, before na.gyilkos even exists yet
    // this round - a shielded Katona (or an already-abducted/protected candidate,
    // if the narrator's revisited Gyilkos after UFO/Orvos already acted) previews
    // as voided the moment they're tapped, not just once the night resolves.
    function killVoidedFor(targetId) {
      if (allKillersAbducted) return true;
      const partnerId = partnerOf(targetId);
      if (isAbducted(targetId) || (partnerId && isAbducted(partnerId))) return true;
      const targetPlayer = state.players.find((p) => p.id === targetId);
      const targetRole = targetPlayer ? Game.getRole(targetPlayer.roleId) : null;
      const partnerPlayer = partnerId ? state.players.find((p) => p.id === partnerId) : null;
      const partnerRole = partnerPlayer ? Game.getRole(partnerPlayer.roleId) : null;
      // A Katona's shield only blocks a kill until it's actually been used once -
      // this is a PREVIEW (nothing is consumed here, see resolveNight() for the
      // real, consuming check), so it just reads whether either side of tonight's
      // pair still has theirs.
      if ((targetRole && targetRole.hasShield && !targetPlayer.shieldUsed)
        || (partnerRole && partnerRole.hasShield && partnerPlayer && !partnerPlayer.shieldUsed)) return true;
      if (orvosTargetId != null && (targetId === orvosTargetId || partnerId === orvosTargetId)) return true;
      return false;
    }

    // Mirrors resolveNight()'s maimAction check - voided if the (original,
    // pre-bond-drag) target was abducted or protected. A single yes/no for
    // tonight, not per-player - forPlayer() below applies it to whichever
    // tile(s) csonkoloTargetId (or their bonded partner) actually hit.
    const csonkoloVoided = !!csonkoloTargetId && (isAbducted(csonkoloTargetId) || (
      orvosTargetId != null
      && (csonkoloTargetId === orvosTargetId || partnerOf(csonkoloTargetId) === orvosTargetId)
    ));

    // Everything tonight from ONE player's point of view - the shared basis for
    // every marker on their tile (nightOutcomeByRole() below).
    function forPlayer(playerId) {
      const partnerId = partnerOf(playerId);
      const abducted = isAbducted(playerId) || (!!partnerId && isAbducted(partnerId));
      const selfPlayer = state.players.find((p) => p.id === playerId);
      const selfRole = selfPlayer ? Game.getRole(selfPlayer.roleId) : null;
      const partnerPlayer = partnerId ? state.players.find((p) => p.id === partnerId) : null;
      const partnerRole = partnerPlayer ? Game.getRole(partnerPlayer.roleId) : null;

      // If every living gyilkos was abducted tonight, nobody was left to even
      // attempt a kill - same class as a single-holder role's actor being
      // abducted (see actorAbducted() above), so the skull disappears entirely
      // instead of showing dimmed like a kill that was attempted but defended
      // against (Orvos/Katona/target itself abducted).
      const gyilkosHit = !allKillersAbducted && (gyilkosTargetIds.includes(playerId) || (!!partnerId && gyilkosTargetIds.includes(partnerId)));
      const gyilkosTargetForThis = gyilkosTargetIds.includes(playerId) ? playerId : partnerId;
      const csonkoloHit = !!csonkoloTargetId && (csonkoloTargetId === playerId || csonkoloTargetId === partnerId);

      return {
        partnerId,
        abducted,
        cupido: !!(cupidoPairIds && cupidoPairIds.includes(playerId)),
        // The Katona's own still-unused shield - shown on their OWN tile as a
        // standing "still protected" marker, same as any other night action,
        // for as long as player.shieldUsed stays false (see resolveNight()).
        hasOwnShield: !!(selfRole && selfRole.hasShield && selfPlayer && !selfPlayer.shieldUsed),
        // The shield also extends to whoever Cupido bonded the Katona with
        // tonight (see resolveNight()'s shieldHolder check) - shown on the
        // PARTNER only (checking the partner's role naturally excludes the
        // Katona themselves, already covered by hasOwnShield above).
        katonaShield: !!(partnerRole && partnerRole.hasShield && partnerPlayer && !partnerPlayer.shieldUsed),
        pek: !pekGated && !!(na.pek && (na.pek.targetId === playerId || na.pek.targetId === partnerId)),
        orvos: !!(orvosTargetId != null && (orvosTargetId === playerId || orvosTargetId === partnerId)),
        csonkolo: csonkoloHit,
        csonkoloVoided: csonkoloHit && csonkoloVoided,
        csonkoloBodyPart,
        gyilkos: gyilkosHit,
        gyilkosVoided: gyilkosHit && killVoidedFor(gyilkosTargetForThis),
        nyomozo: !nyomozoGated && !!(na.nyomozo && na.nyomozo.targetId === playerId),
      };
    }

    return { abductedIds, partnerOf, forPlayer, csonkoloVoided, killVoidedFor };
  }

  // Everything tonight for playerId, keyed by role (see OUTCOME_ROLE_ORDER) - the
  // shared basis for both nightOutcomeEmoji() and the live-preview version in
  // nightTileLabel(). Just formats resolveTentativeNight()'s per-player answer
  // into emoji, wrapping the voided ones in voidedMarker() - all the actual
  // "what happened / would happen" logic lives there now, not here.
  //
  // override: forwarded straight to resolveTentativeNight() - see there.
  function nightOutcomeByRole(state, playerId, override) {
    const info = resolveTentativeNight(state, override).forPlayer(playerId);
    return {
      ufo: info.abducted ? roleActionEmoji('ufo') : '',
      cupido: info.cupido ? roleActionEmoji('cupido') : '',
      'katona-shield': (info.hasOwnShield || info.katonaShield) ? (info.abducted ? voidedMarker(roleActionEmoji('katona')) : roleActionEmoji('katona')) : '',
      pek: info.pek ? (info.abducted ? voidedMarker(roleActionEmoji('pek')) : roleActionEmoji('pek')) : '',
      orvos: info.orvos ? (info.abducted ? voidedMarker(roleActionEmoji('orvos')) : roleActionEmoji('orvos')) : '',
      // Gyilkos's kill and the Csonkoló's maim show what actually happened, not the
      // acting role's own emoji - a skull for a kill, specifically which body part
      // for a maim (same for the bonded partner too, since it's the same bodyPart).
      csonkolo: info.csonkolo
        ? (info.csonkoloVoided ? voidedMarker(info.csonkoloBodyPart === 'kez' ? '✋' : '👅') : (info.csonkoloBodyPart === 'kez' ? '✋' : '👅'))
        : '',
      gyilkos: info.gyilkos ? (info.gyilkosVoided ? voidedMarker('💀') : '💀') : '',
      nyomozo: info.nyomozo ? roleActionEmoji('nyomozo') : '',
    };
  }

  function nightOutcomeEmoji(state, playerId) {
    const byRole = nightOutcomeByRole(state, playerId);
    const parts = OUTCOME_ROLE_ORDER.map((r) => byRole[r]).filter(Boolean);
    return parts.length ? ` ${parts.join(' ')}` : '';
  }

  // Whether anyone can actually perform this role's action tonight - false once every
  // living holder is abducted (or the role's only holder(s) are dead). Drives the
  // "mock" turn in renderNight(): the role still gets called every night (see
  // beginNight() in game.js), but with nothing to click, just "Tovább".
  //
  // The UFO is exempt from its OWN abducted-ness here: Cupido can bond the UFO's
  // holder to whoever the UFO just targeted, which (correctly) chain-drags the
  // UFO's holder into state.abductedIds too - untouchable by the kill, same as
  // anyone else abducted. But treating that as "the UFO's own turn is voided"
  // would be a paradox (the UFO can't un-pick its own target by picking it), and
  // in practice locks the UFO's turn forever - see roleActorAbducted() below,
  // which the progress bar and resolveTentativeNight()'s actorAbducted() both
  // mirror this same exemption from.
  function roleHasActor(state, role) {
    return Game.alivePlayers().some((p) => p.roleId === role.id && (role.id === 'ufo' || !state.abductedIds.includes(p.id)));
  }

  // Whether roleId's own holder got abducted tonight - same rule
  // resolveTentativeNight()'s actorAbducted() (and game.js's resolveNight())
  // apply to void a single-holder role's own action, just reading the
  // already-CONFIRMED state.abductedIds instead of accepting a tentative
  // override - every caller here only cares once na.ufo/na.cupido are locked
  // in (see nightProgressHtml() below).
  function roleActorAbducted(state, roleId) {
    if (roleId === 'ufo') return false; // see roleHasActor()'s comment above
    const holder = state.players.find((p) => p.roleId === roleId);
    return !!holder && state.abductedIds.includes(holder.id);
  }

  // Step row at the top of every night screen showing tonight's full, fixed role
  // order (state.nightRoleOrder - see beginNight() in game.js) so the narrator
  // can see where they are (state.nightCursor) and what's still coming, not just
  // the current role's own screen. Each step is clickable (jump-night-step,
  // Game.jumpToNightStep()) - tapping any step just moves the pointer there,
  // forward or back; nothing about a role's own pick ever changes just from
  // navigating past or away from it (see syncNightSelectionFromState()).
  function nightProgressHtml(state) {
    const order = state.nightRoleOrder;
    if (order.length === 0) return '';
    const stepsHtml = order.map((id, i) => {
      const role = Game.getRole(id);
      const current = i === state.nightCursor;
      // Uses state.nightVisited (every role actually confirmed/skipped PAST at
      // least once THIS night - see advanceNightCursor() in game.js), not
      // nightCursor's position - stepping back or jumping to an earlier/later
      // role only moves where we're currently LOOKING, so a role already
      // decided elsewhere should keep showing as decided instead of reverting
      // to "upcoming" just because the pointer moved off it. Also correctly
      // stays "upcoming" for a role the narrator jumped straight past without
      // ever landing on, even though it's now numerically behind the cursor.
      const visited = state.nightVisited.includes(id);
      const hasAction = !!state.nightActions[id];
      // Combines BOTH reasons a role can't be meaningfully acted on right now -
      // every living holder already dead, or the sole holder currently abducted
      // by the UFO (same check renderNight() uses to decide whether to show the
      // mock "Tovább"-only screen instead of a real board) - checked live every
      // render against CURRENT state, not frozen from whenever the role was last
      // visited. That's what lets this go both ways: a role that's currently
      // abducted shows amber right away even before the narrator ever reaches it
      // (it's already a dead certainty), and one that WAS abducted earlier but
      // isn't any more stops being forced into that state below.
      const currentlyInactive = !roleHasActor(state, role);
      // No living holder at all, as opposed to merely abducted - permanent for
      // the rest of the game (nobody's coming back to act this role out), so it
      // gets its own "dead" color instead of sharing the amber "worth
      // double-checking, might still change" one with a live abduction.
      const noLivingHolder = !state.players.some((p) => p.roleId === id && p.alive);
      // A role only ever landed on "no action" through that mock/no-actor screen
      // (see skipNightAction() in game.js) wasn't a real "Kihagyás" - the
      // narrator was never actually offered a choice, so it shouldn't keep
      // looking like a deliberate skip once the role's holder becomes reachable
      // again (e.g. the UFO's target moves elsewhere). state.nightForcedSkipped
      // tracks exactly that, separately from nightVisited.
      const forcedSkip = state.nightForcedSkipped.includes(id);
      const decided = hasAction || currentlyInactive || (visited && !forcedSkip);
      const status = current ? 'current' : decided ? 'done' : 'upcoming';
      const acted = hasAction && !currentlyInactive;
      const outcomeClass = status !== 'done' ? '' : noLivingHolder ? ' dead' : (acted ? ' acted' : ' skipped');
      const titleSuffix = status !== 'done' ? '' : noLivingHolder ? ' — nincs élő birtokos'
        : (acted ? '' : roleActorAbducted(state, id) ? ' — elrabolva, érvénytelen' : ' — kihagyva');
      const stepHtml = `<button type="button" class="night-progress-step ${status}${outcomeClass}" data-action="jump-night-step" data-role-id="${id}" title="${escapeHtml(role ? role.name : '')}${titleSuffix}"><span class="night-progress-emoji">${roleActionEmoji(id)}</span></button>`;
      const arrowHtml = i < order.length - 1 ? '<span class="night-progress-arrow"></span>' : '';
      return stepHtml + arrowHtml;
    }).join('');
    return `<div class="night-progress">${stepsHtml}</div>`;
  }

  // previewEmoji: shown immediately while a candidate is merely selected/highlighted,
  // before the action is even confirmed - same as a role's emoji already showing up
  // next to a tapped-but-not-yet-confirmed candidate on the "Szerepek kiosztva" board.
  function nightPlayerLabel(state, p, previewEmoji = '') {
    const confirmed = nightOutcomeEmoji(state, p.id);
    const preview = previewEmoji ? ` ${previewEmoji}` : '';
    return `${playerLabel(p)}${confirmed}${preview}`;
  }

  // Same as nightPlayerLabel, but for grid tiles (target-grid/assignee-card buttons):
  // puts the outcome/preview emoji on its own (two-line-capable) block, in a slot
  // that's always reserved (see .tile-emoji-line), so every tile in the row stays
  // the same size whether or not it actually has anything to show there. The name
  // line is still clamped to one line (see the CSS) - a long name truncates instead
  // of wrapping, so it alone can't grow a tile taller than its neighbours.
  // previewRoleId, if given, slots previewEmoji into its correct spot in
  // OUTCOME_ROLE_ORDER instead of just appending it - so during selection, the
  // marker already sits exactly where it'll end up once actually confirmed. Left
  // out, the preview is just appended - fine there since nothing later in the
  // night could be confirmed yet at that point anyway.
  //
  // Every call site passes previewRoleId as the role CURRENTLY being decided on
  // this exact screen, so once it's given, that role's slot is always driven
  // ENTIRELY by previewEmoji, even when previewEmoji is '' - never falls back to
  // that role's already-confirmed state.nightActions entry. Without this, a
  // candidate who was the role's previously confirmed pick would keep showing
  // its marker after the narrator taps someone else instead, since re-tapping
  // only updates the tentative selection, not state.nightActions itself (that
  // only happens once "Következő" is actually pressed again).
  // override: forwarded straight to nightOutcomeByRole()/resolveTentativeNight() - see there.
  function nightTileLabel(state, p, previewEmoji = '', previewRoleId = null, override) {
    const byRole = nightOutcomeByRole(state, p.id, override);
    const ownField = !!previewRoleId && previewRoleId in byRole;
    if (ownField) {
      byRole[previewRoleId] = previewEmoji;
    }
    const parts = OUTCOME_ROLE_ORDER.map((r) => byRole[r]).filter(Boolean);
    if (previewEmoji && !ownField) parts.push(previewEmoji);
    return `<span class="tile-name-line">${playerLabel(p)}</span><span class="tile-emoji-line">${parts.join(' ')}</span>`;
  }

  // Role display order for the post-assignment roster and the night summary
  // (both share this via roleSortIndex) - reuses roles.js's ROLE_ORDER directly
  // (not a local copy) since game.js's manual assignment queue
  // (beginRoleAssignment) now asks for roles in this exact same order too - one
  // shared list, so display and assignment order can't drift apart.
  const ROLE_SORT_ORDER = ROLE_ORDER;
  function roleSortIndex(roleId) {
    const idx = ROLE_SORT_ORDER.indexOf(roleId);
    return idx === -1 ? ROLE_SORT_ORDER.length : idx;
  }

  // Fixed display order for the role-count/toggle list on the setup screen -
  // separate from ROLE_SORT_ORDER (the post-assignment roster/night summary/ended
  // screen's shared order) since this one's just a narrator-chosen reading order,
  // any role missing from it (e.g. a future addition) just falls at the end.
  const SETUP_ROLE_ORDER = ['gyilkos', 'nyomozo', 'orvos', 'ufo', 'cupido', 'csonkolo', 'komuves', 'gyarimunkas', 'vadasz', 'katona', 'pek', 'fuszeres', 'polgarmester'];
  function setupRoleSortIndex(roleId) {
    const idx = SETUP_ROLE_ORDER.indexOf(roleId);
    return idx === -1 ? SETUP_ROLE_ORDER.length : idx;
  }

  // House-in-a-sky-arc widget (see .sky-widget-emoji) - the one shared building
  // block behind both the home screen's idle nap/hold loop and the state-driven
  // in-game version below, so they can't visually drift apart. arcHtml is whatever
  // goes inside .sky-arc-area (the sun/moon span(s)); extraClass lets a caller add
  // its own modifier without duplicating the house/arc structure itself. overlayHtml
  // (see .sky-timer-overlay) sits on top of the house instead of below the whole
  // widget - aria-hidden lives on the two decorative pieces individually now
  // instead of the outer wrapper, so overlayHtml (real info, not decoration) stays
  // reachable by assistive tech.
  function skyWidgetHtml(arcHtml, extraClass = '', overlayHtml = '') {
    return `
      <div class="sky-widget-emoji${extraClass ? ' ' + extraClass : ''}">
        <div class="sky-arc-area" aria-hidden="true">${arcHtml}</div>
        <div class="town-emoji" aria-hidden="true">🏘️</div>
        ${overlayHtml}
      </div>
    `;
  }

  // Same arc as the home screen's sky-sun-arc/sky-moon-arc keyframes (same
  // quadratic-curve control points as the .sky-emoji offset-path above: left end,
  // top of arc, right end), but computed here as plain left/top pixels instead of
  // an offset-path percentage - avoids relying on the browser's arc-length
  // interpretation of that path, which didn't land where the control points
  // themselves said it should. fraction 0-1 drives it directly, full opacity, no
  // transition (so it snaps to position instead of visibly gliding on a restart).
  function skyArcPosition(fraction) {
    const t = Math.max(0, Math.min(1, fraction));
    const p0 = { x: 40, y: 65 };
    const p1 = { x: 140, y: 25 };
    const p2 = { x: 240, y: 65 };
    const x = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x;
    const y = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y;
    return `left:${x.toFixed(1)}px; top:${y.toFixed(1)}px;`;
  }

  // ---- In-game sky widget (above the board during day/night) ----

  // state.dayTimerMinutes is set on the setup screen (default 7) - read fresh each
  // time rather than cached, since it's fixed for the game but this module loads
  // before any game state exists.
  function dayTimerMs() {
    return (Game.getState().dayTimerMinutes || 7) * 60 * 1000;
  }
  let dayTimerEndAt = null; // epoch ms the discussion timer ends at, or null if not running
  let dayTimerRafId = null; // requestAnimationFrame id, so it can be cancelled on restart/leaving the day
  let daySunEntered = false; // whether the sunrise-in reveal has already played this day

  function formatCountdown(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function stopDayTimerLoop() {
    if (dayTimerRafId) {
      cancelAnimationFrame(dayTimerRafId);
      dayTimerRafId = null;
    }
  }

  function startDayTimer() {
    dayTimerEndAt = Date.now() + dayTimerMs();
    stopDayTimerLoop();
    // requestAnimationFrame instead of a once-a-second interval - the position is
    // recomputed fresh from the actual elapsed time on every frame, so it reads as
    // continuous motion instead of ticking forward once a second.
    const tick = () => {
      renderSkyWidget(Game.getState());
      if (Date.now() < dayTimerEndAt) {
        dayTimerRafId = requestAnimationFrame(tick);
      } else {
        dayTimerRafId = null;
      }
    };
    dayTimerRafId = requestAnimationFrame(tick);
  }

  function daySkyWidgetHtml() {
    const running = dayTimerEndAt !== null;
    const totalMs = dayTimerMs();
    const remainingMs = running ? Math.max(0, dayTimerEndAt - Date.now()) : totalMs;
    const fraction = running ? (totalMs - remainingMs) / totalMs : 0;
    // Before the timer starts, the sun still rests at the arc's start position
    // (fraction 0) - ready for where the timer will pick it up - rather than being
    // hidden entirely. It only plays its rise-in reveal once per day, the first
    // time this screen is shown (see daySunEntered), not on every re-render caused
    // by unrelated clicks (e.g. picking a vote target) before Start is pressed.
    const revealClass = !running && !daySunEntered ? ' sky-emoji-reveal' : '';
    if (!running) daySunEntered = true;
    const arcHtml = `<span class="sky-emoji sky-emoji-manual${revealClass}" style="${skyArcPosition(fraction)}">☀️</span>`;
    // No restart option once it's running - it's a one-shot "start the discussion"
    // button, not a resettable stopwatch. Once running, the countdown itself sits
    // laid over the house (see .sky-timer-overlay) instead of below the whole
    // widget - the Start button stays a normal button underneath, since there's
    // nothing to lay it over yet.
    const timerOverlay = running
      ? `<span class="sky-timer-text sky-timer-overlay">${remainingMs > 0 ? formatCountdown(remainingMs) : 'Lejárt'}</span>`
      : '';
    return `
      ${skyWidgetHtml(arcHtml, 'sky-widget-inline', timerOverlay)}
      ${running ? '' : `<div class="sky-timer-col"><button class="small" data-action="start-day-timer">Start</button></div>`}
    `;
  }

  // Steps forward each time a night action gets confirmed/skipped (nightCursor
  // advances through the fixed nightRoleOrder - see game.js) - not a timer, since
  // the narrator sets the pace here, not a clock.
  function nightSkyWidgetHtml(state) {
    const total = state.nightRoleOrder.length;
    const fraction = total > 0 ? state.nightCursor / total : 0;
    const arcHtml = `<span class="sky-emoji sky-emoji-manual" style="${skyArcPosition(fraction)}">🌙</span>`;
    return skyWidgetHtml(arcHtml, 'sky-widget-inline');
  }

  function renderSkyWidget(state) {
    if (state.phase === Game.PHASES.DAY) {
      skyWidgetRoot.innerHTML = daySkyWidgetHtml();
    } else if (state.phase === Game.PHASES.NIGHT) {
      skyWidgetRoot.innerHTML = nightSkyWidgetHtml(state);
    } else {
      skyWidgetRoot.innerHTML = '';
    }
  }

  // ---- Home screen ----

  function renderHome(state) {
    app.innerHTML = `
      <div class="home-card">
        ${skyWidgetHtml('<span class="sky-emoji sun-emoji">☀️</span><span class="sky-emoji moon-emoji">🌙</span>')}
        <h2 class="home-title">Alszik a város</h2>
        <p class="muted">Játékvezetői segédlet: végigvezet az éjszakai és nappali fázisokon, kiosztja a szerepeket, és nyomon követi az eseményeket.</p>
        <button class="primary" data-action="go-setup">Új játék indítása</button>
      </div>
    `;
  }

  // ---- Setup screen ----

  // Role counts/toggles are plain DOM state, but renderSetup() rebuilds the whole
  // screen from scratch on every add/remove-player - without this draft, that would
  // wipe out whatever the narrator had already configured. Reset on fresh entry to
  // setup (see the 'go-setup' action), not on every re-render within it.
  let roleDraft = { gyilkos: 1 }; // roleId -> number, for plain number inputs (gyilkos)
  let roleToggleDraft = {}; // roleId -> boolean, for every toggle switch

  // Rough headcount-based suggestions: small games (<=6) run with 1 Gyilkos,
  // mid-size (7-13) with 2, large (14+) with 3; past 14 players a single kill a
  // night makes the day phase drag, so killsPerNight defaults to 2 there too.
  // Only APPLIED (see applyAutoDefaults()) while the narrator hasn't manually
  // touched the field themselves (gyilkosAutoSet/killsPerNightAutoSet) - once
  // they've typed their own number, further add/remove-player shouldn't quietly
  // overwrite it.
  function suggestedGyilkosCount(playerCount) {
    if (playerCount <= 6) return 1;
    if (playerCount <= 13) return 2;
    return 3;
  }
  function suggestedKillsPerNight(playerCount) {
    return playerCount > 14 ? 2 : 1;
  }
  let gyilkosAutoSet = true;
  let killsPerNightAutoSet = true;
  function applyAutoDefaults(playerCount) {
    if (gyilkosAutoSet) roleDraft.gyilkos = suggestedGyilkosCount(playerCount);
    if (killsPerNightAutoSet) Game.setKillsPerNight(suggestedKillsPerNight(playerCount));
  }

  function renderSetup(state) {
    const playersHtml = state.players.map((p) => `
      <li>
        <span>${escapeHtml(p.name)}</span>
        <button class="small danger" data-action="remove-player" data-id="${p.id}">✕</button>
      </li>
    `).join('');

    // "Összes bekapcsolása" master toggle - flips every toggleable role (everything
    // with its own on/off switch, i.e. maxCount:1 and not alwaysActive) at once.
    const toggleableRoles = ROLES.filter((r) => r.maxCount === 1 && !r.alwaysActive);
    const allRolesOn = toggleableRoles.length > 0 && toggleableRoles.every((r) => roleToggleDraft[r.id]);
    const selectAllHtml = `
      <div class="role-row">
        <div><strong>Összes bekapcsolása</strong></div>
        <button type="button" class="toggle-switch" data-action="toggle-all-roles" aria-pressed="${allRolesOn ? 'true' : 'false'}"></button>
      </div>
    `;

    const rolesHtml = [...ROLES]
      .filter((r) => r.id !== 'polgar')
      .sort((a, b) => setupRoleSortIndex(a.id) - setupRoleSortIndex(b.id))
      .map((r) => {
      let control;
      if (r.alwaysActive) {
        control = '';
      } else if (r.linkedCountRoleId && r.maxCount === 1) {
        const pressed = roleToggleDraft[r.id] ? 'true' : 'false';
        control = `
          <div class="toggle-with-count">
            <button type="button" class="toggle-switch" data-action="toggle-role-single" data-role-id="${r.id}" aria-pressed="${pressed}"></button>
            <span class="linked-count" id="count-${r.id}-display">0</span>
          </div>
        `;
      } else if (r.linkedCountRoleId) {
        control = `<span class="linked-count" id="count-${r.id}-display">0</span>`;
      } else if (r.maxCount === 1) {
        const pressed = roleToggleDraft[r.id] ? 'true' : 'false';
        control = `<button type="button" class="toggle-switch" data-action="toggle-role-single" data-role-id="${r.id}" aria-pressed="${pressed}"></button>`;
      } else {
        const minCount = r.minCount || 0;
        control = `<input type="number" min="${minCount}" id="count-${r.id}" value="${roleDraft[r.id] ?? minCount}" />`;
      }
      return `
        <div class="role-row">
          <div>
            <div class="role-title"><span class="badge ${r.team}">${roleEmoji(r)}</span><strong>${r.name}</strong></div>
            <div class="muted">${r.description}</div>
          </div>
          ${control}
        </div>
      `;
    }).join('');

    app.innerHTML = `
      <div class="card">
        <h2>Játékosok (${state.players.length})</h2>
        <div class="row">
          <input type="text" id="new-player-name" placeholder="Játékos neve" />
          <button class="primary" data-action="add-player">Hozzáadás</button>
        </div>
        <ul class="player-list">${playersHtml}</ul>
      </div>

      <div class="card">
        <h2>Játékbeállítások</h2>
        <div class="role-row">
          <div>
            <strong>Gyilkosságok száma éjszakánként</strong>
            <div class="muted">Hány embert ölnek meg együtt a gyilkosok minden éjjel.</div>
          </div>
          <input type="number" min="1" id="kills-per-night" value="${state.killsPerNight}" />
        </div>
        <div class="role-row">
          <div>
            <strong>Nappali szakasz hossza (perc)</strong>
            <div class="muted">A diszkusszió-időzítő hossza a nappali fázisban.</div>
          </div>
          <input type="number" min="1" id="day-timer-minutes" value="${state.dayTimerMinutes}" />
        </div>
      </div>

      <div class="card">
        <div class="card-header-row">
          <h2>Szerepek beállítása</h2>
          <span class="role-count-badge" id="role-count-badge">0/0</span>
        </div>
        <p class="muted">Add meg, hány darab legyen az egyes szerepekből. A maradék játékos automatikusan Polgár lesz.</p>
        ${selectAllHtml}
        ${rolesHtml}
        <div id="role-capacity-warning"></div>
        <footer class="actions">
          <button id="auto-assign-btn" data-action="auto-assign-roles" ${state.players.length < 3 ? 'disabled' : ''}>Automatikus sorsolás</button>
          <button class="primary" id="assign-roles-btn" data-action="assign-roles" ${state.players.length < 3 ? 'disabled' : ''}>Szerepek kiosztása</button>
        </footer>
      </div>

    `;

    document.getElementById('new-player-name').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doAddPlayer();
    });

    // 'change' (fires on blur/enter), not 'input' - Game.set*() re-renders the
    // whole screen synchronously via save(), which would otherwise steal focus
    // out of the field on every keystroke.
    document.getElementById('kills-per-night').addEventListener('change', (e) => {
      killsPerNightAutoSet = false;
      Game.setKillsPerNight(e.target.value);
    });
    document.getElementById('day-timer-minutes').addEventListener('change', (e) => {
      Game.setDayTimerMinutes(e.target.value);
    });

    // Keep linked-count displays (e.g. Kőműves = number of Gyilkos) in sync as the
    // narrator types into the role they mirror.
    ROLES.filter((r) => r.linkedCountRoleId).forEach((r) => {
      const sourceInput = document.getElementById(`count-${r.linkedCountRoleId}`);
      const display = document.getElementById(`count-${r.id}-display`);
      if (!sourceInput || !display) return;
      const sync = () => { display.textContent = parseInt(sourceInput.value, 10) || 0; };
      sync();
      sourceInput.addEventListener('input', sync);
    });

    const gyilkosInput = document.getElementById('count-gyilkos');
    if (gyilkosInput) {
      gyilkosInput.addEventListener('input', () => {
        gyilkosAutoSet = false;
        roleDraft.gyilkos = parseInt(gyilkosInput.value, 10) || 0;
        updateRoleAvailability();
      });
    }
    updateRoleAvailability();
  }

  // Reads the role-count controls straight out of the DOM - shared by the manual
  // ("Szerepek kiosztása") and automatic ("Automatikus sorsolás") assignment buttons.
  function collectRoleCounts() {
    const counts = {};
    ROLES.filter((r) => r.id !== 'polgar').forEach((r) => {
      let val;
      if (r.alwaysActive) {
        val = 1;
      } else if (r.linkedCountRoleId) {
        const sourceInput = document.getElementById(`count-${r.linkedCountRoleId}`);
        const sourceCount = sourceInput ? (parseInt(sourceInput.value, 10) || 0) : 0;
        if (r.maxCount === 1) {
          const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
          val = (toggle && toggle.getAttribute('aria-pressed') === 'true') ? sourceCount : 0;
        } else {
          val = sourceCount;
        }
      } else if (r.maxCount === 1) {
        const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
        val = toggle && toggle.getAttribute('aria-pressed') === 'true' ? 1 : 0;
      } else {
        val = parseInt(document.getElementById(`count-${r.id}`).value, 10) || 0;
      }
      if (val > 0) counts[r.id] = val;
    });
    return counts;
  }

  // Once the players' slots are full (always-active roles + gyilkos count + every
  // ON toggle's headcount), disable any still-OFF toggle that would overflow them -
  // it stays locked until a slot frees up (a toggle turns off, gyilkos count drops,
  // or more players are added).
  function updateRoleAvailability() {
    const state = Game.getState();
    const totalPlayers = state.players.length;

    const gyilkosInput = document.getElementById('count-gyilkos');
    const gyilkosCount = gyilkosInput ? (parseInt(gyilkosInput.value, 10) || 0) : 0;

    const alwaysActiveCount = ROLES.filter((r) => r.alwaysActive).length;
    const toggleRoles = ROLES.filter((r) => r.maxCount === 1 && !r.alwaysActive);

    let used = alwaysActiveCount + gyilkosCount;
    toggleRoles.forEach((r) => {
      const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
      if (toggle && toggle.getAttribute('aria-pressed') === 'true') {
        used += r.linkedCountRoleId ? gyilkosCount : 1;
      }
    });

    const remaining = totalPlayers - used;

    // "hány szerep hány játékosból" jelző a kártya fejlécében - pirosra vált, ha
    // több szerep van kiválasztva, mint ahány játékos van.
    const countBadge = document.getElementById('role-count-badge');
    if (countBadge) {
      countBadge.textContent = `${used}/${totalPlayers}`;
      countBadge.classList.toggle('over', used > totalPlayers);
    }

    toggleRoles.forEach((r) => {
      const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
      if (!toggle) return;
      if (toggle.getAttribute('aria-pressed') === 'true') {
        toggle.disabled = false;
        return;
      }
      const cost = r.linkedCountRoleId ? gyilkosCount : 1;
      toggle.disabled = cost > remaining;
    });

    if (gyilkosInput) {
      const usedWithoutGyilkos = used - gyilkosCount;
      gyilkosInput.max = String(Math.max(0, totalPlayers - usedWithoutGyilkos));
    }

    // Already over capacity (e.g. a player was removed after roles were configured,
    // or the gyilkos count was typed in directly) - warn and block assignment.
    const overflow = -remaining;

    // Roles with a minimum (e.g. at least 1 gyilkos) that isn't currently met. Only
    // plain number-input roles can have minCount, and gyilkos is the only one so far.
    const unmetMinimums = ROLES.filter((r) => typeof r.minCount === 'number' && gyilkosCount < r.minCount);

    const warningEl = document.getElementById('role-capacity-warning');
    if (warningEl) {
      const messages = [];
      if (overflow > 0) {
        messages.push(`Több szerep van kiválasztva, mint ahány játékos van (${overflow} hellyel túl sok). Csökkents valamit, vagy adj hozzá több játékost.`);
      }
      unmetMinimums.forEach((r) => {
        messages.push(`Legalább ${r.minCount} ${r.name} kell.`);
      });
      warningEl.innerHTML = messages.map((msg) => `<div class="banner warn">${msg}</div>`).join('');
    }

    const blocked = totalPlayers < 3 || overflow > 0 || unmetMinimums.length > 0;
    const assignBtn = document.getElementById('assign-roles-btn');
    if (assignBtn) assignBtn.disabled = blocked;
    const autoAssignBtn = document.getElementById('auto-assign-btn');
    if (autoAssignBtn) autoAssignBtn.disabled = blocked;
  }

  function doAddPlayer() {
    const input = document.getElementById('new-player-name');
    // Only worth recomputing if the add will actually go through - Game.addPlayer()
    // itself no-ops on a blank name, so applying the "count+1" default here for a
    // no-op would leave a stale suggestion nothing ever renders to correct.
    if (input.value.trim()) {
      applyAutoDefaults(Game.getState().players.length + 1);
    }
    Game.addPlayer(input.value);
    // Game.addPlayer() re-renders the setup screen synchronously, which replaces
    // this input with a fresh (empty) one - re-query it so focus lands on the new one.
    const freshInput = document.getElementById('new-player-name');
    if (freshInput) freshInput.focus();
  }

  // ---- Role assignment screen ("0. éjszaka") ----
  // One distinct role at a time, same look as the real night screen (renderNight).
  // Everyone stays visible on the board throughout: already-assigned players show
  // their role emoji and are locked. For roles with more than one slot (e.g. 2
  // gyilkos), pick all of them on this one screen - tap to select/deselect; once
  // full, tapping a new person bumps the oldest pick (see the click handler).
  // "Következő" confirms once the count matches; "Vissza" undoes the previous
  // role's confirmation so it can be redone.

  let assignSelectedIds = [];
  let swapSelectedIds = []; // 0-2 ids: first tap on the "Szerepek kiosztva" board, until a
                             // second tap swaps roles - both stay highlighted afterward as
                             // feedback for which two rows just traded, until the next tap

  function renderAssign(state) {
    const role = Game.currentAssignmentRole();
    const canGoBack = state.assignmentHistory.length > 0;

    if (!role) {
      // Queue empty - everyone has a role. Stay right here instead of dropping back
      // to the top of the SETUP screen; offer to start, or step back to fix a pick.
      // Tap-to-swap is only offered after an automatic (random) draw, which has no
      // per-role "Vissza" history to fix a mistake with - manual assignment already
      // has that (see canGoBack), and its roles get announced one by one as they're
      // handed out, so quietly swapping them afterward would be misleading.
      const swappable = !state.assignmentWasManual;
      // While a first pick is active, anyone else with that SAME role isn't
      // offered as a second pick at all - swapping two players who already have
      // the same role wouldn't change anything.
      const firstPick = swapSelectedIds.length === 1
        ? state.players.find((pl) => pl.id === swapSelectedIds[0])
        : null;
      const rows = [...state.players].sort((a, b) => roleSortIndex(a.roleId) - roleSortIndex(b.roleId)).map((p) => {
        const pRole = Game.getRole(p.roleId);
        const isSelected = swappable && swapSelectedIds.includes(p.id);
        const blocked = !!firstPick && p.id !== firstPick.id && p.roleId === firstPick.roleId;
        const clickable = swappable && !blocked;
        const cls = swappable ? `swap-row${isSelected ? ' selected' : ''}${blocked ? ' swap-row-blocked' : ''}` : '';
        const attrs = clickable ? `data-action="select-swap" data-id="${p.id}"` : '';
        return `<li class="${cls}" ${attrs}><span class="badge ${pRole.team}">${roleEmoji(pRole)}${pRole.name}</span><span>${escapeHtml(p.name)}</span></li>`;
      }).join('');
      app.innerHTML = `
        <div class="card">
          <div class="card-header-row">
            <h2>Szerepek kiosztva</h2>
            <button data-action="cancel-assignment">Mégse</button>
          </div>
          ${swappable ? '<p class="muted">Koppints két játékosra, hogy kicseréld a szerepüket.</p>' : ''}
          <ul class="player-list">${rows}</ul>
          <footer class="actions">
            ${canGoBack ? '<button data-action="assign-back">Vissza</button>' : ''}
            <button class="primary" data-action="start-game">Játék indítása</button>
          </footer>
        </div>
      `;
      return;
    }

    const capacity = state.assignmentTotalCounts[role.id] || 1;
    const promptText = capacity > 1
      ? `Válassz ki ${capacity} embert, akik ${role.name} lesznek! (${assignSelectedIds.length}/${capacity} kiválasztva)`
      : `Ki legyen a(z) ${role.name}?`;

    const board = state.players.map((p) => {
      if (p.roleId) {
        return `<button class="assignee-card assigned" disabled><span class="tile-name-line">${playerLabel(p)}</span></button>`;
      }
      const isSelected = assignSelectedIds.includes(p.id);
      const label = isSelected ? `${roleEmoji(role)}${escapeHtml(p.name)}` : escapeHtml(p.name);
      return `<button class="assignee-card${isSelected ? ' selected' : ''}" data-action="toggle-assignee" data-id="${p.id}"><span class="tile-name-line">${label}</span></button>`;
    }).join('');

    app.innerHTML = `
      <div class="card">
        <div class="card-header-row">
          <div class="night-role-header">
            ${roleEmoji(role, 'role-emoji-lg')}
            <h2>${role.name}</h2>
          </div>
          <button data-action="cancel-assignment">Mégse</button>
        </div>
        <p class="prompt">${promptText}</p>
        <div class="target-grid">${board}</div>
        <footer class="actions">
          ${canGoBack ? '<button data-action="assign-back">Vissza</button>' : ''}
          <button class="primary" data-action="confirm-assignment" ${assignSelectedIds.length === capacity ? '' : 'disabled'}>Következő</button>
        </footer>
      </div>
    `;
  }

  // ---- Night screen ----

  let investigatePendingTargetId = null; // Rendőr's target, confirmed, waiting for the result to be acknowledged
  let linkSelectedIds = []; // Cupido's picks this night - up to 2, toggled on/off
  let killSelectedIds = []; // Gyilkos's picks this night - up to state.killsPerNight, toggled on/off
  let nightSelectedId = null; // single-target night action pick, until confirmed
  let maimPendingTargetId = null; // Csonkoló's target, confirmed, waiting for a body-part pick
  let maimSelectedPart = null; // 'kez' | 'nyelv' picked in the popup, until confirmed
  let lastNightRoleShown = null; // roleId renderNight() last drew a board for - see syncNightSelectionFromState()

  // state.nightActions is the only source of truth for what's been picked, and
  // it's order-independent (see game.js's nightCursor/nightActions) - navigating
  // to a role (forward, back, or jumping straight to it) never changes it, so
  // this just re-derives the local selection vars from whatever's already there
  // for that role every time renderNight() notices it's showing a DIFFERENT role
  // than last time (see the lastNightRoleShown check in renderNight()). A fresh,
  // never-decided role naturally comes back empty; a revisited one comes back
  // showing the same pick as before, ready to keep as-is or change - no separate
  // undo/redo bookkeeping needed anywhere else. The maim/investigate popups are
  // deliberately left closed even when a maim/investigate role is restored - only
  // the target itself comes back pre-selected (with its usual preview marker on
  // the board), so tapping a different player is still one tap away instead of
  // having to back out of a reopened popup first. The Csonkoló's body-part pick
  // still comes back too (maimSelectedPart), just not shown until "Következő" is
  // pressed again - at that point the popup opens straight to the previous choice.
  function syncNightSelectionFromState(state, role) {
    nightSelectedId = null;
    investigatePendingTargetId = null;
    maimPendingTargetId = null;
    maimSelectedPart = null;
    linkSelectedIds = [];
    killSelectedIds = [];
    const recordedAction = state.nightActions[role.id];
    if (!recordedAction) return;
    if (role.nightAction === 'kill') {
      killSelectedIds = [...(recordedAction.targetIds || [])];
    } else if (role.nightAction === 'link') {
      linkSelectedIds = [...(recordedAction.pairIds || [])];
    } else if (role.nightAction === 'maim') {
      nightSelectedId = recordedAction.targetId || null;
      maimSelectedPart = recordedAction.bodyPart || null;
    } else {
      // protect / gift / abduct / investigate - single target
      nightSelectedId = recordedAction.targetId || null;
    }
  }

  // Wraps a board (a target grid or a plain roster list) with a popup layered on top
  // of it - same look everywhere a turn needs to pause the narrator on something
  // (investigate's result, the Csonkoló's body-part pick, or a role nobody can act
  // out) instead of swapping to a separate screen. The board underneath keeps its
  // shape; the popup just covers it until dismissed/confirmed. dismissAction, if
  // given, is put on the backdrop itself so tapping outside the box (or on its
  // padding) triggers that action - the Csonkoló's body-part popup uses this so
  // "clicking away" cancels back to target-picking instead of needing its own button;
  // Rendőr's result popup leaves this unset - it can only be advanced past via the
  // board's own "Következő" button, not dismissed by tapping away.
  function wrapWithPopup(contentHtml, popupHtml, dismissAction) {
    if (!popupHtml) return contentHtml;
