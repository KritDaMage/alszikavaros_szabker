      : '';

    const linkAction = state.nightActions['cupido'];
    const linkedPlayers = linkAction && linkAction.pairIds
      ? linkAction.pairIds.map((id) => state.players.find((p) => p.id === id)).filter(Boolean)
      : [];
    const cupidoBanner = linkedPlayers.length === 2
      ? `<div class="banner info">${roleActionEmoji('cupido')} A Cupido összekötötte: <strong>${linkedPlayers.map((p) => escapeHtml(p.name)).join(' és ')}</strong></div>`
      : '';

    // "Sikeres" csak akkor, ha (a) az UFO nem vitte el ugyanazt a célpontot (vagy
    // annak Cupido-párját) - ugyanaz a feltétel, mint ami az éjszakai
    // összefoglalóban elhalványítja az Orvos jelzését (lásd nightOutcomeByRole())
    // - ÉS (b) tényleg történt ellene kísérlet: a gyilkosok vagy a Csonkoló őt
    // (vagy a párját) célozták meg aznap éjjel. Enélkül a védés nem "mentett meg"
    // senkit, nincs mit bejelenteni.
    const healAction = state.nightActions['orvos'];
    const healPartnerId = healAction ? linkedPartnerId(state, healAction.targetId) : null;
    const healWasAbducted = !!healAction
      && (state.abductedIds.includes(healAction.targetId) || (!!healPartnerId && state.abductedIds.includes(healPartnerId)));
    const killAction = state.nightActions['gyilkos'];
    const maimAction = state.nightActions['csonkolo'];
    const healWasAttacked = !!healAction && (
      (!!killAction && !!killAction.targetIds
        && (killAction.targetIds.includes(healAction.targetId) || (!!healPartnerId && killAction.targetIds.includes(healPartnerId))))
      || (!!maimAction && (maimAction.targetId === healAction.targetId || (!!healPartnerId && maimAction.targetId === healPartnerId)))
    );
    const healTarget = healAction ? state.players.find((p) => p.id === healAction.targetId) : null;
    const healBanner = healAction && healTarget && !healWasAbducted && healWasAttacked
      ? `<div class="banner info">${roleActionEmoji('orvos')} Sikeres gyógyítás történt.</div>`
      : '';

    // Closed by default - the announcements above already cover the outcomes that
    // matter; this is just for whoever wants the full picture of who did what.
    // Same base row shape as the "Szerepek kiosztva" roster (role badge on the
    // left, sorted by role) - here the player's name joins the badge on the left
    // too, with what happened to them on the right instead of a second name.
    const nightSummaryRows = [...state.players]
      .sort((a, b) => roleSortIndex(a.roleId) - roleSortIndex(b.roleId))
      .map((p) => {
        const pRole = Game.getRole(p.roleId);
        const actions = nightOutcomeEmoji(state, p.id).trim();
        return `<li${p.alive ? '' : ' class="dead"'}><span class="row-left"><span class="badge ${pRole.team}">${roleEmoji(pRole)}${pRole.name}</span> ${escapeHtml(p.name)}</span><span class="row-right muted">${actions}</span></li>`;
      }).join('');
    const nightSummary = `
      <details class="night-summary">
        <summary>Éjszakai összefoglaló</summary>
        <ul class="player-list">${nightSummaryRows}</ul>
      </details>
    `;

    if (state.pendingHunterShot) {
      const shooter = state.players.find((p) => p.id === state.pendingHunterShot);
      const shotTargets = alive.map((p) => {
        const isSelected = p.id === daySelectedId;
        return `<button class="${isSelected ? 'selected' : ''}" data-action="select-day-target" data-id="${p.id}"><span class="tile-name-line">${playerLabel(p)}</span></button>`;
      }).join('');
      app.innerHTML = `
        <div class="card">
          <div class="banner warn"><strong>${escapeHtml(shooter ? shooter.name : 'A vadász')}</strong> (Vadász) utolsó tettként lelő valakit - válaszd ki, kit!</div>
          <div class="target-grid">${shotTargets}</div>
          <footer class="actions">
            <button class="primary" data-action="confirm-hunter-shot" ${daySelectedId ? '' : 'disabled'}>Következő</button>
          </footer>
        </div>
      `;
      return;
    }

    if (state.dayVoteResolved) {
      // Nappal csak 1 embert lehet kiszavazni - a döntés (kiszavazás vagy senki
      // sem) egyszer hozható meg naponta, utána a szavazás zárolva marad. Same
      // dimmed-board-plus-popup pattern as everywhere else a turn just needs to
      // pause the narrator on something (see wrapWithPopup()) instead of a plain
      // banner line - the board stays visible (disabled) under the popup.
      const lockedTargets = alive
        .map((p) => `<button disabled><span class="tile-name-line">${playerLabel(p)}</span></button>`)
        .join('');
      app.innerHTML = `
        <div class="card">
          ${deathBanner}
          ${revealBanner}
          ${abductBanner}
          ${cupidoBanner}
          ${healBanner}
          ${breadBanner}
          ${starvationBanner}
          ${maimBanner}
          ${nightSummary}
          <h2>Gyanúsítás</h2>
          ${wrapWithPopup(`<div class="target-grid">${lockedTargets}</div>`, `<div class="reason-line">A mai szavazás lezárult.</div>`)}
        </div>
        <footer class="actions">
          <button data-action="reopen-day-vote">Vissza</button>
          <button class="primary" data-action="next-round">Következő éjszaka</button>
        </footer>
      `;
      return;
    }

    const targets = alive.map((p) => {
      const isSelected = p.id === daySelectedId;
      return `<button class="${isSelected ? 'selected' : ''}" data-action="select-day-target" data-id="${p.id}"><span class="tile-name-line">${playerLabel(p)}</span></button>`;
    }).join('');

    app.innerHTML = `
      <div class="card">
        ${deathBanner}
        ${revealBanner}
        ${abductBanner}
        ${cupidoBanner}
        ${healBanner}
        ${breadBanner}
        ${starvationBanner}
        ${maimBanner}
        ${nightSummary}
        <h2>Gyanúsítás</h2>
        <div class="target-grid">${targets}</div>
        <footer class="actions">
          <button data-action="no-elimination">Senkit sem szavaznak ki</button>
          <button class="primary" data-action="confirm-eliminate" ${daySelectedId ? '' : 'disabled'}>Gyanúsítás megerősítése</button>
        </footer>
      </div>
      <footer class="actions">
        <button class="primary" data-action="next-round">Következő éjszaka</button>
      </footer>
    `;
  }

  // ---- End screen ----

  // Why the game ended - see game.js's deriveWinReason()/state.winReason.
  function winReasonText(state) {
    return {
      gyilkosok_elfogytak: 'Minden gyilkos meghalt.',
      gyilkosok_tobbsegben: 'A gyilkosok elérték vagy túllépték a többséget a túlélők között.',
      starvation: 'A város kenyér nélkül maradt, és éhínség lett úrrá rajta.',
      solo: 'Kiszavazásra került, és ezzel egyedül nyert.',
    }[state.winReason] || '';
  }

  function renderEnded(state) {
    let winnerText;
    if (state.winner === 'solo') {
      const soloWinner = state.players.find((p) => p.id === state.soloWinnerId);
      const soloRole = soloWinner ? Game.getRole(soloWinner.roleId) : null;
      winnerText = `<strong>${escapeHtml(soloWinner ? soloWinner.name : '?')}</strong>${soloRole ? ` (${soloRole.name})` : ''} nyert!`;
    } else {
      winnerText = `<strong>${teamLabel(state.winner)}</strong> győztek!`;
    }
    const reasonText = winReasonText(state);
    // Same base row layout as "Szerepek kiosztva" (role badge left, sorted by role).
    const rows = [...state.players]
      .sort((a, b) => roleSortIndex(a.roleId) - roleSortIndex(b.roleId))
      .map((p) => {
        const role = Game.getRole(p.roleId);
        return `<li class="${p.alive ? '' : 'dead'}"><span class="badge ${role.team}">${roleEmoji(role)}${role.name}</span><span>${escapeHtml(p.name)}</span></li>`;
      }).join('');

    app.innerHTML = `
      <div class="card">
        <div class="banner win">${winnerText}</div>
        ${reasonText ? `<div class="banner info">${reasonText}</div>` : ''}
        <h2>Végső szereposztás</h2>
        <ul class="player-list">${rows}</ul>
      </div>
      <footer class="actions">
        <button class="primary" data-action="reset-game">Új játék</button>
      </footer>
    `;
  }

  // ---- Main render + event handling ----

  let lastRenderedPhase = null; // only replay the slide-up entrance when the phase actually changes

  function render(state) {
    renderStatus(state);
    investigatePendingTargetId = state.phase === Game.PHASES.NIGHT ? investigatePendingTargetId : null;
    linkSelectedIds = state.phase === Game.PHASES.NIGHT ? linkSelectedIds : [];
    killSelectedIds = state.phase === Game.PHASES.NIGHT ? killSelectedIds : [];
    nightSelectedId = state.phase === Game.PHASES.NIGHT ? nightSelectedId : null;
    maimPendingTargetId = state.phase === Game.PHASES.NIGHT ? maimPendingTargetId : null;
    maimSelectedPart = state.phase === Game.PHASES.NIGHT ? maimSelectedPart : null;
    assignSelectedIds = state.phase === Game.PHASES.ASSIGN ? assignSelectedIds : [];
    swapSelectedId = state.phase === Game.PHASES.ASSIGN ? swapSelectedId : null;
    daySelectedId = state.phase === Game.PHASES.DAY ? daySelectedId : null;
    if (state.phase !== Game.PHASES.DAY) {
      stopDayTimerLoop();
      dayTimerEndAt = null;
      daySunEntered = false;
    }
    if (state.phase === Game.PHASES.HOME) renderHome(state);
    else if (state.phase === Game.PHASES.SETUP) renderSetup(state);
    else if (state.phase === Game.PHASES.ASSIGN) renderAssign(state);
    else if (state.phase === Game.PHASES.NIGHT) renderNight(state);
    else if (state.phase === Game.PHASES.DAY) renderDay(state);
    else if (state.phase === Game.PHASES.ENDED) renderEnded(state);
    renderModal();
    renderSkyWidget(state);

    if (state.phase !== lastRenderedPhase) {
      app.classList.remove('screen-enter');
      void app.offsetWidth; // force reflow so the animation restarts
      app.classList.add('screen-enter');
      lastRenderedPhase = state.phase;
    }
  }

  document.body.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-backdrop')) {
      rolesModalOpen = false;
      renderModal();
      return;
    }

    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const state = Game.getState();

    try {
      if (action === 'toggle-roles-modal') { rolesModalOpen = true; renderModal(); }
      else if (action === 'close-roles-modal') { rolesModalOpen = false; renderModal(); }
      else if (action === 'toggle-theme') {
        const next = currentTheme() === 'light' ? 'dark' : 'light';
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      }
      else if (action === 'start-day-timer') { startDayTimer(); renderSkyWidget(state); }
      else if (action === 'go-home') {
        if (state.phase === Game.PHASES.HOME) return;
        if (confirm('Biztosan befejezed a jelenlegi játékot és a kezdőlapra lépsz? A mentett állás elvész.')) {
          Game.resetGame();
        }
      }
      else if (action === 'go-setup') {
        roleDraft = { gyilkos: 1 };
        roleToggleDraft = {};
        Game.enterSetup();
      }
      else if (action === 'add-player') doAddPlayer();
      else if (action === 'remove-player') Game.removePlayer(btn.dataset.id);
      else if (action === 'toggle-role-single') {
        const nowOn = btn.getAttribute('aria-pressed') !== 'true';
        btn.setAttribute('aria-pressed', nowOn ? 'true' : 'false');
        roleToggleDraft[btn.dataset.roleId] = nowOn;
        updateRoleAvailability();
      }
      else if (action === 'toggle-all-roles') {
        const toggleableRoles = ROLES.filter((r) => r.maxCount === 1 && !r.alwaysActive);
        const allOn = toggleableRoles.length > 0 && toggleableRoles.every((r) => roleToggleDraft[r.id]);
        const newState = !allOn;
        toggleableRoles.forEach((r) => {
          roleToggleDraft[r.id] = newState;
          const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
          if (toggle) toggle.setAttribute('aria-pressed', newState ? 'true' : 'false');
        });
        btn.setAttribute('aria-pressed', newState ? 'true' : 'false');
        updateRoleAvailability();
      }
      else if (action === 'assign-roles') { swapSelectedId = null; Game.beginRoleAssignment(collectRoleCounts()); }
      else if (action === 'auto-assign-roles') { swapSelectedId = null; Game.autoAssignRoles(collectRoleCounts()); }
      else if (action === 'toggle-assignee') {
        const id = btn.dataset.id;
        const role = Game.currentAssignmentRole();
        const capacity = role ? (state.assignmentTotalCounts[role.id] || 1) : 1;
        const idx = assignSelectedIds.indexOf(id);
        if (idx >= 0) {
          assignSelectedIds.splice(idx, 1);
        } else {
          if (assignSelectedIds.length >= capacity) assignSelectedIds.shift(); // bump the oldest pick
          assignSelectedIds.push(id);
        }
        render(state);
      }
      else if (action === 'confirm-assignment') {
        Game.assignRoleToPlayers(assignSelectedIds);
        assignSelectedIds = [];
      }
      else if (action === 'assign-back') {
        assignSelectedIds = [];
        swapSelectedId = null;
        Game.stepBackAssignment();
      }
      else if (action === 'cancel-assignment') {
        assignSelectedIds = [];
        swapSelectedId = null;
        // Re-seed the setup screen's drafts from the counts that were actually in
        // use for this assignment (Game.cancelRoleAssignment() below wipes
        // state.assignmentTotalCounts) - otherwise Mégse would silently reset
        // "Szerepek beállítása" back to its defaults instead of showing what was
        // just configured. Matters most after a page reload mid-assignment, where
        // roleDraft/roleToggleDraft (plain JS variables, not persisted state) have
        // already reset to their defaults even though the game itself resumed.
        const counts = state.assignmentTotalCounts;
        roleDraft = { gyilkos: counts.gyilkos || 1 };
        roleToggleDraft = {};
        ROLES.forEach((r) => {
          if (r.maxCount === 1 && !r.alwaysActive) roleToggleDraft[r.id] = (counts[r.id] || 0) > 0;
        });
        Game.cancelRoleAssignment();
      }
      else if (action === 'select-swap') {
        const id = btn.dataset.id;
        if (swapSelectedId === null || swapSelectedId === id) {
          swapSelectedId = swapSelectedId === id ? null : id;
          render(state);
        } else {
          const firstId = swapSelectedId;
          // Clear the selection before swapping - Game.swapPlayerRoles() re-renders
          // synchronously via save(), so it must already be null by then or the
          // just-swapped player would still show as selected afterwards.
          swapSelectedId = null;
          Game.swapPlayerRoles(firstId, id);
        }
      }
      else if (action === 'start-game') Game.startGame();
      else if (action === 'select-night-target') { nightSelectedId = btn.dataset.id; render(state); }
      else if (action === 'confirm-night-target') {
        const role = Game.currentNightRole();
        const targetId = nightSelectedId;
        if (role.nightAction === 'investigate') {
          // Don't record/advance yet - just hold the target and show the result
          // popup on top of this same board; Game.recordNightAction() only runs once
          // its own "Következő" is pressed (see 'confirm-investigate' below). Keep
          // nightSelectedId set (instead of clearing it here) so the target tile
          // stays visibly selected, magnifying glass and all, while the result
          // popup sits on top of it - it was disappearing because this used to
          // clear it immediately, before the popup even opened.
          investigatePendingTargetId = targetId;
          render(state);
        } else {
          nightSelectedId = null;
          Game.recordNightAction(targetId);
        }
      }
      else if (action === 'confirm-investigate') {
        const targetId = investigatePendingTargetId;
        investigatePendingTargetId = null;
        nightSelectedId = null;
        Game.recordNightAction(targetId);
      }
      else if (action === 'confirm-maim-target') {
        // Same fix as investigate above - keep nightSelectedId set so the target
        // tile (and its 🪚 marker) stays visibly selected under the body-part popup.
        maimPendingTargetId = nightSelectedId;
        render(state);
      }
      else if (action === 'cancel-maim-target') { maimPendingTargetId = null; maimSelectedPart = null; render(state); }
      else if (action === 'select-maim-part') { maimSelectedPart = btn.dataset.part; render(state); }
      else if (action === 'confirm-maim-part') {
        const targetId = maimPendingTargetId;
        const part = maimSelectedPart;
        maimPendingTargetId = null;
        maimSelectedPart = null;
        nightSelectedId = null;
        Game.recordMaimAction(targetId, part);
      }
      else if (action === 'skip-night') {
        nightSelectedId = null;
        investigatePendingTargetId = null;
        maimPendingTargetId = null;
        maimSelectedPart = null;
        linkSelectedIds = [];
        Game.skipNightAction();
      }
      else if (action === 'night-back') {
        // Clear all in-progress night-screen selections before stepping back - it
        // re-renders synchronously via save(), so stale picks must already be gone.
        nightSelectedId = null;
        investigatePendingTargetId = null;
        maimPendingTargetId = null;
        maimSelectedPart = null;
        linkSelectedIds = [];
        Game.stepBackNightAction();
      }
      else if (action === 'toggle-link-target') {
        const id = btn.dataset.id;
        const idx = linkSelectedIds.indexOf(id);
        if (idx >= 0) {
          linkSelectedIds.splice(idx, 1);
        } else {
          if (linkSelectedIds.length >= 2) linkSelectedIds.shift(); // bump the oldest pick
          linkSelectedIds.push(id);
        }
        render(state);
      }
      else if (action === 'confirm-link') {
        const ids = linkSelectedIds;
        // Same ordering fix as confirm-night-target - clear before the synchronous
        // re-render inside recordLinkAction(), not after.
        linkSelectedIds = [];
        Game.recordLinkAction(ids[0], ids[1]);
      }
      else if (action === 'toggle-kill-target') {
        const id = btn.dataset.id;
        const capacity = Game.killCapacity();
        const idx = killSelectedIds.indexOf(id);
        if (idx >= 0) {
          killSelectedIds.splice(idx, 1);
        } else {
          if (killSelectedIds.length >= capacity) killSelectedIds.shift(); // bump the oldest pick
          killSelectedIds.push(id);
        }
        render(state);
      }
      else if (action === 'confirm-kill') {
        const ids = killSelectedIds;
        killSelectedIds = [];
        Game.recordKillAction(ids);
      }
      else if (action === 'select-day-target') { daySelectedId = btn.dataset.id; render(state); }
      else if (action === 'confirm-eliminate') {
        Game.eliminatePlayer(daySelectedId);
        daySelectedId = null;
      }
      else if (action === 'confirm-hunter-shot') {
        Game.resolveHunterShot(daySelectedId);
        daySelectedId = null;
      }
      else if (action === 'no-elimination') { daySelectedId = null; Game.noElimination(); }
      else if (action === 'reopen-day-vote') Game.reopenDayVote();
      else if (action === 'next-round') Game.nextRound();
      else if (action === 'reset-game') {
        if (confirm('Biztosan új játékot kezdesz? A jelenlegi állás elvész.')) Game.resetGame();
      }
    } catch (err) {
      alert(err.message);
    }
  });

  Game.init(render);
})();
</script>
