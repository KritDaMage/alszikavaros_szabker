<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alszik a város - Játékvezető</title>
<style>
  :root {
    --bg: #12141c;
    --panel: #1c1f2b;
    --panel-2: #262a3a;
    --border: #343a4d;
    --text: #eef0f6;
    --muted: #9aa0b4;
    --accent: #6c8cff;
    --accent-2: #8f6cff;
    --danger: #ff6c6c;
    --ok: #6cffab;
    --polgar: #6c8cff;
    --gyilkos: #ff6c6c;
    --semleges: #ffcf6c;
    font-size: 16px;
  }

  /* Light mode, toggled via the header's sun/moon button (see #theme-toggle) -
     dark stays the default (plain :root) so old saved preferences with no
     data-theme attribute yet still land on the original look. */
  html[data-theme="light"] {
    --bg: #f2f3f8;
    --panel: #ffffff;
    --panel-2: #eceef6;
    --border: #d6dae6;
    --text: #1c1e29;
    --muted: #656b82;
    --accent: #3b5bdb;
    --accent-2: #7048e8;
    --danger: #d6336c;
    --ok: #2f9e44;
    --polgar: #3b5bdb;
    --gyilkos: #d6336c;
    --semleges: #e8a33d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 3rem;
  }

  header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  header h1 {
    font-size: 1.1rem;
    margin: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.3rem 0.55rem;
    border-radius: 999px;
    background: var(--panel-2);
  }

  .theme-toggle .theme-emoji {
    font-size: 1rem;
    line-height: 1;
    opacity: 0.35;
    transform: scale(0.9);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .theme-toggle .theme-emoji.active {
    opacity: 1;
    transform: scale(1.1);
  }

  .header-title-button {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    font: inherit;
    padding: 0;
  }
  .header-title-button:hover {
    color: var(--accent);
  }
  .header-town-emoji {
    display: inline-block;
    font-size: 1.6em;
    line-height: 1;
  }

  header .status {
    color: var(--muted);
    font-size: 0.9rem;
  }

  header .header-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  /* Single shared centering point for both the sky widget and the board, so they
     can't independently drift out of alignment with each other - only one place
     computes "centered", not two copies of the same max-width/margin rule. */
  .app-column {
    max-width: 640px;
    margin: 0 auto;
  }

  main {
    padding: 1rem 1.25rem;
  }

  @keyframes screen-slide-up {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }

  main.screen-enter {
    animation: screen-slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @media (prefers-reduced-motion: reduce) {
    main.screen-enter {
      animation: none;
    }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .card h2 {
    margin: 0 0 0.75rem;
    font-size: 1rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  button {
    font: inherit;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1rem;
    cursor: pointer;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  button:hover { border-color: var(--accent); }

  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  button.danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
  }

  button.small {
    padding: 0.3rem 0.6rem;
    font-size: 0.85rem;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  input[type="text"], input[type="number"] {
    font: inherit;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 0.5rem 0.6rem;
  }

  .row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .player-list {
    list-style: none;
    margin: 0.75rem 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .player-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-2);
    padding: 0.5rem 0.7rem;
    border-radius: 8px;
  }

  .player-list li.dead {
    opacity: 0.45;
  }

  .row-left {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .row-right {
    flex-shrink: 0;
  }

  .player-list li.swap-row {
    cursor: pointer;
    border: 1px solid transparent;
  }
  .player-list li.swap-row.selected {
    border-color: var(--accent);
    background: rgba(108,140,255,0.18);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .badge.polgarok { background: rgba(108,140,255,0.15); color: var(--polgar); }
  .badge.gyilkosok { background: rgba(255,108,108,0.15); color: var(--gyilkos); }
  .badge.semleges { background: rgba(255,207,108,0.15); color: var(--semleges); }

  .role-emoji {
    display: inline-flex;
    flex-shrink: 0;
    font-size: 1.2rem;
    line-height: 1;
    margin-right: 0.35em;
  }

  .role-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.75rem;
    align-items: center;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
  }
  .role-row:last-child { border-bottom: none; }
  .role-row .role-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .role-row .muted {
    margin-top: 0.2rem;
    line-height: 1.4;
  }
  /* This badge wraps only the emoji (the role name sits outside it, in its own
     <strong>) - .role-emoji's margin-right (for when text follows in the same
     badge, like the post-assignment roster) has nothing to balance here, which
     pushed the emoji off-center inside the pill. */
  .role-row .role-title .badge .role-emoji {
    margin-right: 0;
  }

  .night-role-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .card-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .role-emoji-lg {
    font-size: 1.8rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--panel-2);
  }
  .role-row input { width: 4rem; }

  .linked-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.5rem;
    padding: 0.3rem 0.5rem;
    font-weight: 600;
    color: var(--muted);
  }

  .toggle-switch {
    position: relative;
    width: 44px;
    height: 24px;
    padding: 0;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .toggle-switch[aria-pressed="true"] {
    background: rgba(108,140,255,0.25);
    border-color: var(--accent);
  }
  .toggle-switch[aria-pressed="true"]::after {
    transform: translateX(20px);
    background: var(--accent);
  }

  .toggle-with-count {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
  }

  .target-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .target-grid button {
    padding: 0.9rem 0.5rem;
  }

  .target-grid button.selected {
    border-color: var(--accent);
    background: rgba(108,140,255,0.18);
  }

  .tile-name-line {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tile-emoji-line {
    display: block;
    /* Fixed height (not min-height) - emoji glyphs commonly render taller than
       plain text at the same font-size, so a min-height-only box was still growing
       (and dragging the whole grid row along with it) the moment one got added.
       Two lines' worth now, since several bond-transferred actions can stack up
       on one tile at once. overflow:visible (not hidden) - the fixed height still
       keeps every tile in a row the same height, but an emoji taller than that
       (or a third line, if one ever stacks up) is allowed to spill past this box's
       edge instead of being silently sliced off - better to poke out a little
       than to lose part of a glyph.
    */
    height: 2.9rem;
    line-height: 1.35rem;
    margin-top: 0.4rem;
    padding-top: 0.25rem;
    border-top: 1px solid var(--border);
    text-align: left;
    white-space: normal;
    overflow: visible;
    word-break: break-word;
  }

  .target-grid-wrap {
    position: relative;
  }
  .board-popup {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem;
    background: rgba(10,10,16,0.72);
    border-radius: 10px;
  }
  .board-popup-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    text-align: center;
    max-width: 90%;
  }
  .board-popup-box .reason-line {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
  }
  .board-popup-box .prompt {
    text-align: center;
  }
  .popup-choice-row {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 0.75rem;
  }
  .popup-choice-row button {
    padding: 0.75rem 1rem;
  }
  .popup-choice-row button.selected {
    border-color: var(--accent);
    background: rgba(108,140,255,0.18);
  }
  .assignee-card.assigned {
    opacity: 0.55;
    cursor: default;
  }

  .prompt {
    font-size: 1.1rem;
    margin-bottom: 0.25rem;
  }

  .muted { color: var(--muted); font-size: 0.9rem; }

  /* A kezdőlap szándékosan nincs .card-ba zárva - keret/panel nélkül,
     közvetlenül az oldal hátterén ül. */
  .home-card {
    text-align: center;
    padding: 2.5rem 1.5rem;
  }
  .home-title { font-size: 1.5rem; margin: 0 0 0.75rem; }
  .home-card .muted { max-width: 32rem; margin: 0 auto 1.5rem; }

  /* Idle nap/hold ciklus emojikkal a város fölött - lásd skyWidgetHtml(),
     újrafelhasználható máshol is (pl. a játék közbeni képernyőkön). */
  .sky-widget-emoji {
    /* Explicit width, not just max-width - .sky-arc-area's only children are
       absolutely positioned (the sun/moon), so it has no normal-flow content of
       its own to size itself by. As a flex item (see #sky-widget-root) that meant
       it collapsed to near-zero width instead of the intended 280px, decoupling
       the house's position from the coordinate space the sun/moon math assumes. */
    width: 280px;
    max-width: 100%;
    margin: 0 auto 1rem;
    /* .town-emoji has no centering of its own - on the home screen it only looks
       centered because it inherits text-align:center from .home-card. The in-game
       context has no such ancestor, so without this, the house glyph sits
       left-aligned inside this (correctly centered) box - that was the actual
       ~100px shift all along, not a box-positioning problem. */
    text-align: center;
    /* Positioning context for .sky-timer-overlay (the day countdown, sat above
       the house so the sun/moon passes behind the number, not behind the house). */
    position: relative;
  }
  .sky-arc-area {
    position: relative;
    height: 100px;
  }
  .sky-emoji {
    position: absolute;
    top: 0;
    left: 0;
    font-size: 2.4rem;
    line-height: 1;
    offset-path: path('M40,65 Q140,25 240,65');
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: 16s;
  }
  .sun-emoji { animation-name: sky-sun-arc; }
  .moon-emoji { animation-name: sky-moon-arc; }
  .town-emoji { font-size: 3.6rem; margin-top: -0.25rem; }

  /* The day discussion countdown, laid over the sky area above the house instead
     of sitting in its own row underneath the whole widget - the sun's arc (see
     .sky-emoji above, low points around y:70) runs right through this same spot,
     so it passes visibly behind the number instead of the two never overlapping. */
  .sky-timer-overlay {
    position: absolute;
    left: 50%;
    top: 85px;
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  @keyframes sky-sun-arc {
    0%   { offset-distance: 0%;   opacity: 0; }
    5%   { opacity: 1; }
    45%  { opacity: 1; }
    50%  { offset-distance: 100%; opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes sky-moon-arc {
    0%   { offset-distance: 0%;   opacity: 0; }
    50%  { offset-distance: 0%;   opacity: 0; }
    55%  { opacity: 1; }
    95%  { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sun-emoji, .moon-emoji {
      animation: none;
    }
    .sun-emoji { offset-distance: 35%; opacity: 1; }
    .moon-emoji { opacity: 0; }
  }

  /* Same sky widget, but driven from real game state instead of an idle CSS loop -
     see renderSkyWidget()/daySkyWidgetHtml()/nightSkyWidgetHtml(). Sits above the
     board (#sky-widget-root, before <main>) during the day/night phases: the sun
     glides across as the 7-minute discussion timer counts down, the moon steps
     forward each time a night action is confirmed/skipped. Reuses .sky-widget-emoji
     at its normal (home screen) size, unscaled - the offset-path's coordinates are
     an SVG path baked to that size, so shrinking the container without also
     rescaling the path just misaligns the emoji against it. */
  #sky-widget-root:empty { display: none; }
  /* Flex-centered rather than relying on the widget's own margin:auto - guarantees
     centering regardless of what .sky-widget-inline (below) does to that margin. */
  #sky-widget-root {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .sky-widget-inline {
    margin: 0.75rem 0 0;
  }
  .sky-emoji-manual {
    animation: none;
    /* Positioned via plain left/top (see skyArcPosition()), not offset-path - so
       this cancels the inherited path/anchor entirely rather than fighting it. */
    offset-path: none;
    transform: translate(-50%, -50%);
  }
  @keyframes sky-sun-reveal {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .sky-emoji-reveal {
    animation: sky-sun-reveal 0.8s ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .sky-emoji-reveal { animation: none; }
  }
  .sky-timer-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    margin: 0.4rem 0 0.25rem;
  }
  .sky-timer-text {
    font-variant-numeric: tabular-nums;
    font-size: 3.8rem;
    font-weight: 700;
    color: var(--text);
    /* Taller/narrower digits, closer to a digital-clock face than the default
       system sans - falls back to a plain condensed hint on the default font
       where "Arial Narrow" isn't installed. */
    font-family: 'Arial Narrow', 'Segoe UI Condensed', Arial, sans-serif;
    font-stretch: condensed;
    /* Stays readable when the sun/moon (see .sky-timer-overlay) passes directly
       behind the number. */
    text-shadow: 0 0 6px var(--bg), 0 0 12px var(--bg);
  }

  .banner {
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.75rem;
  }
  .banner.info { background: rgba(108,140,255,0.12); border: 1px solid var(--accent); }
  .banner.warn { background: rgba(255,108,108,0.12); border: 1px solid var(--danger); }
  .banner.win { background: rgba(108,255,171,0.12); border: 1px solid var(--ok); }

  /* Collapsible "what happened last night" recap on the day screen - closed by
     default, only for the narrator to check if they want to. */
  .night-summary {
    margin-bottom: 0.75rem;
  }
  .night-summary summary {
    cursor: pointer;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 0.9rem;
    list-style: none;
  }
  .night-summary summary::-webkit-details-marker { display: none; }
  .night-summary summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 0.4em;
    transition: transform 0.15s ease;
  }
  .night-summary[open] summary::before {
    transform: rotate(90deg);
  }
  .night-summary .player-list {
    margin-top: 0.5rem;
  }

  /* An attempted action that's already known not to take effect (protected,
     immune, abducted, or - for the Gyilkos - every Gyilkos got abducted before it
     landed) - see killIsVoided()/maimIsVoided() and voidedMarker(). Dimmed
     instead of hidden, so it's still clear something was tried, just
     distinguished from what actually stuck. */
  .outcome-voided {
    opacity: 0.35;
  }

  footer.actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    z-index: 100;
  }

  .modal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 1.1rem;
  }

  .roles-info-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .roles-info-list li:not(:last-child) {
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .roles-info-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }
</style>
<script>
  // Applied before <body> paints, straight from localStorage, so the page never
  // flashes dark-then-light on reload once someone's picked light mode.
  if (localStorage.getItem('alszik-a-varos-theme') === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
</head>
<body>

<header>
  <div class="header-left">
    <h1><button type="button" class="header-title-button" data-action="go-home"><span class="header-town-emoji">🏘️</span> Alszik a város</button></h1>
    <button type="button" class="theme-toggle" id="theme-toggle" data-action="toggle-theme" aria-label="Nappali/éjszakai megjelenés váltása">
      <span class="theme-emoji sun">☀️</span>
      <span class="theme-emoji moon">🌙</span>
    </button>
  </div>
  <div class="header-right">
    <button class="small" data-action="toggle-roles-modal">Szerepek leírása</button>
    <div class="status" id="status-line">Betöltés...</div>
  </div>
</header>

<div class="app-column">
  <div id="sky-widget-root"></div>
  <main id="app"></main>
</div>
<div id="modal-root"></div>

<script src="roles.js"></script>
<script src="game.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const statusLine = document.getElementById('status-line');
  const modalRoot = document.getElementById('modal-root');
  const skyWidgetRoot = document.getElementById('sky-widget-root');
  const themeToggleBtn = document.getElementById('theme-toggle');

  // Light/dark app theme (not the in-game day/night sky widget) - lives in its own
  // localStorage key rather than Game's state since it's a device preference, not
  // game data (resetGame()/a new game shouldn't touch it).
  const THEME_KEY = 'alszik-a-varos-theme';

  function currentTheme() {
    return localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark';
  }

  function applyTheme(theme) {
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
    if (themeToggleBtn) {
      themeToggleBtn.querySelector('.theme-emoji.sun').classList.toggle('active', theme === 'light');
      themeToggleBtn.querySelector('.theme-emoji.moon').classList.toggle('active', theme !== 'light');
    }
  }

  applyTheme(currentTheme());

  let rolesModalOpen = false;

  function renderModal() {
    if (!rolesModalOpen) {
      modalRoot.innerHTML = '';
      return;
    }
    const rows = ROLES.map((r) => `
      <li>
        <div class="roles-info-row">
          <span class="badge ${r.team}">${roleEmoji(r)}</span>
          <strong>${r.name}</strong>
        </div>
        <p class="muted">${r.description}</p>
      </li>
    `).join('');

    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-card">
          <div class="modal-header">
            <h2>Szerepek leírása</h2>
            <button class="small" data-action="close-roles-modal">✕</button>
          </div>
          <ul class="roles-info-list">${rows}</ul>
        </div>
      </div>
    `;
  }

  function teamLabel(team) {
    return { polgarok: 'Polgárok', gyilkosok: 'Gyilkosok', semleges: 'Semleges' }[team] || team;
  }

  function teamLabelSingular(team) {
    return { polgarok: 'Polgár', gyilkosok: 'Gyilkos', semleges: 'Semleges' }[team] || team;
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function renderStatus(state) {
    const phaseLabel = {
      home: 'Kezdőlap',
      setup: 'Előkészítés',
      night: 'Éjszaka',
      day: 'Nappal',
      ended: 'Vége',
    }[state.phase];
    statusLine.textContent = state.round > 0
      ? `${state.round}. kör - ${phaseLabel}`
      : phaseLabel;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Wraps a role's emoji (see roles.js) in a span for consistent sizing/spacing.
  // How this actually renders (art style, or a missing-glyph box) is entirely up to
  // the viewer's device/OS - see the note in the roles modal for why.
  function roleEmoji(role, extraClass = '') {
    if (!role || !role.emoji) return '';
    return `<span class="role-emoji${extraClass ? ' ' + extraClass : ''}">${role.emoji}</span>`;
  }

  // Label for a player button during the game (night targeting, day elimination) -
  // the narrator sees everyone's role anyway, so showing it speeds up target picking.
  function playerLabel(p) {
    return `${roleEmoji(Game.getRole(p.roleId))}${escapeHtml(p.name)}`;
  }

  // The other half of tonight's Cupido pair for playerId, or null.
  function linkedPartnerId(state, playerId) {
    const link = state.nightActions.cupido;
    if (!link || !link.pairIds) return null;
    const [a, b] = link.pairIds;
    if (a === playerId) return b;
    if (b === playerId) return a;
    return null;
  }

  // The acting role's own emoji (see roles.js) - reused as the "this happened"
  // marker everywhere instead of a separate, hand-picked symbol per action. One
  // consistent set of emoji (the roles') instead of two overlapping ones to keep
  // matched up.
  function roleActionEmoji(roleId) {
    const role = Game.getRole(roleId);
    return role && role.emoji ? role.emoji : '';
  }

  // Left-to-right order night-action markers appear in, matching the new nightOrder
  // (Gyilkos=1, UFO=2, Cupido=3, Orvos=4, Nyomozó=5, Csonkoló=6, Pék=7) - so a live
  // preview during selection always slots into the same spot it'll end up in once
  // actually confirmed, instead of always landing at the end regardless of which
  // role acts.
  const OUTCOME_ROLE_ORDER = ['ufo', 'cupido', 'katona-shield', 'pek', 'orvos', 'csonkolo', 'gyilkos', 'nyomozo'];

  // Wraps an outcome emoji that was attempted but is already known not to take
  // effect, so it renders dimmed instead of full-strength - see killIsVoided()/
  // maimIsVoided() below for what "already known" means.
  function voidedMarker(emoji) {
    return `<span class="outcome-voided">${emoji}</span>`;
  }

  // Whether tonight's Gyilkos kill on playerId is already known to not land -
  // mirrors resolveNight()'s per-target checks (game.js), but runs against
  // whatever's recorded SO FAR, so it's already accurate mid-night. Gyilkos wakes
  // first (see ROLE_ORDER in roles.js), so every later role already knows the
  // target - and since nothing can un-abduct/un-immunize/un-protect someone once
  // it's true, a true result here stays true.
  //
  // opts lets the role CURRENTLY deciding the thing that would void this kill
  // preview it BEFORE confirming, not just after (mirrors resolveNight()'s own
  // checks one step early):
  //   tentativePartnerId - Cupido's own screen, before "Összekötés": the other
  //     currently-tapped pick, since linkedPartnerId() only sees a confirmed bond.
  //   tentativeAbductedId - the UFO's own screen, before "Következő": whoever's
  //     currently tapped, since state.abductedIds only gets it once confirmed.
  //   tentativeProtectedId - Orvos's own screen, before "Következő": same idea.
  function killIsVoided(state, playerId, opts) {
    opts = opts || {};
    const na = state.nightActions;
    if (!na.gyilkos || !na.gyilkos.targetIds || !na.gyilkos.targetIds.includes(playerId)) return false;
    const livingGyilkosok = state.players.filter((p) => p.alive && p.roleId === 'gyilkos');
    if (livingGyilkosok.length > 0 && livingGyilkosok.every((p) => state.abductedIds.includes(p.id))) return true;
    const isAbducted = (id) => state.abductedIds.includes(id) || id === opts.tentativeAbductedId;
    if (isAbducted(playerId)) return true;
    const partnerId = opts.tentativePartnerId !== undefined ? opts.tentativePartnerId : linkedPartnerId(state, playerId);
    // Bonding to someone already (or about to be) abducted drags this player into
    // the same abduction (recordLinkAction()'s chain-drag).
    if (partnerId && isAbducted(partnerId)) return true;
    const targetPlayer = state.players.find((p) => p.id === playerId);
    const targetRole = targetPlayer ? Game.getRole(targetPlayer.roleId) : null;
    const partnerPlayer = partnerId ? state.players.find((p) => p.id === partnerId) : null;
    const partnerRole = partnerPlayer ? Game.getRole(partnerPlayer.roleId) : null;
    if ((targetRole && targetRole.immuneToKill) || (partnerRole && partnerRole.immuneToKill)) return true;
    const protectAction = na.orvos;
    const protectedId = opts.tentativeProtectedId !== undefined ? opts.tentativeProtectedId : (protectAction ? protectAction.targetId : null);
    if (protectedId !== null && protectedId !== undefined && (playerId === protectedId || partnerId === protectedId)) return true;
    return false;
  }

  // Same idea for the Csonkoló's maim - voided if the (original, pre-bond-drag)
  // target was abducted or protected, mirroring resolveNight()'s maimAction check.
  // Both the UFO and Orvos always act before Csonkoló (see ROLE_ORDER in
  // roles.js), so unlike killIsVoided() this never needs a *tentative* abduction/
  // protection - both are already confirmed fact by the time this runs.
  //
  // opts.tentativeTargetId: Csonkoló's own screen, before "Következő": the
  // currently-tapped candidate, since na.csonkolo doesn't exist yet at that
  // point - lets the target-picking preview (the plain 🪚 marker, before a body
  // part is even chosen) already show as voided instead of only after confirming.
  function maimIsVoided(state, playerId, opts) {
    opts = opts || {};
    const na = state.nightActions;
    const targetId = opts.tentativeTargetId !== undefined ? opts.tentativeTargetId : (na.csonkolo ? na.csonkolo.targetId : null);
    if (!targetId) return false;
    if (targetId !== playerId && linkedPartnerId(state, playerId) !== targetId) return false;
    if (state.abductedIds.includes(targetId)) return true;
    const protectAction = na.orvos;
    if (protectAction && (targetId === protectAction.targetId || linkedPartnerId(state, targetId) === protectAction.targetId)) return true;
    return false;
  }

  // Everything already confirmed for playerId tonight, keyed by role (see
  // OUTCOME_ROLE_ORDER) - the shared basis for both nightOutcomeEmoji() and the
  // live-preview version in nightTileLabel(). A Cupido pair shares fate: whatever
  // happens to one (kill, maim, protection, gift) shows on the other too, matching
  // resolveNight()'s bond logic - only investigation doesn't bond-transfer, since
  // it's pure information, not a lasting effect.
  //
  // opts: same shape as killIsVoided()'s - forwarded straight through so every
  // marker below (not just the kill/maim ones) already previews what confirming
  // the CURRENT role's pending pick would do: Cupido's bond (tentativePartnerId),
  // the UFO's abduction (tentativeAbductedId) or Orvos's protection
  // (tentativeProtectedId), each passed by that role's own screen in renderNight.
  function nightOutcomeByRole(state, playerId, opts) {
    opts = opts || {};
    const na = state.nightActions;
    const partnerId = opts.tentativePartnerId !== undefined ? opts.tentativePartnerId : linkedPartnerId(state, playerId);
    const partnerPlayer = partnerId ? state.players.find((pl) => pl.id === partnerId) : null;
    const partnerRole = partnerPlayer ? Game.getRole(partnerPlayer.roleId) : null;
    // Whatever's shown ON this tile only matters if this player is actually
    // reachable tonight - the UFO having taken (or about to take) them makes a
    // Katona-bond shield or an Orvos heal moot, the same way it voids a kill/maim
    // (see killIsVoided()). A bonded pair shares abduction too (chain-drag) -
    // checking the (possibly tentative) partner here previews that as well.
    const isAbducted = (id) => state.abductedIds.includes(id) || id === opts.tentativeAbductedId;
    const abducted = isAbducted(playerId) || (!!partnerId && isAbducted(partnerId));

    const gyilkosHit = !!(na.gyilkos && na.gyilkos.targetIds
      && (na.gyilkos.targetIds.includes(playerId) || na.gyilkos.targetIds.includes(partnerId)));
    const gyilkosTargetId = (na.gyilkos && na.gyilkos.targetIds && na.gyilkos.targetIds.includes(playerId)) ? playerId : partnerId;
    const gyilkosVoided = gyilkosHit && killIsVoided(state, gyilkosTargetId, {
      tentativePartnerId: gyilkosTargetId === playerId ? partnerId : playerId,
      tentativeAbductedId: opts.tentativeAbductedId,
      tentativeProtectedId: opts.tentativeProtectedId,
    });

    const csonkoloHit = !!(na.csonkolo && (na.csonkolo.targetId === playerId || na.csonkolo.targetId === partnerId));
    const csonkoloVoided = csonkoloHit && maimIsVoided(state, playerId);

    const katonaShieldHit = !!(partnerRole && partnerRole.immuneToKill);
    const orvosHit = !!(na.orvos && (na.orvos.targetId === playerId || na.orvos.targetId === partnerId));

    return {
      ufo: abducted ? roleActionEmoji('ufo') : '',
      cupido: na.cupido && na.cupido.pairIds && na.cupido.pairIds.includes(playerId) ? roleActionEmoji('cupido') : '',
      // Katona's immunity extends to whoever Cupido bonded them with tonight (see
      // resolveNight()'s roleImmune check) - shown right after the bond marker, on
      // the partner only (checking the PARTNER's role naturally excludes the Katona
      // themselves here).
      'katona-shield': katonaShieldHit ? (abducted ? voidedMarker(roleActionEmoji('katona')) : roleActionEmoji('katona')) : '',
      pek: na.pek && (na.pek.targetId === playerId || na.pek.targetId === partnerId) ? roleActionEmoji('pek') : '',
      orvos: orvosHit ? (abducted ? voidedMarker(roleActionEmoji('orvos')) : roleActionEmoji('orvos')) : '',
      // Gyilkos's kill and the Csonkoló's maim show what actually happened, not the
      // acting role's own emoji - a skull for a kill, specifically which body part
      // for a maim (same for the bonded partner too, since it's the same bodyPart).
      csonkolo: csonkoloHit
        ? (csonkoloVoided ? voidedMarker(na.csonkolo.bodyPart === 'kez' ? '✋' : '👅') : (na.csonkolo.bodyPart === 'kez' ? '✋' : '👅'))
        : '',
      // Gyilkos can pick more than one target a night (see state.killsPerNight),
      // stored as targetIds - true if this player (or their bonded partner) is any
      // one of them.
      gyilkos: gyilkosHit ? (gyilkosVoided ? voidedMarker('💀') : '💀') : '',
      nyomozo: na.nyomozo && na.nyomozo.targetId === playerId ? roleActionEmoji('nyomozo') : '',
    };
  }

  function nightOutcomeEmoji(state, playerId) {
    const byRole = nightOutcomeByRole(state, playerId);
    const parts = OUTCOME_ROLE_ORDER.map((r) => byRole[r]).filter(Boolean);
    return parts.length ? ` ${parts.join(' ')}` : '';
  }

  // Whether anyone can actually perform this role's action tonight - false once every
  // living holder is abducted (or the role's only holder(s) are dead). Drives the
  // "mock" turn in renderNight(): the role still gets called every night (see
  // beginNight() in game.js), but with nothing to click, just "Tovább".
  function roleHasActor(state, role) {
    return Game.alivePlayers().some((p) => p.roleId === role.id && !state.abductedIds.includes(p.id));
  }

  // previewEmoji: shown immediately while a candidate is merely selected/highlighted,
  // before the action is even confirmed - same as a role's emoji already showing up
  // next to a tapped-but-not-yet-confirmed candidate on the "Szerepek kiosztva" board.
  function nightPlayerLabel(state, p, previewEmoji = '') {
    const confirmed = nightOutcomeEmoji(state, p.id);
    const preview = previewEmoji ? ` ${previewEmoji}` : '';
    return `${playerLabel(p)}${confirmed}${preview}`;
  }

  // Same as nightPlayerLabel, but for grid tiles (target-grid/assignee-card buttons):
  // puts the outcome/preview emoji on its own (two-line-capable) block, in a slot
  // that's always reserved (see .tile-emoji-line), so every tile in the row stays
  // the same size whether or not it actually has anything to show there. The name
  // line is still clamped to one line (see the CSS) - a long name truncates instead
  // of wrapping, so it alone can't grow a tile taller than its neighbours.
  // previewRoleId, if given, slots previewEmoji into its correct spot in
  // OUTCOME_ROLE_ORDER instead of just appending it - so during selection, the
  // marker already sits exactly where it'll end up once actually confirmed. Left
  // out, the preview is just appended - fine there since nothing later in the
  // night could be confirmed yet at that point anyway.
  // tentativeOpts: forwarded straight to nightOutcomeByRole() - see there.
  function nightTileLabel(state, p, previewEmoji = '', previewRoleId = null, tentativeOpts) {
    const byRole = nightOutcomeByRole(state, p.id, tentativeOpts);
    if (previewEmoji && previewRoleId && previewRoleId in byRole) {
      byRole[previewRoleId] = previewEmoji;
    }
    const parts = OUTCOME_ROLE_ORDER.map((r) => byRole[r]).filter(Boolean);
    if (previewEmoji && !(previewRoleId && previewRoleId in byRole)) parts.push(previewEmoji);
    return `<span class="tile-name-line">${playerLabel(p)}</span><span class="tile-emoji-line">${parts.join(' ')}</span>`;
  }

  // Role display order for the post-assignment roster, the night summary and the
  // ended screen (all three share this via roleSortIndex - see the "same base
  // layout" request) - reuses roles.js's ROLE_ORDER directly (not a local copy)
  // since game.js's manual assignment queue (beginRoleAssignment) now asks for
  // roles in this exact same order too - one shared list, so display and
  // assignment order can't drift apart.
  const ROLE_SORT_ORDER = ROLE_ORDER;
  function roleSortIndex(roleId) {
    const idx = ROLE_SORT_ORDER.indexOf(roleId);
    return idx === -1 ? ROLE_SORT_ORDER.length : idx;
  }

  // Fixed display order for the role-count/toggle list on the setup screen -
  // separate from ROLE_SORT_ORDER (the post-assignment roster/night summary/ended
  // screen's shared order) since this one's just a narrator-chosen reading order,
  // any role missing from it (e.g. a future addition) just falls at the end.
  const SETUP_ROLE_ORDER = ['gyilkos', 'nyomozo', 'orvos', 'ufo', 'cupido', 'csonkolo', 'komuves', 'gyarimunkas', 'vadasz', 'katona', 'pek', 'fuszeres', 'polgarmester'];
  function setupRoleSortIndex(roleId) {
    const idx = SETUP_ROLE_ORDER.indexOf(roleId);
    return idx === -1 ? SETUP_ROLE_ORDER.length : idx;
  }

  // House-in-a-sky-arc widget (see .sky-widget-emoji) - the one shared building
  // block behind both the home screen's idle nap/hold loop and the state-driven
  // in-game version below, so they can't visually drift apart. arcHtml is whatever
  // goes inside .sky-arc-area (the sun/moon span(s)); extraClass lets a caller add
  // its own modifier without duplicating the house/arc structure itself. overlayHtml
  // (see .sky-timer-overlay) sits on top of the house instead of below the whole
  // widget - aria-hidden lives on the two decorative pieces individually now
  // instead of the outer wrapper, so overlayHtml (real info, not decoration) stays
  // reachable by assistive tech.
  function skyWidgetHtml(arcHtml, extraClass = '', overlayHtml = '') {
    return `
      <div class="sky-widget-emoji${extraClass ? ' ' + extraClass : ''}">
        <div class="sky-arc-area" aria-hidden="true">${arcHtml}</div>
        <div class="town-emoji" aria-hidden="true">🏘️</div>
        ${overlayHtml}
      </div>
    `;
  }

  // Same arc as the home screen's sky-sun-arc/sky-moon-arc keyframes (same
  // quadratic-curve control points as the .sky-emoji offset-path above: left end,
  // top of arc, right end), but computed here as plain left/top pixels instead of
  // an offset-path percentage - avoids relying on the browser's arc-length
  // interpretation of that path, which didn't land where the control points
  // themselves said it should. fraction 0-1 drives it directly, full opacity, no
  // transition (so it snaps to position instead of visibly gliding on a restart).
  function skyArcPosition(fraction) {
    const t = Math.max(0, Math.min(1, fraction));
    const p0 = { x: 40, y: 65 };
    const p1 = { x: 140, y: 25 };
    const p2 = { x: 240, y: 65 };
    const x = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x;
    const y = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y;
    return `left:${x.toFixed(1)}px; top:${y.toFixed(1)}px;`;
  }

  // ---- In-game sky widget (above the board during day/night) ----

  // state.dayTimerMinutes is set on the setup screen (default 7) - read fresh each
  // time rather than cached, since it's fixed for the game but this module loads
  // before any game state exists.
  function dayTimerMs() {
    return (Game.getState().dayTimerMinutes || 7) * 60 * 1000;
  }
  let dayTimerEndAt = null; // epoch ms the discussion timer ends at, or null if not running
  let dayTimerRafId = null; // requestAnimationFrame id, so it can be cancelled on restart/leaving the day
  let daySunEntered = false; // whether the sunrise-in reveal has already played this day

  function formatCountdown(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function stopDayTimerLoop() {
    if (dayTimerRafId) {
      cancelAnimationFrame(dayTimerRafId);
      dayTimerRafId = null;
    }
  }

  function startDayTimer() {
    dayTimerEndAt = Date.now() + dayTimerMs();
    stopDayTimerLoop();
    // requestAnimationFrame instead of a once-a-second interval - the position is
    // recomputed fresh from the actual elapsed time on every frame, so it reads as
    // continuous motion instead of ticking forward once a second.
    const tick = () => {
      renderSkyWidget(Game.getState());
      if (Date.now() < dayTimerEndAt) {
        dayTimerRafId = requestAnimationFrame(tick);
      } else {
        dayTimerRafId = null;
      }
    };
    dayTimerRafId = requestAnimationFrame(tick);
  }

  function daySkyWidgetHtml() {
    const running = dayTimerEndAt !== null;
    const totalMs = dayTimerMs();
    const remainingMs = running ? Math.max(0, dayTimerEndAt - Date.now()) : totalMs;
    const fraction = running ? (totalMs - remainingMs) / totalMs : 0;
    // Before the timer starts, the sun still rests at the arc's start position
    // (fraction 0) - ready for where the timer will pick it up - rather than being
    // hidden entirely. It only plays its rise-in reveal once per day, the first
    // time this screen is shown (see daySunEntered), not on every re-render caused
    // by unrelated clicks (e.g. picking a vote target) before Start is pressed.
    const revealClass = !running && !daySunEntered ? ' sky-emoji-reveal' : '';
    if (!running) daySunEntered = true;
    const arcHtml = `<span class="sky-emoji sky-emoji-manual${revealClass}" style="${skyArcPosition(fraction)}">☀️</span>`;
    // No restart option once it's running - it's a one-shot "start the discussion"
    // button, not a resettable stopwatch. Once running, the countdown itself sits
    // laid over the house (see .sky-timer-overlay) instead of below the whole
    // widget - the Start button stays a normal button underneath, since there's
    // nothing to lay it over yet.
    const timerOverlay = running
      ? `<span class="sky-timer-text sky-timer-overlay">${remainingMs > 0 ? formatCountdown(remainingMs) : 'Lejárt'}</span>`
      : '';
    return `
      ${skyWidgetHtml(arcHtml, 'sky-widget-inline', timerOverlay)}
      ${running ? '' : `<div class="sky-timer-col"><button class="small" data-action="start-day-timer">Start</button></div>`}
    `;
  }

  // Steps forward each time a night action gets confirmed/skipped (nightActionHistory
  // grows, nightQueue shrinks by the same amount) - not a timer, since the narrator
  // sets the pace here, not a clock.
  function nightSkyWidgetHtml(state) {
    const total = state.nightActionHistory.length + state.nightQueue.length;
    const fraction = total > 0 ? state.nightActionHistory.length / total : 0;
    const arcHtml = `<span class="sky-emoji sky-emoji-manual" style="${skyArcPosition(fraction)}">🌙</span>`;
    return skyWidgetHtml(arcHtml, 'sky-widget-inline');
  }

  function renderSkyWidget(state) {
    if (state.phase === Game.PHASES.DAY) {
      skyWidgetRoot.innerHTML = daySkyWidgetHtml();
    } else if (state.phase === Game.PHASES.NIGHT) {
      skyWidgetRoot.innerHTML = nightSkyWidgetHtml(state);
    } else {
      skyWidgetRoot.innerHTML = '';
    }
  }

  // ---- Home screen ----

  function renderHome(state) {
    app.innerHTML = `
      <div class="home-card">
        ${skyWidgetHtml('<span class="sky-emoji sun-emoji">☀️</span><span class="sky-emoji moon-emoji">🌙</span>')}
        <h2 class="home-title">Alszik a város</h2>
        <p class="muted">Játékvezetői segédlet: végigvezet az éjszakai és nappali fázisokon, kiosztja a szerepeket, és nyomon követi az eseményeket.</p>
        <button class="primary" data-action="go-setup">Új játék indítása</button>
      </div>
    `;
  }

  // ---- Setup screen ----

  // Role counts/toggles are plain DOM state, but renderSetup() rebuilds the whole
  // screen from scratch on every add/remove-player - without this draft, that would
  // wipe out whatever the narrator had already configured. Reset on fresh entry to
  // setup (see the 'go-setup' action), not on every re-render within it.
  let roleDraft = { gyilkos: 1 }; // roleId -> number, for plain number inputs (gyilkos)
  let roleToggleDraft = {}; // roleId -> boolean, for every toggle switch

  function renderSetup(state) {
    const playersHtml = state.players.map((p) => `
      <li>
        <span>${escapeHtml(p.name)}</span>
        <button class="small danger" data-action="remove-player" data-id="${p.id}">✕</button>
      </li>
    `).join('');

    // "Összes bekapcsolása" master toggle - flips every toggleable role (everything
    // with its own on/off switch, i.e. maxCount:1 and not alwaysActive) at once.
    const toggleableRoles = ROLES.filter((r) => r.maxCount === 1 && !r.alwaysActive);
    const allRolesOn = toggleableRoles.length > 0 && toggleableRoles.every((r) => roleToggleDraft[r.id]);
    const selectAllHtml = `
      <div class="role-row">
        <div><strong>Összes bekapcsolása</strong></div>
        <button type="button" class="toggle-switch" data-action="toggle-all-roles" aria-pressed="${allRolesOn ? 'true' : 'false'}"></button>
      </div>
    `;

    const rolesHtml = [...ROLES]
      .filter((r) => r.id !== 'polgar')
      .sort((a, b) => setupRoleSortIndex(a.id) - setupRoleSortIndex(b.id))
      .map((r) => {
      let control;
      if (r.alwaysActive) {
        control = '';
      } else if (r.linkedCountRoleId && r.maxCount === 1) {
        const pressed = roleToggleDraft[r.id] ? 'true' : 'false';
        control = `
          <div class="toggle-with-count">
            <button type="button" class="toggle-switch" data-action="toggle-role-single" data-role-id="${r.id}" aria-pressed="${pressed}"></button>
            <span class="linked-count" id="count-${r.id}-display">0</span>
          </div>
        `;
      } else if (r.linkedCountRoleId) {
        control = `<span class="linked-count" id="count-${r.id}-display">0</span>`;
      } else if (r.maxCount === 1) {
        const pressed = roleToggleDraft[r.id] ? 'true' : 'false';
        control = `<button type="button" class="toggle-switch" data-action="toggle-role-single" data-role-id="${r.id}" aria-pressed="${pressed}"></button>`;
      } else {
        const minCount = r.minCount || 0;
        control = `<input type="number" min="${minCount}" id="count-${r.id}" value="${roleDraft[r.id] ?? minCount}" />`;
      }
      return `
        <div class="role-row">
          <div>
            <div class="role-title"><span class="badge ${r.team}">${roleEmoji(r)}</span><strong>${r.name}</strong></div>
            <div class="muted">${r.description}</div>
          </div>
          ${control}
        </div>
      `;
    }).join('');

    app.innerHTML = `
      <div class="card">
        <h2>Játékosok (${state.players.length})</h2>
        <div class="row">
          <input type="text" id="new-player-name" placeholder="Játékos neve" />
          <button class="primary" data-action="add-player">Hozzáadás</button>
        </div>
        <ul class="player-list">${playersHtml}</ul>
      </div>

      <div class="card">
        <h2>Játékbeállítások</h2>
        <div class="role-row">
          <div>
            <strong>Gyilkosságok száma éjszakánként</strong>
            <div class="muted">Hány embert ölnek meg együtt a gyilkosok minden éjjel.</div>
          </div>
          <input type="number" min="1" id="kills-per-night" value="${state.killsPerNight}" />
        </div>
        <div class="role-row">
          <div>
            <strong>Nappali szakasz hossza (perc)</strong>
            <div class="muted">A diszkusszió-időzítő hossza a nappali fázisban.</div>
          </div>
          <input type="number" min="1" id="day-timer-minutes" value="${state.dayTimerMinutes}" />
        </div>
      </div>

      <div class="card">
        <h2>Szerepek beállítása</h2>
        <p class="muted">Add meg, hány darab legyen az egyes szerepekből. A maradék játékos automatikusan Polgár lesz.</p>
        ${selectAllHtml}
        ${rolesHtml}
        <div id="role-capacity-warning"></div>
        <footer class="actions">
          <button id="auto-assign-btn" data-action="auto-assign-roles" ${state.players.length < 3 ? 'disabled' : ''}>Automatikus sorsolás</button>
          <button class="primary" id="assign-roles-btn" data-action="assign-roles" ${state.players.length < 3 ? 'disabled' : ''}>Szerepek kiosztása</button>
        </footer>
      </div>

    `;

    document.getElementById('new-player-name').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doAddPlayer();
    });

    // 'change' (fires on blur/enter), not 'input' - Game.set*() re-renders the
    // whole screen synchronously via save(), which would otherwise steal focus
    // out of the field on every keystroke.
    document.getElementById('kills-per-night').addEventListener('change', (e) => {
      Game.setKillsPerNight(e.target.value);
    });
    document.getElementById('day-timer-minutes').addEventListener('change', (e) => {
      Game.setDayTimerMinutes(e.target.value);
    });

    // Keep linked-count displays (e.g. Kőműves = number of Gyilkos) in sync as the
    // narrator types into the role they mirror.
    ROLES.filter((r) => r.linkedCountRoleId).forEach((r) => {
      const sourceInput = document.getElementById(`count-${r.linkedCountRoleId}`);
      const display = document.getElementById(`count-${r.id}-display`);
      if (!sourceInput || !display) return;
      const sync = () => { display.textContent = parseInt(sourceInput.value, 10) || 0; };
      sync();
      sourceInput.addEventListener('input', sync);
    });

    const gyilkosInput = document.getElementById('count-gyilkos');
    if (gyilkosInput) {
      gyilkosInput.addEventListener('input', () => {
        roleDraft.gyilkos = parseInt(gyilkosInput.value, 10) || 0;
        updateRoleAvailability();
      });
    }
    updateRoleAvailability();
  }

  // Reads the role-count controls straight out of the DOM - shared by the manual
  // ("Szerepek kiosztása") and automatic ("Automatikus sorsolás") assignment buttons.
  function collectRoleCounts() {
    const counts = {};
    ROLES.filter((r) => r.id !== 'polgar').forEach((r) => {
      let val;
      if (r.alwaysActive) {
        val = 1;
      } else if (r.linkedCountRoleId) {
        const sourceInput = document.getElementById(`count-${r.linkedCountRoleId}`);
        const sourceCount = sourceInput ? (parseInt(sourceInput.value, 10) || 0) : 0;
        if (r.maxCount === 1) {
          const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
          val = (toggle && toggle.getAttribute('aria-pressed') === 'true') ? sourceCount : 0;
        } else {
          val = sourceCount;
        }
      } else if (r.maxCount === 1) {
        const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
        val = toggle && toggle.getAttribute('aria-pressed') === 'true' ? 1 : 0;
      } else {
        val = parseInt(document.getElementById(`count-${r.id}`).value, 10) || 0;
      }
      if (val > 0) counts[r.id] = val;
    });
    return counts;
  }

  // Once the players' slots are full (always-active roles + gyilkos count + every
  // ON toggle's headcount), disable any still-OFF toggle that would overflow them -
  // it stays locked until a slot frees up (a toggle turns off, gyilkos count drops,
  // or more players are added).
  function updateRoleAvailability() {
    const state = Game.getState();
    const totalPlayers = state.players.length;

    const gyilkosInput = document.getElementById('count-gyilkos');
    const gyilkosCount = gyilkosInput ? (parseInt(gyilkosInput.value, 10) || 0) : 0;

    const alwaysActiveCount = ROLES.filter((r) => r.alwaysActive).length;
    const toggleRoles = ROLES.filter((r) => r.maxCount === 1 && !r.alwaysActive);

    let used = alwaysActiveCount + gyilkosCount;
    toggleRoles.forEach((r) => {
      const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
      if (toggle && toggle.getAttribute('aria-pressed') === 'true') {
        used += r.linkedCountRoleId ? gyilkosCount : 1;
      }
    });

    const remaining = totalPlayers - used;

    toggleRoles.forEach((r) => {
      const toggle = document.querySelector(`[data-action="toggle-role-single"][data-role-id="${r.id}"]`);
      if (!toggle) return;
      if (toggle.getAttribute('aria-pressed') === 'true') {
        toggle.disabled = false;
        return;
      }
      const cost = r.linkedCountRoleId ? gyilkosCount : 1;
      toggle.disabled = cost > remaining;
    });

    if (gyilkosInput) {
      const usedWithoutGyilkos = used - gyilkosCount;
      gyilkosInput.max = String(Math.max(0, totalPlayers - usedWithoutGyilkos));
    }

    // Already over capacity (e.g. a player was removed after roles were configured,
    // or the gyilkos count was typed in directly) - warn and block assignment.
    const overflow = -remaining;

    // Roles with a minimum (e.g. at least 1 gyilkos) that isn't currently met. Only
    // plain number-input roles can have minCount, and gyilkos is the only one so far.
    const unmetMinimums = ROLES.filter((r) => typeof r.minCount === 'number' && gyilkosCount < r.minCount);

    const warningEl = document.getElementById('role-capacity-warning');
    if (warningEl) {
      const messages = [];
      if (overflow > 0) {
        messages.push(`Több szerep van kiválasztva, mint ahány játékos van (${overflow} hellyel túl sok). Csökkents valamit, vagy adj hozzá több játékost.`);
      }
      unmetMinimums.forEach((r) => {
        messages.push(`Legalább ${r.minCount} ${r.name} kell.`);
      });
      warningEl.innerHTML = messages.map((msg) => `<div class="banner warn">${msg}</div>`).join('');
    }

    const blocked = totalPlayers < 3 || overflow > 0 || unmetMinimums.length > 0;
    const assignBtn = document.getElementById('assign-roles-btn');
    if (assignBtn) assignBtn.disabled = blocked;
    const autoAssignBtn = document.getElementById('auto-assign-btn');
    if (autoAssignBtn) autoAssignBtn.disabled = blocked;
  }

  function doAddPlayer() {
    const input = document.getElementById('new-player-name');
    Game.addPlayer(input.value);
    // Game.addPlayer() re-renders the setup screen synchronously, which replaces
    // this input with a fresh (empty) one - re-query it so focus lands on the new one.
    const freshInput = document.getElementById('new-player-name');
    if (freshInput) freshInput.focus();
  }

  // ---- Role assignment screen ("0. éjszaka") ----
  // One distinct role at a time, same look as the real night screen (renderNight).
  // Everyone stays visible on the board throughout: already-assigned players show
  // their role emoji and are locked. For roles with more than one slot (e.g. 2
  // gyilkos), pick all of them on this one screen - tap to select/deselect; once
  // full, tapping a new person bumps the oldest pick (see the click handler).
  // "Következő" confirms once the count matches; "Vissza" undoes the previous
  // role's confirmation so it can be redone.

  let assignSelectedIds = [];
  let swapSelectedId = null; // first tap on the "Szerepek kiosztva" board, until a second tap swaps roles

  function renderAssign(state) {
    const role = Game.currentAssignmentRole();
    const canGoBack = state.assignmentHistory.length > 0;

    if (!role) {
      // Queue empty - everyone has a role. Stay right here instead of dropping back
      // to the top of the SETUP screen; offer to start, or step back to fix a pick.
      // Tap-to-swap is only offered after an automatic (random) draw, which has no
      // per-role "Vissza" history to fix a mistake with - manual assignment already
      // has that (see canGoBack), and its roles get announced one by one as they're
      // handed out, so quietly swapping them afterward would be misleading.
      const swappable = !state.assignmentWasManual;
      const rows = [...state.players].sort((a, b) => roleSortIndex(a.roleId) - roleSortIndex(b.roleId)).map((p) => {
        const pRole = Game.getRole(p.roleId);
        const isSelected = swappable && p.id === swapSelectedId;
        const cls = swappable ? `swap-row${isSelected ? ' selected' : ''}` : '';
        const attrs = swappable ? `data-action="select-swap" data-id="${p.id}"` : '';
        return `<li class="${cls}" ${attrs}><span class="badge ${pRole.team}">${roleEmoji(pRole)}${pRole.name}</span><span>${escapeHtml(p.name)}</span></li>`;
      }).join('');
      app.innerHTML = `
        <div class="card">
          <div class="card-header-row">
            <h2>Szerepek kiosztva</h2>
            <button data-action="cancel-assignment">Mégse</button>
          </div>
          ${swappable ? '<p class="muted">Koppints két játékosra, hogy kicseréld a szerepüket.</p>' : ''}
          <ul class="player-list">${rows}</ul>
          <footer class="actions">
            ${canGoBack ? '<button data-action="assign-back">Vissza</button>' : ''}
            <button class="primary" data-action="start-game">Játék indítása</button>
          </footer>
        </div>
      `;
      return;
    }

    const capacity = state.assignmentTotalCounts[role.id] || 1;
    const promptText = capacity > 1
      ? `Válassz ki ${capacity} embert, akik ${role.name} lesznek! (${assignSelectedIds.length}/${capacity} kiválasztva)`
      : `Ki legyen a(z) ${role.name}?`;

    const board = state.players.map((p) => {
      if (p.roleId) {
        return `<button class="assignee-card assigned" disabled><span class="tile-name-line">${playerLabel(p)}</span></button>`;
      }
      const isSelected = assignSelectedIds.includes(p.id);
      const label = isSelected ? `${roleEmoji(role)}${escapeHtml(p.name)}` : escapeHtml(p.name);
      return `<button class="assignee-card${isSelected ? ' selected' : ''}" data-action="toggle-assignee" data-id="${p.id}"><span class="tile-name-line">${label}</span></button>`;
    }).join('');

    app.innerHTML = `
      <div class="card">
        <div class="card-header-row">
          <div class="night-role-header">
            ${roleEmoji(role, 'role-emoji-lg')}
            <h2>${role.name}</h2>
          </div>
          <button data-action="cancel-assignment">Mégse</button>
        </div>
        <p class="prompt">${promptText}</p>
        <div class="target-grid">${board}</div>
        <footer class="actions">
          ${canGoBack ? '<button data-action="assign-back">Vissza</button>' : ''}
          <button class="primary" data-action="confirm-assignment" ${assignSelectedIds.length === capacity ? '' : 'disabled'}>Következő</button>
        </footer>
      </div>
    `;
  }

  // ---- Night screen ----

  let investigatePendingTargetId = null; // Nyomozó's target, confirmed, waiting for the result to be acknowledged
  let linkSelectedIds = []; // Cupido's picks this night - up to 2, toggled on/off
  let killSelectedIds = []; // Gyilkos's picks this night - up to state.killsPerNight, toggled on/off
  let nightSelectedId = null; // single-target night action pick, until confirmed
  let maimPendingTargetId = null; // Csonkoló's target, confirmed, waiting for a body-part pick
  let maimSelectedPart = null; // 'kez' | 'nyelv' picked in the popup, until confirmed

  // Wraps a board (a target grid or a plain roster list) with a popup layered on top
  // of it - same look everywhere a turn needs to pause the narrator on something
  // (investigate's result, the Csonkoló's body-part pick, or a role nobody can act
  // out) instead of swapping to a separate screen. The board underneath keeps its
  // shape; the popup just covers it until dismissed/confirmed. dismissAction, if
  // given, is put on the backdrop itself so tapping outside the box (or on its
  // padding) triggers that action - the Csonkoló's body-part popup uses this so
  // "clicking away" cancels back to target-picking instead of needing its own button;
  // Nyomozó's result popup leaves this unset - it can only be advanced past via the
  // board's own "Következő" button, not dismissed by tapping away.
  function wrapWithPopup(contentHtml, popupHtml, dismissAction) {
    if (!popupHtml) return contentHtml;
    const dismissAttr = dismissAction ? ` data-action="${dismissAction}"` : '';
    return `
      <div class="target-grid-wrap">
        ${contentHtml}
        <div class="board-popup"${dismissAttr}><div class="board-popup-box">${popupHtml}</div></div>
      </div>
    `;
  }

  function renderNight(state) {
    const role = Game.currentNightRole();
    const canGoBackNight = state.nightActionHistory.length > 0;
    // Anyone abducted by the UFO can still be picked as a target by other roles too -
    // the action just won't have any effect on them (see game.js resolveNight/investigateResult).
    // The UFO itself can't pick itself either, but stays visible on the board (disabled)
    // instead of vanishing from the list - same for anyone else a role can't target.
    const targetable = Game.alivePlayers();

    // Nyomozó's result and the Csonkoló's body-part pick are both popups that sit on
    // top of their OWN role's target board, not the next one - Game.recordNightAction()/
    // recordMaimAction() only runs once the board's own "Következő" footer button is
    // pressed a second time (see the generic and maim branches below), so the board
    // underneath doesn't advance to the next role until then. Neither popup has a
    // button of its own - the shared footer button confirms both. The Csonkoló's
    // popup can also be cancelled by tapping away (back to target-picking); Nyomozó's
    // result can't - it only advances via the footer button.
    let popupHtml = '';
    let investigatePopupActive = false;
    let maimPopupActive = false;
    let popupDismissAction;
    if (investigatePendingTargetId) {
      // No dismissAction - unlike the Csonkoló's popup, tapping away doesn't cancel
      // this one, only the board's own "Következő" button does (see the generic
      // branch below, where nextAction/nextEnabled switch to confirm-investigate).
      investigatePopupActive = true;
      const result = Game.investigateResult(investigatePendingTargetId);
      const label = result && result.abducted ? 'Elrabolva' : teamLabelSingular(result ? result.team : '');
      // Elrabolva isn't a team, just the UFO having put them out of reach - its own
      // emoji. "Gyilkos" only means the gyilkosok TEAM (investigateResult() never
      // reveals the exact role), and Csonkoló is on that team too, so both of the
      // team's role emoji lead the label - the narrator can't tell which from this
      // alone, same as in the game itself.
      const icon = result && result.abducted ? roleActionEmoji('ufo')
        : result && result.team === 'gyilkosok' ? `${roleActionEmoji('gyilkos')}${roleActionEmoji('csonkolo')}`
        : result && result.team === 'polgarok' ? roleActionEmoji('polgar')
        : '';
      // Same .reason-line markup as the mock round's "meghalt/elrabolta" popup - not
      // .prompt - so the two boxes end up pixel-identical instead of drifting apart.
      popupHtml = `<div class="reason-line">${icon ? `${icon} ` : ''}${label}</div>`;
    } else if (maimPendingTargetId) {
      maimPopupActive = true;
      popupDismissAction = 'cancel-maim-target';
      popupHtml = `
        <p class="prompt">Melyik testrészét csonkítod meg?</p>
        <div class="popup-choice-row">
          <button class="${maimSelectedPart === 'kez' ? 'selected' : ''}" data-action="select-maim-part" data-part="kez">✋ Kéz<br>(nem szavazhat)</button>
          <button class="${maimSelectedPart === 'nyelv' ? 'selected' : ''}" data-action="select-maim-part" data-part="nyelv">👅 Nyelv<br>(nem beszélhet)</button>
        </div>
      `;
    }

    // No !role branch here - game.js auto-resolves the night the moment the queue
    // actually empties (see finishNightStep()), so renderNight() is never called
    // with an empty queue; the phase has already moved on to DAY/ENDED by then.

    if (!roleHasActor(state, role)) {
      // Every holder of this role is dead or was abducted tonight - the turn still
      // gets called (see beginNight()'s comment in game.js), but nothing can be picked.
      // Keep showing the normal-looking full board underneath; the popup covers it,
      // explaining why - either investigate's result if that's still pending, or this
      // role's own reason as a fallback. Dead holders aren't part of Game.alivePlayers()
      // any more, so they're spliced back in just for this board.
      const holders = state.players.filter((p) => p.roleId === role.id);
      const deadHolders = holders.filter((p) => !p.alive);
      // Same two-part tile markup (name line + reserved emoji line) as every other
      // night screen's target-grid, even though nothing goes in the emoji line here -
      // otherwise these tiles come out shorter than the ones on other roles' turns,
      // and the whole board visibly jumps in height when moving to/from this screen.
      const board = [...Game.alivePlayers(), ...deadHolders]
        .map((p) => `<button disabled><span class="tile-name-line">${playerLabel(p)}</span><span class="tile-emoji-line"></span></button>`)
        .join('');
      const reasonLines = holders.map((p) => {
        const reason = !p.alive ? '💀 Meghalt' : `${roleActionEmoji('ufo')} Elrabolta az UFO`;
        return `<div class="reason-line">${reason}</div>`;
      }).join('');
      app.innerHTML = `
        <div class="card">
          <div class="night-role-header">
            ${roleEmoji(role, 'role-emoji-lg')}
            <h2>${role.name}</h2>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          ${wrapWithPopup(`<div class="target-grid">${board}</div>`, popupHtml || reasonLines, popupHtml ? popupDismissAction : undefined)}
          <footer class="actions">
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button class="primary" data-action="skip-night">Tovább</button>
          </footer>
        </div>
      `;
      return;
    }

    if (role.nightAction === 'link') {
      const capacity = 2;
      const board = targetable.map((p) => {
        const isSelected = linkSelectedIds.includes(p.id);
        // Once both picks are made, each tile gets told about the other via
        // tentativePartnerId - nightOutcomeByRole() then previews everything a
        // confirmed bond between them would cause (abduction chain-drag, a
        // Katona's immunity, the kill itself, all dimmed the same way as an
        // already-voided one) before "Összekötés" is even pressed.
        const tentativeOpts = isSelected && linkSelectedIds.length === 2
          ? { tentativePartnerId: linkSelectedIds.find((id) => id !== p.id) }
          : undefined;
        const preview = isSelected ? roleActionEmoji('cupido') : '';
        return `<button class="assignee-card${isSelected ? ' selected' : ''}" data-action="toggle-link-target" data-id="${p.id}">${nightTileLabel(state, p, preview, 'cupido', tentativeOpts)}</button>`;
      }).join('');

      app.innerHTML = `
        <div class="card">
          <div class="night-role-header">
            ${roleEmoji(role, 'role-emoji-lg')}
            <h2>${role.name}</h2>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          <p class="muted">Válassz ki két embert, akiket ma éjjelre összekötsz. (${linkSelectedIds.length}/2 kiválasztva)</p>
          ${wrapWithPopup(`<div class="target-grid">${board}</div>`, popupHtml, popupDismissAction)}
          <footer class="actions">
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button data-action="skip-night">Kihagyás</button>
            <button class="primary" data-action="confirm-link" ${linkSelectedIds.length === capacity ? '' : 'disabled'}>Összekötés</button>
          </footer>
        </div>
      `;
      return;
    }

    if (role.nightAction === 'kill') {
      // Gyilkos picks state.killsPerNight targets at once (1 by default, see the
      // setup screen) - same multi-select pattern as Cupido, just with a
      // configurable capacity instead of a fixed 2, and its own recorder
      // (recordKillAction) since the generic single-target one only ever handles
      // exactly one pick. Game.killCapacity() clamps that setting down to however
      // many players are actually still alive, so a high killsPerNight can never
      // leave this permanently unreachable late-game.
      const capacity = Game.killCapacity();
      const killPartnerIds = killSelectedIds.map((id) => linkedPartnerId(state, id)).filter(Boolean);
      const board = targetable.map((p) => {
        const isSelected = killSelectedIds.includes(p.id);
        const preview = isSelected || killPartnerIds.includes(p.id) ? '💀' : '';
        return `<button class="assignee-card${isSelected ? ' selected' : ''}" data-action="toggle-kill-target" data-id="${p.id}">${nightTileLabel(state, p, preview, 'gyilkos')}</button>`;
      }).join('');

      app.innerHTML = `
        <div class="card">
          <div class="night-role-header">
            ${roleEmoji(role, 'role-emoji-lg')}
            <h2>${role.name}</h2>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          <p class="muted">Válassz ki ${capacity} embert, akiket ma éjjel megöltök. (${killSelectedIds.length}/${capacity} kiválasztva)</p>
          ${wrapWithPopup(`<div class="target-grid">${board}</div>`, popupHtml, popupDismissAction)}
          <footer class="actions">
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button data-action="skip-night">Kihagyás</button>
            <button class="primary" data-action="confirm-kill" ${killSelectedIds.length === capacity ? '' : 'disabled'}>Következő</button>
          </footer>
        </div>
      `;
      return;
    }

    if (role.nightAction === 'maim') {
      // The body-part choice is a popup on top of this same board (built above into
      // popupHtml when maimPendingTargetId is set) instead of a separate screen - the
      // target-picking step just stays visible underneath while it's open. The same
      // "Következő" footer button drives both steps: picks the target first, then
      // (once the popup is open) confirms the selected body part.
      const selectedPartnerId = nightSelectedId ? linkedPartnerId(state, nightSelectedId) : null;
      // The UFO and Orvos have both already acted by Csonkoló's turn (see
      // ROLE_ORDER in roles.js), so tapping a candidate they already voided
      // already shows a dimmed 🪚 here, before "Következő" even picks a body part.
      const candidateVoided = !!nightSelectedId && maimIsVoided(state, nightSelectedId, { tentativeTargetId: nightSelectedId });
      const targets = targetable.map((p) => {
        const isSelected = p.id === nightSelectedId;
        const csonkoloEmoji = candidateVoided ? voidedMarker(roleActionEmoji('csonkolo')) : roleActionEmoji('csonkolo');
        const preview = (isSelected || p.id === selectedPartnerId) ? csonkoloEmoji : '';
        return `<button class="${isSelected ? 'selected' : ''}" data-action="select-night-target" data-id="${p.id}">${nightTileLabel(state, p, preview, 'csonkolo')}</button>`;
      }).join('');
      const nextAction = maimPopupActive ? 'confirm-maim-part' : 'confirm-maim-target';
      const nextEnabled = maimPopupActive ? !!maimSelectedPart : !!nightSelectedId;
      app.innerHTML = `
        <div class="card">
          <div class="night-role-header">
            ${roleEmoji(role, 'role-emoji-lg')}
            <h2>${role.name}</h2>
          </div>
          <p class="prompt">${role.actionPrompt || ''}</p>
          ${wrapWithPopup(`<div class="target-grid">${targets}</div>`, popupHtml, popupDismissAction)}
          <footer class="actions">
            <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
            <button data-action="skip-night">Kihagyás</button>
            <button class="primary" data-action="${nextAction}" ${nextEnabled ? '' : 'disabled'}>Következő</button>
          </footer>
        </div>
      `;
      return;
    }

    // Gyilkos has its own branch above (multi-select) - only Orvos/Pék (bond-
    // transfer) and Nyomozó/UFO (no bond-transfer) reach here.
    const selectedPartnerId = nightSelectedId ? linkedPartnerId(state, nightSelectedId) : null;
    // Same idea as Cupido's tentativePartnerId, for the two roles whose own pick
    // can void an already-shown Gyilkos/Katona/Orvos marker: the UFO (abduct) and
    // Orvos (protect) both act after Gyilkos, so tapping (not yet confirming) a
    // candidate who's already a kill target should immediately preview the void,
    // not just after "Következő". Passed to every tile, not just the selected
    // one, so a bond-transfer partner (see bondTransfers below) sees it too.
    const tentativeOpts = !nightSelectedId ? undefined
      : role.id === 'ufo' ? { tentativeAbductedId: nightSelectedId }
      : role.id === 'orvos' ? { tentativeProtectedId: nightSelectedId }
      : undefined;
    // Protecting someone the UFO already took is moot - they're untouchable
    // tonight regardless of the bond, same as a voided kill/maim - so the Orvos's
    // own 🩹 preview (and the bond-transfer partner's, if any) shows dimmed as
    // soon as an already-abducted candidate is tapped, not just after confirming.
    const orvosTargetAbducted = role.id === 'orvos' && !!nightSelectedId && state.abductedIds.includes(nightSelectedId);
    const targets = targetable.map((p) => {
      const isSelected = p.id === nightSelectedId;
      // The UFO can't abduct itself, and there's no point in the Nyomozó investigating
      // themselves - both still shown on the board, just disabled.
      const selectable = !((role.id === 'ufo' && p.roleId === 'ufo') || (role.id === 'nyomozo' && p.roleId === 'nyomozo'));
      const bondTransfers = role.id === 'orvos' || role.id === 'pek';
      const roleEmojiHere = orvosTargetAbducted ? voidedMarker(roleActionEmoji(role.id)) : roleActionEmoji(role.id);
      const partnerPreview = bondTransfers && p.id === selectedPartnerId ? roleEmojiHere : '';
      const preview = isSelected ? roleEmojiHere : partnerPreview;
      const cls = isSelected ? 'selected' : '';
      const attrs = selectable ? `data-action="select-night-target" data-id="${p.id}"` : 'disabled';
      return `<button class="${cls}" ${attrs}>${nightTileLabel(state, p, preview, role.id, tentativeOpts)}</button>`;
    }).join('');

    // The same "Következő" footer button drives both steps of Nyomozó's investigate,
    // same as the Csonkoló's maim: picks the target first, then (once the result
    // popup is open) acknowledges it and actually advances.
    const nextAction = investigatePopupActive ? 'confirm-investigate' : 'confirm-night-target';
    const nextEnabled = investigatePopupActive ? true : !!nightSelectedId;

    app.innerHTML = `
      <div class="card">
        <div class="night-role-header">
          ${roleEmoji(role, 'role-emoji-lg')}
          <h2>${role.name}</h2>
        </div>
        <p class="prompt">${role.actionPrompt || ''}</p>
        ${wrapWithPopup(`<div class="target-grid">${targets}</div>`, popupHtml, popupDismissAction)}
        <footer class="actions">
          <button data-action="night-back" ${canGoBackNight ? '' : 'disabled'}>Vissza</button>
          <button data-action="skip-night">Kihagyás</button>
          <button class="primary" data-action="${nextAction}" ${nextEnabled ? '' : 'disabled'}>Következő</button>
        </footer>
      </div>
    `;
  }

  // ---- Day screen ----

  let daySelectedId = null; // single-target day pick (elimination or a Vadász's shot), until confirmed

  function renderDay(state) {
    const alive = Game.alivePlayers();
    const deaths = state.pendingDeaths
      .map((id) => state.players.find((p) => p.id === id))
      .filter(Boolean);

    // Never the affected PLAYER's own role emoji (that would leak who they are) -
    // but every banner below leads with the ACTING role's own emoji, labelling
    // which mechanic the line is about, same as abductBanner/cupidoBanner/
    // healBanner further down.
    const deathBanner = deaths.length === 0
      ? `<div class="banner info">Mindenki túlélte az éjszakát.</div>`
      : `<div class="banner warn">Éjjel meghalt: <strong>${deaths.map((p) => escapeHtml(p.name)).join(', ')}</strong></div>`;

    // Most roles die anonymously (only the name is announced above) - a few (see
    // roles.js's revealRoleOnDeath) get their own separate line naming the role -
    // that role's own emoji, since the point here is exactly to reveal it.
    const revealBanner = deaths
      .map((p) => Game.getRole(p.roleId))
      .filter((role) => role && role.revealRoleOnDeath)
      .map((role) => `<div class="banner warn">${roleEmoji(role)} Meghalt a ${escapeHtml(role.name)}!</div>`)
      .join('');

    const breadAction = state.nightActions['pek'];
    // Cupido's bond drags the partner in here too, same as the other night actions.
    const breadPartnerId = breadAction ? linkedPartnerId(state, breadAction.targetId) : null;
    const breadRecipients = breadAction
      ? [breadAction.targetId, breadPartnerId].filter(Boolean).map((id) => state.players.find((p) => p.id === id)).filter(Boolean)
      : [];
    const breadBanner = breadRecipients.length
      ? `<div class="banner info">${roleActionEmoji('pek')} Ma reggel kenyeret kapott: <strong>${breadRecipients.map((p) => escapeHtml(p.name)).join(', ')}</strong></div>`
      : '';

    // Unifies both starvation triggers (see resolveNight() in game.js) into one
    // user-facing "days without bread" count - the Pék being dead, or the UFO
    // having abducted them repeatedly, both mean nobody's gotten bread. Reaching 3
    // already ends the game during resolveNight(), before this screen can ever
    // render, so this only ever shows 0-2 here.
    const daysWithoutBread = state.pekDeathRound !== null
      ? state.round - state.pekDeathRound
      : state.pekConsecutiveAbductions;
    const starvationBanner = daysWithoutBread > 0
      ? `<div class="banner warn">${roleActionEmoji('pek')} Kenyér nélkül eltelt napok: <strong>${daysWithoutBread}/3</strong></div>`
      : '';

    const maimBanner = state.pendingMaim
      .map((m) => ({ ...m, player: state.players.find((p) => p.id === m.targetId) }))
      .filter((m) => m.player && m.player.alive)
      .map((m) => `<div class="banner warn">${roleActionEmoji('csonkolo')} <strong>${escapeHtml(m.player.name)}</strong> ma ${m.bodyPart === 'kez' ? 'nem szavazhat' : 'nem beszélhet'}.</div>`)
      .join('');

    // Every abducted id, direct UFO pick or a Cupido-bonded partner chain-dragged
    // along (see recordLinkAction() in game.js) - both were "taken" as far as the
    // group's concerned. Each of these three banners leads with the acting role's
    // own emoji (not the affected player's - that's still never shown here, see
    // the plain-names note above) just to label which mechanic the line is about.
    const abductedPlayers = state.abductedIds.map((id) => state.players.find((p) => p.id === id)).filter(Boolean);
    const abductBanner = abductedPlayers.length
      ? `<div class="banner info">${roleActionEmoji('ufo')} Az UFO elrabolta: <strong>${abductedPlayers.map((p) => escapeHtml(p.name)).join(', ')}</strong></div>`
